<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>方向测试</title>
<style>
body { font-family: Arial; background: #222; color: #fff; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
.card { background: #333; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; }
.card:hover { background: #444; }
canvas { image-rendering: pixelated; background: #555; width: 128px; height: 128px; border: 2px solid #666; }
.selected { border-color: #0f0 !important; }
h2 { margin: 0; font-size: 16px; }
p { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<h1>选择正确的正面视角</h1>
<p>点击您认为是"正面"（球员面向观众）的卡片</p>
<div class="grid" id="grid"></div>
<p id="result" style="margin-top: 20px; font-size: 18px; color: #0f0;"></p>

<script src="lpc-renderer.js"></script>
<script>
const generator = new LPCPlayerGenerator();

const appearance = {
  bodyType: 'male',
  headType: 'male',
  skinTone: 'light',
  hairstyle: 'plain',
  hairColor: 'brown',
  jerseyStyle: 'tshirt',
  jerseyColor: 'red',
  shortsStyle: 'pantaloons',
  shortsColor: 'white',
  bootsStyle: 'booties',
  bootsColor: 'black'
};

const grid = document.getElementById('grid');
const directions = [
  { value: 0, name: 'direction=0', desc: '向下' },
  { value: 1, name: 'direction=1', desc: '向左' },
  { value: 2, name: 'direction=2', desc: '向右' },
  { value: 3, name: 'direction=3', desc: '向上' }
];

async function test() {
  for (const dir of directions) {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => {
      document.querySelectorAll('.card canvas').forEach(c => c.classList.remove('selected'));
      card.querySelector('canvas').classList.add('selected');
      document.getElementById('result').textContent = `您选择了: ${dir.name} (${dir.desc}) - 这是您认为的正面视角`;
    };
    
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    
    const label = document.createElement('h2');
    label.textContent = dir.name;
    
    const desc = document.createElement('p');
    desc.textContent = dir.desc;
    
    card.appendChild(canvas);
    card.appendChild(label);
    card.appendChild(desc);
    grid.appendChild(card);
    
    try {
      const sprite = await generator.generatePlayerSprite(appearance, 'idle', dir.value, false);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite, 0, 0);
    } catch(e) {
      console.error(`direction ${dir.value} failed:`, e);
    }
  }
}

test();
</script>
</body>
</html>
