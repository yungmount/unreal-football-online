<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Football Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root { --gold: #ffd700; --cyan: #00d4ff; --purple: #9333ea; --green: #22c55e; --red: #ef4444; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%); color: #fff; overflow-x: hidden; }
        .game-title { font-family: 'Orbitron', sans-serif; }
        .card { background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95)); border: 1px solid rgba(0,212,255,0.2); border-radius: 16px; backdrop-filter: blur(10px); }
        .btn-game { background: linear-gradient(135deg, var(--cyan), #0099cc); border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; color: #000; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,212,255,0.3); text-transform: uppercase; letter-spacing: 1px; }
        .btn-game:active { transform: scale(0.95); }
        .btn-game.gold { background: linear-gradient(135deg, var(--gold), #b8860b); box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .btn-game.green { background: linear-gradient(135deg, var(--green), #16a34a); }
        .btn-game.red { background: linear-gradient(135deg, var(--red), #dc2626); }
        .btn-game.purple { background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; }
        .lang-btn { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
        .lang-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.2s; }
        .nav-btn.active { color: var(--cyan); }
        .nav-btn .icon { font-size: 18px; }
        .nav-btn .text { font-size: 9px; margin-top: 2px; }
        .stat-bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.5); overflow: hidden; }
        .stat-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.95)); padding: 12px 24px; border-radius: 30px; font-weight: 600; z-index: 100; box-shadow: 0 4px 20px rgba(34,197,94,0.4); }
        .player-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 12px; position: relative; cursor: pointer; transition: all 0.2s; }
        .player-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
        .player-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--cyan), var(--gold)); }
        .player-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); overflow: hidden; }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .event-goal { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .event-shot { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
        .event-foul { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .event-card { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
        .event-pass { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        .standings-row { display: grid; grid-template-columns: 30px 1fr 40px 50px; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; align-items: center; font-size: 13px; }
        .standings-row.me { background: linear-gradient(90deg, rgba(0,212,255,0.3), transparent) !important; border: 1px solid rgba(0,212,255,0.5); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse { animation: pulse 1s infinite; }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
    // ==================== Player Name Database (FC26 Style) ====================
    const PLAYER_NAMES = {

        Argentina: ['Lionel Messi','Lautaro Martinez','Julian Alvarez','Angel Di Maria','Gonzalo Montiel','Lisandro Martinez','Enzo Fernandez','Alexis Mac Allister','Cristian Romero','Emiliano Martinez','Nicolas Otamendi','Nahuel Molina','Marcos Acuna','Giovani Lo Celso','Rodrigo De Paul','Leandro Paredes','Julian Alvarez','Exequiel Palacios','Geronimo Rulli','Juan Foyth'],
        Italy: ['Gianluigi Donnarumma','Alessandro Bastoni','Nicolo Barella','Leonardo Bonucci','Federico Chiesa','Ciro Immobile','Rafael Leao','Mike Maignan','Theo Hernandez','Sandro Tonali','Davide Calabria','Alessio Romagnoli','Gianluca Mancini','Bryan Cristante','Lorenzo Pellegrini','Gianluca Scamacca','Matteo Politano','Domenico Berardi','Lorenzo Lucca','Patrick Cutrone'],
        Nigeria: ['Victor Osimhen','Wilfred Ndidi','Kelechi Iheanacho','Samuel Chukwueze','Ola Aina','Zaidu Sanusi','Chidera Ejuke','Taiwo Awoniyi','Chukwueze','Nathaniel Tiole','Brighton','Akintola','Kelechi Iheanacho','John Obi Mikel','William Troost-Ekong','Semi Ajayi','Leon Balogun','Calvin Bassey','Moses Simon','Ademola Lookman'],
        Japan: ['Takefusa Kubo','Daichi Kamada','Wataru Endo','Takehiro Tomiyasu','Kaoru Mitoma','Junya Ito','Hiroki Sakai','Wataru Endo','Daizen Maeda','Ayase Ueda','Kaoru Mitoma','Daichi Kamada','Takefusa Kubo','Ritsu Doan','Junya Ito','Ko Itakura','Yuki Kobayashi','Shogo Taniguchi','Wataru Ito','Koki Saito'],
        Korea: ['Son Heung-min','Lee Kang-in','Kim Min-jae','Hwang Hee-chan','Cho Gue-sung','Kim Young-gwon','Seol Ki-hyeon','Lee Jae-sung','Hwang In-beom','Park Ji-soo','Kim Jin-hyeon','Seung-gyu Kim','Young-gwon Kim','Woo-young Jung','Hee-chan Hwang','Gue-sung Cho','Kang-in Lee','Seung-ho Paik','Min-jae Kim','Jae-sung Lee'],
        China: ['Wu Lei','Zhang Yuning','Wang Dalei','Yan Junling','Kou Zhun','Gao Lin','Zheng Zhi','Feng Xiaoting','Wu Lei','Zhang Yuning','Wei Shihao','Liu Yang','Jiang Guangtai','Dai Lin','Li Kai','Zhang Jiazhen','Zhang Ruofan','Liu Binbin','Wei Shihao','Tan Tianxiao'],
        USA: ['Christian Pulisic','Weston McKennie','Sergiño Dest','Antonee Robinson','Tyler Adams','Yunus Musah','Gio Reyna','Folarin Balogun','Joe Scally','Tim Weah','Brenden Aaronson','Ricardo Pepi','Mark McKenzie','Cameron Carter-Vickers','Miles Robinson','Aaron Long','DeJuan Jones','Kristoffer Olsson','Gabriel Heinze','Sebastian Lletget']
    };

    // ==================== Avatar Generation (Local SVG) ====================
    function generateLocalAvatar(name, region) {
        // 生成一个基于名字的独特 SVG 头像
        const seed = name.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
        
        const skinTones = {
            England: ['#FFDFC4', '#F0C8A0', '#E8B796'],
            Spain: ['#FFDFC4', '#F0C8A0', '#D4A574'],
            Germany: ['#FFE0BD', '#F5D0A9', '#E8C4A0'],
            France: ['#FFDFC4', '#F0C8A0', '#E8B796'],
            Brazil: ['#D4A574', '#C4956A', '#B07850'],
            Argentina: ['#FFDFC4', '#E8C4A0', '#D4A574'],
            Italy: ['#FFDFC4', '#F0C8A0', '#E8B796'],
            Nigeria: ['#8B5A2B', '#704214', '#5C3317'],
            Japan: ['#FFE4C4', '#F5D0A9', '#E8C4A0'],
            Korea: ['#FFE4C4', '#F5D0A9', '#E8C4A0'],
            China: ['#FFE4C4', '#F5D0A9', '#E8C4A0'],
            USA: ['#FFDFC4', '#F0C8A0', '#D4A574', '#8B5A2B']
        };
        
        const colors = skinTones[region] || skinTones['USA'];
        const skinColor = colors[seed % colors.length];
        
        const hairColors = ['#2C1810', '#4A3728', '#8B4513', '#D4A574', '#1C1C1C', '#8B0000'];
        const hairColor = hairColors[seed % hairColors.length];
        
        // 根据名字首字母决定发型
        const firstChar = name.charCodeAt(0);
        const hairStyle = firstChar % 3; // 0: 短发, 1: 中发, 2: 长发
        
        const hairPaths = [
            // 短发
            `<ellipse cx="50" cy="25" rx="28" ry="15" fill="${hairColor}"/>`,
            // 中发
            `<ellipse cx="50" cy="25" rx="30" ry="18" fill="${hairColor}"/><ellipse cx="25" cy="40" rx="8" ry="15" fill="${hairColor}"/><ellipse cx="75" cy="40" rx="8" ry="15" fill="${hairColor}"/>`,
            // 长发
            `<ellipse cx="50" cy="25" rx="32" ry="20" fill="${hairColor}"/><ellipse cx="22" cy="45" rx="10" ry="20" fill="${hairColor}"/><ellipse cx="78" cy="45" rx="10" ry="20" fill="${hairColor}"/>`
        ];
        
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="bg${seed}" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#667eea"/>
                    <stop offset="100%" style="stop-color:#764ba2"/>
                </linearGradient>
                <filter id="shadow${seed}">
                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
                </filter>
            </defs>
            <circle cx="50" cy="50" r="50" fill="url(#bg${seed})"/>
            ${hairPaths[hairStyle]}
            <ellipse cx="50" cy="55" rx="28" ry="30" fill="${skinColor}"/>
            <ellipse cx="50" cy="50" rx="25" ry="25" fill="${skinColor}"/>
            <circle cx="40" cy="46" r="4" fill="#1a1a1a"/>
            <circle cx="60" cy="46" r="4" fill="#1a1a1a"/>
            <circle cx="41" cy="45" r="1.5" fill="white"/>
            <circle cx="61" cy="45" r="1.5" fill="white"/>
            <ellipse cx="50" cy="56" rx="3" ry="2" fill="#E8A87C"/>
            <path d="M 42 64 Q 50 70 58 64" stroke="#C96B6B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="35" cy="52" rx="5" ry="3" fill="rgba(255,150,150,0.3)"/>
            <ellipse cx="65" cy="52" rx="5" ry="3" fill="rgba(255,150,150,0.3)"/>
        </svg>`;
        
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // ==================== I18n ====================
    const I18N = {
        en: {
            appName: "Dream Football", home: "Home", team: "Squad", tactics: "Tactics", facility: "Facility", match: "Match",
            budget: "Budget", round: "Round {0}", season: "Season {0}", rank: "Rank", record: "Record", gd: "GD",
            win: "W", draw: "D", lose: "L", pts: "PTS", play: "Play Match", train: "Train", refresh: "Refresh",
            academy: "Academy", market: "Transfer Market", standings: "Standings", sign: "Sign", reject: "Release",
            goals: "G", assists: "A", matches: "M", fitness: "FIT", morale: "MOR", pace: "PAC", shooting: "SHO",
            passing: "PAS", defending: "DEF", physical: "PHY", formation: "Formation", style: "Style", upgrade: "Upgrade",
            attack: "Attack", balance: "Balance", defend: "Defend", income: "Income", level: "Level", potential: "Potential",
            age: "Age", overall: "OVR", height: "Height", weight: "Weight", value: "Value", wage: "Wage", position: "Position",
            signed: "Signed!", noMoney: "Not enough funds!", trained: "Trained!", upgraded: "Upgraded!", back: "Back",
            all: "All", goalkeeper: "GK", defenders: "DEF", midfielders: "MID", attackers: "ATT", live: "LIVE",
            halfTime: "Half Time", fullTime: "Full Time", extraTime: "Extra Time", penalties: "Penalties",
            details: "Details", buy: "Buy", sell: "Sell", signFee: "Sign Fee", abilities: "Abilities"
        },
        zh: {
            appName: "梦幻足球", home: "首页", team: "阵容", tactics: "战术", facility: "设施", match: "比赛",
            budget: "资金", round: "第{0}轮", season: "赛季{0}", rank: "排名", record: "战绩", gd: "净胜",
            win: "胜", draw: "平", lose: "负", pts: "分", play: "开始比赛", train: "训练", refresh: "刷新",
            academy: "青训", market: "转会市场", standings: "积分榜", sign: "签约", reject: "放弃",
            goals: "球", assists: "助", matches: "场", fitness: "体", morale: "气", pace: "速", shooting: "射",
            passing: "传", defending: "防", physical: "体", formation: "阵型", style: "战术", upgrade: "升级",
            attack: "进攻", balance: "平衡", defend: "防守", income: "收入", level: "等级", potential: "潜力",
            age: "年龄", overall: "总评", height: "身高", weight: "体重", value: "身价", wage: "周薪", position: "位置",
            signed: "签约成功!", noMoney: "资金不足!", trained: "训练完成!", upgraded: "升级成功!", back: "返回",
            all: "全部", goalkeeper: "门将", defenders: "后卫", midfielders: "中场", attackers: "前锋", live: "直播",
            halfTime: "半场", fullTime: "全场", extraTime: "加时赛", penalties: "点球大战",
            details: "详情", buy: "购买", sell: "出售", signFee: "签约费", abilities: "能力"
        }
    };

    let LANG = 'en';
    function t(key, ...args) { let text = I18N[LANG][key] || key; args.forEach((v, i) => text = text.replace(`{${i}}`, v)); return text; }
    function fmt(n) { if (n >= 1000000) return '€' + (n / 1000000).toFixed(1) + 'M'; if (n >= 1000) return '€' + (n / 1000).toFixed(0) + 'K'; return '€' + n; }
    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const uid = () => 'p' + Date.now() + Math.random().toString(36).substr(2, 6);

    // ==================== Game State ====================
    let game = null;
    let currentTab = 'home';
    let filterPos = 'all';
    let showToast = null;
    let matchState = null;
    let selectedPlayer = null;
    let canvas, ctx;
    let animationId = null;

    // ==================== Player Creation ====================
    function generatePlayerStats(position, age) {
        const heightBase = { GK: rand(188, 196), CB: rand(184, 193), LB: rand(177, 185), RB: rand(177, 185), CDM: rand(180, 188), CM: rand(177, 185), CAM: rand(175, 182), LW: rand(172, 180), RW: rand(172, 180), ST: rand(179, 191) };
        const base = heightBase[position] || 180;
        const growthFactor = age < 20 ? (20 - age) * 0.08 : 0;
        const height = Math.round(base - growthFactor);
        const weight = Math.round(height * 0.65 + rand(-5, 5));
        return { height, weight };
    }

    function createPlayer(region, position, quality = 60) {
        const age = rand(17, 35);
        const names = PLAYER_NAMES[region] || PLAYER_NAMES['England'];
        const name = names[rand(0, names.length - 1)];
        
        const posBonus = {
            GK: { pace: -20, shooting: -25, defending: 20, passing: 5 },
            CB: { pace: -5, shooting: -15, defending: 25, physical: 20 },
            LB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            RB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            CDM: { pace: 0, shooting: -5, defending: 15, passing: 15 },
            CM: { pace: 5, shooting: 10, defending: 5, passing: 18 },
            CAM: { pace: 10, shooting: 18, defending: -5, passing: 15 },
            LW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            RW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            ST: { pace: 12, shooting: 25, defending: -15, physical: 15 }
        };
        
        const b = posBonus[position] || {};
        const potential = Math.min(99, quality + rand(5, 22));
        const baseOvr = Math.max(30, Math.min(99, quality + rand(-8, 8)));
        const baseValue = Math.floor(baseOvr * 8000 * (age < 22 ? 1.6 : age < 26 ? 1.2 : age < 30 ? 0.8 : 0.35));
        const stats = generatePlayerStats(position, age);
        
        return {
            id: uid(), name, region, position, age, ovr: baseOvr,
            pace: Math.max(30, Math.min(99, rand(50, 85) + (b.pace || 0))),
            shooting: Math.max(30, Math.min(99, rand(40, 80) + (b.shooting || 0))),
            passing: Math.max(30, Math.min(99, rand(45, 85) + (b.passing || 0))),
            defending: Math.max(30, Math.min(99, rand(40, 80) + (b.defending || 0))),
            physical: Math.max(30, Math.min(99, rand(50, 85) + (b.physical || 0))),
            potential, fitness: rand(75, 100), morale: rand(60, 100),
            value: Math.floor(baseValue * rand(80, 120) / 100),
            wage: Math.floor(baseOvr * 80 * rand(80, 120) / 100),
            goals: 0, assists: 0, matches: 0,
            height: stats.height, weight: stats.weight,
            avatar: generateLocalAvatar(name, region)
        };
    }

    // ==================== Game Init ====================
    function initGame() {
        const saved = localStorage.getItem('football_v10_save');
        if (saved) {
            try {
                game = JSON.parse(saved);
                // 重新生成头像
                game.team.forEach(p => p.avatar = generateLocalAvatar(p.name, p.region));
                game.market.forEach(p => p.avatar = generateLocalAvatar(p.name, p.region));
                game.prospects.forEach(p => p.avatar = generateLocalAvatar(p.name, p.region));
                return;
            } catch(e) {}
        }
        
        game = { budget: 5000000, team: [], league: [], facilities: { training: 1, academy: 1, stadium: 1 },
            season: 1, week: 1, day: 0, formation: '4-4-2', tactic: 'balance', market: [], prospects: [], news: [] };
        
        const positions = ['GK','CB','CB','CB','LB','RB','CDM','CM','CM','CAM','LW','RW','ST','ST','CM','CDM','CB','LB','RB','GK','CM','ST'];
        const regions = ['England','Spain','Brazil','Germany','France','Italy','Argentina','Portugal','Nigeria','Japan','Korea','China','USA','Mexico','England','Spain','Brazil','Germany','France','Italy','Argentina','Portugal'];
        
        for (let i = 0; i < 22; i++) {
            game.team.push(createPlayer(regions[i], positions[i], rand(58, 72)));
        }
        
        const teamNames = {
            en: ['FC United','Athletic Club','Dragon FC','Lion SC','Red Stars','Blue Moon','Green FC','Phoenix FC','Silver Eagles','Golden Snakes','Violets','Panthers'],
            zh: ['FC联','竞技俱乐部','龙之队','雄狮FC','红星队','蓝月亮','绿茵FC','凤凰FC','银鹰SC','金蛇队','紫百合','黑豹FC']
        };
        
        game.league = teamNames.en.map((name, i) => ({ name, index: i, strength: rand(40, 88), played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, pts: 0 }));
        game.leagueNames = teamNames;
    }

    function save() { localStorage.setItem('football_v10_save', JSON.stringify(game)); }
    function getLeagueName(i) { return LANG === 'zh' ? game.leagueNames.zh[i] : game.leagueNames.en[i]; }

    // ==================== Game Actions ====================
    function refreshMarket() {
        const q = 55 + game.facilities.academy * 3;
        game.market = [];
        const regions = ['England', 'Spain', 'Brazil', 'Germany', 'France', 'Italy', 'Argentina'];
        for (let i = 0; i < 6; i++) {
            const p = createPlayer(regions[rand(0, regions.length - 1)], ['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST'][rand(0, 9)], rand(q - 10, q + 15));
            p.askPrice = Math.floor(p.value * rand(75, 125) / 100);
            game.market.push(p);
        }
        save();
    }

    function scoutAcademy() {
        const count = 2 + Math.floor(game.facilities.academy / 2);
        const q = 42 + game.facilities.academy * 4;
        game.prospects = [];
        for (let i = 0; i < Math.min(count, 4); i++) {
            game.prospects.push(createPlayer('China', ['GK','CB','CM','ST'][rand(0, 3)], rand(q - 12, q + 12)));
        }
        addNews(`🌟 Academy found ${game.prospects.length} talents!`);
    }

    function trainTeam() {
        const bonus = 1 + game.facilities.training * 0.18;
        game.team.forEach(p => {
            if (p.age < 29 && p.ovr < p.potential) {
                const gain = Math.floor(rand(0, 2) * bonus);
                if (gain > 0) {
                    p.ovr = Math.min(p.potential, p.ovr + gain);
                    if (rand(1, 100) <= 25) {
                        const stats = ['pace', 'shooting', 'passing', 'defending', 'physical'];
                        p[stats[rand(0, 4)]] = Math.min(99, p[stats[rand(0, 4)]] + 1);
                    }
                }
            }
            p.fitness = Math.min(100, p.fitness + rand(8, 18));

    // ==================== Match System ====================
    const FORMATION_POSITIONS = {
        '4-4-2': [
            {x:0.08,y:0.5},{x:0.22,y:0.15},{x:0.22,y:0.4},{x:0.22,y:0.6},{x:0.22,y:0.85},

            {x:0.52,y:0.35},{x:0.52,y:0.65}
        ]
    };

    function startMatch() {
        currentTab = 'match';
        matchState = null;
        render();
        
        const formationPos = FORMATION_POSITIONS[game.formation] || FORMATION_POSITIONS['4-4-2'];
        const myTeam = game.team.slice(0, 11).map((p, i) => {
            const pos = formationPos[i] || {x:0.3 + (i%3)*0.1, y:0.2 + Math.floor(i/3)*0.2};
            return {...p, x: pos.x, y: pos.y, vx: 0, vy: 0, homeX: pos.x, homeY: pos.y};
        });
        
        const oppIdx = rand(1, game.league.length - 1);
        const oppStrength = game.league[oppIdx].strength;
        const oppRegion = ['England','Spain','Brazil','Germany','France'][rand(0,4)];
        const oppTeam = [];
        const oppPos = formationPos.map(p => ({x: 1-p.x, y: p.y}));
        ['GK','CB','CB','LB','RB','CDM','CM','CM','LW','ST','RW'].forEach((pos, i) => {
            const p = createPlayer(oppRegion, pos, oppStrength);
            const o = oppPos[i] || {x:0.7, y:0.5};
            oppTeam.push({...p, x: o.x, y: o.y, vx: 0, vy: 0, homeX: o.x, homeY: o.y});
        });
        
        matchState = {
            myTeam, oppTeam,
            oppName: getLeagueName(oppIdx),
            myScore: 0, oppScore: 0,
            minute: 0, second: 0, extraTime: false, penalties: false,
            events: [],
            ball: {x:0.5, y:0.5, vx:0, vy:0, owner:null, targetX:0.5, targetY:0.5, flying:false},
            possession: 'my',
            phase: 'kickoff',
            started: false, finished: false, halftime: false,
            yellowCards: {my:[], opp:[]},
            possessionTime: {my:0, opp:0},
            shots: {my:0, opp:0}
        };
        
        addNews(`⚽ Match started: FC United vs ${matchState.oppName}`);
        
        setTimeout(() => {
            matchState.started = true;
            startMatchLoop();
        }, 1000);
    }

    function startMatchLoop() {
        canvas = document.getElementById('matchCanvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        let lastTime = performance.now();
        
        function loop(time) {
            if (!matchState || !matchState.started || matchState.finished) return;
            
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;
            
            updateMatchPhysics(dt);
            updateMatchEvents();
            renderMatchCanvas();
            
            animationId = requestAnimationFrame(loop);
        }
        
        animationId = requestAnimationFrame(loop);
    }

    function updateMatchPhysics(dt) {
        if (!matchState) return;
        
        // 时间推进 (1秒游戏时间 = 1秒真实时间)
        matchState.second += dt;
        if (matchState.second >= 60) {
            matchState.second = 0;
            matchState.minute++;
            
            if (matchState.minute === 45 && !matchState.halftime) {
                matchState.halftime = true;
                addMatchEvent('⏱️ HALF TIME', 'info');
            }
            
            // 90分钟后进入加时赛
            if (matchState.minute >= 90) {
                if (!matchState.extraTime && !matchState.finished) {
                    matchState.extraTime = true;
                    matchState.minute = 90;
                    addMatchEvent('⏱️ EXTRA TIME!', 'info');
                }
                
                // 加时赛30分钟
                if (matchState.minute >= 120) {
                    endMatch();
                    return;
                }
            }
        }
        
        // 球运动
        updateBall(dt);
        
        // 球员AI
        updatePlayersAI(dt);
        
        // 持球时间统计
        if (matchState.possession === 'my') matchState.possessionTime.my += dt;
        else matchState.possessionTime.opp += dt;
    }

    function updateBall(dt) {
        const ball = matchState.ball;
        
        if (ball.flying) {
            // 球在空中飞向目标
            const dx = ball.targetX - ball.x;
            const dy = ball.targetY - ball.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0.02) {
                const speed = 0.8; // 传球速度
                ball.x += (dx / dist) * speed * dt;
                ball.y += (dy / dist) * speed * dt;
                
                // 抛物线效果
                const progress = 1 - (dist / Math.hypot(ball.targetX - ball.startX, ball.targetY - ball.startY));
                ball.z = Math.sin(progress * Math.PI) * 0.15;
            } else {
                ball.x = ball.targetX;
                ball.y = ball.targetY;
                ball.flying = false;
                ball.vx = 0;
                ball.vy = 0;
                
                // 落地后拦截检测
                if (Math.random() < 0.3) {
                    const defenders = matchState.possession === 'my' ? matchState.oppTeam : matchState.myTeam;
                    const closest = defenders.reduce((best, p) => {
                        const d = Math.hypot(p.x - ball.x, p.y - ball.y);
                        return d < best.dist ? {p, dist: d} : best;
                    }, {p: null, dist: Infinity});
                    
                    if (closest.dist < 0.15) {
                        ball.owner = closest.p;
                        matchState.possession = matchState.possession === 'my' ? 'opp' : 'my';
                    }
                }
            }
        } else if (ball.owner) {
            // 球跟随持球者
            ball.x += (ball.owner.x - ball.x) * 8 * dt;
            ball.y += (ball.owner.y - ball.y) * 8 * dt;
        } else {
            // 球自由滚动
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            ball.vx *= 0.92;
            ball.vy *= 0.92;
            
            // 边界反弹
            if (ball.x < 0.02) { ball.x = 0.02; ball.vx *= -0.5; }
            if (ball.x > 0.98) { ball.x = 0.98; ball.vx *= -0.5; }
            if (ball.y < 0.02) { ball.y = 0.02; ball.vy *= -0.5; }
            if (ball.y > 0.98) { ball.y = 0.98; ball.vy *= -0.5; }
        }
    }

    function updatePlayersAI(dt) {
        const ball = matchState.ball;
        const myAttacking = matchState.possession === 'my';
        
        // 我方球员
        matchState.myTeam.forEach((p, i) => {
            const target = getPlayerTarget(p, myAttacking, myAttacking, matchState.myTeam, matchState.oppTeam, ball);
            movePlayer(p, target.x, target.y, dt, 'my');
        });
        
        // 对方球员
        matchState.oppTeam.forEach((p, i) => {
            const target = getPlayerTarget(p, !myAttacking, myAttacking, matchState.oppTeam, matchState.myTeam, ball);
            movePlayer(p, target.x, target.y, dt, 'opp');
        });
    }

    function getPlayerTarget(player, isMyTeam, isAttacking, team, opponents, ball) {
        let tx = player.homeX;
        let ty = player.homeY;
        
        if (isAttacking) {
            // 进攻模式
            if (ball.owner && team.includes(ball.owner)) {
                const dist = Math.hypot(ball.owner.x - player.x, ball.owner.y - player.y);
                
                if (dist > 0.2) {
                    // 跑位支持
                    tx = player.homeX + (isMyTeam ? 0.08 : -0.08);
                    ty = player.homeY + (Math.random() - 0.5) * 0.15;
                } else if (dist > 0.4) {
                    // 前插
                    tx = player.homeX + (isMyTeam ? 0.12 : -0.12);
                }
            } else if (!ball.owner) {
                // 球在空中的预判
                tx = ball.x + (isMyTeam ? 0.05 : -0.05);
                ty = ball.y;
            }
        } else {
            // 防守模式
            const closest = opponents.reduce((best, opp) => {
                const d = Math.hypot(opp.x - player.x, opp.y - player.y);
                return d < best.dist ? {opp, dist: d} : best;
            }, {opp: null, dist: Infinity});
            
            if (closest.dist < 0.3) {
                tx = closest.opp.x + (isMyTeam ? -0.05 : 0.05);
                ty = closest.opp.y;
            } else {
                tx = player.homeX + (isMyTeam ? -0.05 : 0.05);
            }
        }
        
        return {x: tx, y: ty};
    }

    function movePlayer(player, tx, ty, dt, side) {
        const dx = tx - player.x;
        const dy = ty - player.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist > 0.01) {
            // 根据速度属性计算加速度
            const maxSpeed = (player.pace / 100) * 0.6 + 0.15;
            const speed = Math.min(dist * 3, maxSpeed);
            
            player.x += (dx / dist) * speed * dt;
            player.y += (dy / dist) * speed * dt;
        }
        
        // 边界限制
        if (side === 'my') {
            player.x = Math.max(0.05, Math.min(0.55, player.x));
        } else {
            player.x = Math.max(0.45, Math.min(0.95, player.x));
        }
        player.y = Math.max(0.02, Math.min(0.98, player.y));
    }

    function updateMatchEvents() {
        if (!matchState || !matchState.started || matchState.finished || matchState.halftime && matchState.minute === 45) return;
        
        // 每3-5秒产生一个事件
        if (Math.random() < 0.008) {
            generateMatchEvent();
        }
    }

    function generateMatchEvent() {
        if (!matchState) return;
        
        const myAttack = matchState.possession === 'my';
        const attackers = myAttack ? matchState.myTeam : matchState.oppTeam;
        const shooters = attackers.filter(p => ['ST','LW','RW','CAM'].includes(p.position));
        const shooter = shooters[rand(0, shooters.length - 1)] || attackers[rand(0, 5)];
        
        const eventType = rand(1, 100);
        
        if (eventType <= 25) {
            // 射门
            const shotQuality = (shooter.shooting + shooter.pace) / 2;
            const gk = myAttack ? matchState.oppTeam[0] : matchState.myTeam[0];
            const saveChance = (gk.defending + 40) / 2;
            
            matchState.shots[myAttack ? 'my' : 'opp']++;
            
            // 传球到射门位置
            const targetX = myAttack ? 0.85 : 0.15;
            const targetY = 0.3 + Math.random() * 0.4;
            
            matchState.ball.startX = matchState.ball.x;
            matchState.ball.startY = matchState.ball.y;
            matchState.ball.targetX = targetX;
            matchState.ball.targetY = targetY;
            matchState.ball.flying = true;
            matchState.ball.owner = shooter;
            
            if (shotQuality > saveChance + 12) {
                // 进球
                if (myAttack) { matchState.myScore++; shooter.goals++; }
                else { matchState.oppScore++; }
                addMatchEvent(`⚽ ${shooter.name.split(' ')[0]} SCORES! ${matchState.myScore}-${matchState.oppScore}`, 'goal');
            } else if (shotQuality > saveChance - 8) {
                addMatchEvent(`🧤 ${shooter.name.split(' ')[0]} - Saved!`, 'shot');
            } else {
                addMatchEvent(`❌ ${shooter.name.split(' ')[0]} - Missed!`, 'shot');
            }
        } else if (eventType <= 40) {
            // 传球
            const passer = ball.owner || attackers[rand(0, attackers.length - 1)];
            const receivers = attackers.filter(p => p.id !== passer?.id);
            const receiver = receivers[rand(0, receivers.length - 1)];
            
            if (receiver) {
                const dist = Math.hypot(receiver.x - passer.x, receiver.y - passer.y);
                
                matchState.ball.startX = matchState.ball.x;
                matchState.ball.startY = matchState.ball.y;
                matchState.ball.targetX = receiver.x + (Math.random() - 0.5) * 0.05;
                matchState.ball.targetY = receiver.y + (Math.random() - 0.5) * 0.05;
                matchState.ball.flying = true;
                matchState.ball.owner = receiver;
                
                addMatchEvent(`👟 ${passer?.name.split(' ')[0] || 'Player'} → ${receiver.name.split(' ')[0]}`, 'pass');
            }
        } else if (eventType <= 50) {
            // 犯规
            const fouler = attackers[rand(0, attackers.length - 1)];
            const defenders = myAttack ? matchState.oppTeam : matchState.myTeam;
            const defender = defenders[rand(0, defenders.length - 1)];
            
            if (defender) {
                matchState.ball.owner = null;
                matchState.ball.vx = (Math.random() - 0.5) * 0.2;
                matchState.ball.vy = (Math.random() - 0.5) * 0.2;
                matchance = defender;
                
                if (rand(1, 100) <= 15) {
                    const team = myAttack ? 'my' : 'opp';
                    if (!matchState.yellowCards[team].includes(fouler?.id)) {
                        matchState.yellowCards[team].push(fouler?.id);
                        addMatchEvent(`🟨 Yellow: ${fouler?.name.split(' ')[0] || 'Player'}`, 'card');
                    }
                } else {
                    addMatchEvent(`⚠️ Foul by ${defender.name.split(' ')[0]}`, 'foul');
                }
            }
        } else if (eventType <= 55) {
            // 拦截
            const defenders = myAttack ? matchState.oppTeam : matchState.myTeam;
            const interceptor = defenders[rand(0, defenders.length - 1)];
            
            if (interceptor) {
                matchState.ball.owner = interceptor;
                matchState.possession = myAttack ? 'opp' : 'my';
                addMatchEvent(`🔄 ${interceptor.name.split(' ')[0]} - Interception!`, 'pass');
            }
        } else if (eventType <= 60 && matchState.minute >= 60) {
            // 换人
            if (myAttack && matchState.myTeam.length > 11) {
                const sub = matchState.myTeam[11];
                addMatchEvent(`🔄 ${sub.name.split(' ')[0]} ON`, 'pass');
            }
        }
    }

    function addMatchEvent(text, type) {
        if (!matchState) return;
        matchState.events.unshift({ text, type, time: `${matchState.minute}'` });
        if (matchState.events.length > 20) matchState.events.pop();
        renderMatchUI();
    }

    function endMatch() {
        if (!matchState) return;
        matchState.finished = true;
        
        if (animationId) cancelAnimationFrame(animationId);
        
        // 加时赛进球决胜
        if (matchState.myScore === matchState.oppScore) {
            // 点球大战
            const myPK = rand(3, 5);
            const oppPK = rand(3, 5);
            matchState.myScore += myPK;
            matchState.oppScore += oppPK;
            addMatchEvent(`⚽ PENALTIES: ${myPK}-${oppPK}`, 'goal');
        }
        
        addMatchEvent(`🏁 FULL TIME: ${matchState.myScore} - ${matchState.oppScore}`, 'info');
        
        // 更新联赛
        const myL = game.league.find(l => l.name === 'FC United');
        const oppL = game.league.find(l => l.name === matchState.oppName);
        
        myL.played++; oppL.played++;
        myL.gf += matchState.myScore; myL.ga += matchState.oppScore;
        oppL.gf += matchState.oppScore; oppL.ga += matchState.myScore;
        
        if (matchState.myScore > matchState.oppScore) { myL.won++; myL.pts += 3; oppL.lost++; }
        else if (matchState.myScore === matchState.oppScore) { myL.drawn++; myL.pts += 1; oppL.drawn++; oppL.pts += 1; }
        else { myL.lost++; oppL.won++; oppL.pts += 3; }
        
        const income = 120000 * game.facilities.stadium;
        game.budget += income;
        
        game.team.slice(0, 11).forEach(p => {
            p.matches++;
            p.fitness = Math.max(45, p.fitness - rand(10, 20));
            p.morale = Math.min(100, p.morale + (matchState.myScore > matchState.oppScore ? 6 : -4));
            if (Math.random() < 0.12) p.assists++;
        });
        
        game.week++;
        const res = matchState.myScore > matchState.oppScore ? '🎉 WIN!' : matchState.myScore === matchState.oppScore ? '🤝 DRAW!' : '😢 LOSS...';
        addNews(`${res} FC United ${matchState.myScore}-${matchState.oppScore} ${matchState.oppName}`);
        
        if (game.week > 38) {
            game.season++;
            game.week = 1;
            game.league.sort((a, b) => b.pts - a.pts);
            const pos = game.league.findIndex(l => l.name === 'FC United') + 1;
            addNews(`🏆 Season ${game.season-1} ended! Rank #${pos}`);
            game.league.forEach(l => {
                if (l.name !== 'FC United') l.strength = Math.max(35, Math.min(95, l.strength + rand(-6, 6)));
                l.played=l.won=l.drawn=l.lost=l.gf=l.ga=l.pts=0;
            });
            game.budget += 2500000;
        }
        
        save();
        renderMatchUI();
    }

    // ==================== Render ====================
    function render() {
        const myL = game.league.find(l => l.name === 'FC United');
        const sorted = [...game.league].sort((a, b) => b.pts - a.pts);
        const myPos = sorted.findIndex(l => l.name === 'FC United') + 1;
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        
        let main = '';
        if (currentTab === 'playerDetail') main = renderPlayerDetail();
        else if (currentTab === 'home') main = renderHome(myL, sorted, myPos);
        else if (currentTab === 'team') main = renderTeam();
        else if (currentTab === 'tactics') main = renderTactics();
        else if (currentTab === 'facility') main = renderFacility();
        else if (currentTab === 'match') main = renderMatchTab();
        
        document.getElementById('app').innerHTML = `
            <header class="sticky top-0 z-20 bg-gradient-to-b from-slate-900 to-slate-900/95 border-b border-cyan-500/30 p-3">
                <div class="flex justify-between items-center max-w-md mx-auto">
                    <div>
                        <h1 class="game-title text-cyan-300 font-bold text-lg tracking-wider">${t('appName')}</h1>
                        <p class="text-amber-400 text-sm font-semibold">${fmt(game.budget)}</p>
                    </div>
                    <div class="text-right">
                        <div class="flex gap-1 justify-end mb-1">
                            <button onclick="setLang('en')" class="lang-btn ${LANG==='en'?'active':''}">EN</button>
                            <button onclick="setLang('zh')" class="lang-btn ${LANG==='zh'?'active':''}">中文</button>
                        </div>
                        <p class="text-xs text-slate-400">${days[game.day]} · ${t('round', game.week)}</p>
                    </div>
                </div>
            </header>
            <main class="max-w-md mx-auto p-3 pb-24">${main}</main>
            <nav class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 to-slate-900/95 border-t border-cyan-500/30 p-2 z-30">
                <div class="max-w-md mx-auto flex justify-around">
                    ${currentTab !== 'playerDetail' ? ['home','match','team','tactics','facility'].map(tab => `
                        <button onclick="switchTab('${tab}')" class="nav-btn ${currentTab===tab?'active':''}">
                            <span class="icon">${tab==='home'?'🏠':tab==='match'?'⚽':tab==='team'?'👥':tab==='tactics'?'⚙️':'🏟️'}</span>
                            <span class="text">${t(tab)}</span>
                        </button>
                    `).join('') : ''}
                </div>
            </nav>
            ${showToast ? `<div class="toast">${showToast}</div>` : ''}
        `;
        
        if (showToast) setTimeout(() => { showToast = null; render(); }, 2000);
    }

    function switchTab(tab) { currentTab = tab; selectedPlayer = null; render(); }
    function setLang(lang) { LANG = lang; render(); }

    function renderHome(myL, sorted, myPos) {
        return `
            <div class="card p-3 mb-3">
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div class="bg-slate-800/50 rounded-lg p-2"><div class="text-cyan-300 font-bold text-lg game-title">#${myPos}</div><div class="text-xs text-slate-400">${t('rank')}</div></div>
                    <div class="bg-slate-800/50 rounded-lg p-2"><div class="text-white font-bold text-lg">${myL.won}-${myL.drawn}-${myL.lost}</div><div class="text-xs text-slate-400">${t('record')}</div></div>
                    <div class="bg-slate-800/50 rounded-lg p-2"><div class="${myL.gf-myL.ga>=0?'text-green-400':'text-red-400'} font-bold text-lg">${myL.gf-myL.ga>0?'+':''}${myL.gf-myL.ga}</div><div class="text-xs text-slate-400">${t('gd')}</div></div>
                    <div class="bg-slate-800/50 rounded-lg p-2"><div class="text-amber-400 font-bold text-lg game-title">${myL.pts}</div><div class="text-xs text-slate-400">${t('pts')}</div></div>
                </div>
            </div>
            
            <div class="card p-3 mb-3">
                <button onclick="startMatch()" class="btn-game gold w-full text-sm mb-2">⚽ ${t('play')}</button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="trainTeam();render()" class="btn-game text-xs">🏋️ ${t('train')}</button>
                    <button onclick="refreshMarket();render()" class="btn-game purple text-xs">🔄 ${t('refresh')}</button>
                </div>
            </div>
            
            ${game.news.length ? `<div class="card p-3 mb-3"><h3 class="font-bold text-sm mb-2">📰 News</h3><div class="space-y-1 max-h-32 overflow-y-auto">${game.news.slice(0,5).map(n=>`<div class="text-xs bg-slate-800/60 p-2 rounded-lg">${n.text}</div>`).join('')}</div></div>` : ''}
            
            ${game.prospects.length ? `<div class="card p-3 mb-3"><h3 class="font-bold text-sm mb-2">🌟 ${t('academy')} (${game.prospects.length})</h3><div class="space-y-2">${game.prospects.map(p => playerCardHTML(p, true, false)).join('')}</div></div>` : ''}
            
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-2">💰 ${t('market')}</h3>
                <div class="space-y-2 max-h-48 overflow-y-auto">${game.market.map(p => playerCardHTML(p, false, true)).join('')}</div>
            </div>
            
            <div class="card p-3">
                <h3 class="font-bold text-sm mb-2">📊 ${t('standings')}</h3>
                <div class="standings-row text-xs text-slate-400 font-semibold mb-1"><span>#</span><span>Team</span><span class="text-center">W</span><span class="text-right">${t('pts')}</span></div>
                ${sorted.slice(0,10).map((s,i) => {
                    const isMe = s.name === 'FC United';
                    return `<div class="standings-row ${isMe?'me':''} ${i<3?'text-green-400':''}">
                        <span class="font-bold">${i+1}</span>
                        <span class="${isMe?'text-cyan-300 font-bold':'text-slate-200'}">${getLeagueName(s.index)}</span>
                        <span class="text-center">${s.won}</span>
                        <span class="text-right font-bold">${s.pts}</span>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function playerCardHTML(p, showSignButtons, showPrice) {
        return `
            <div class="player-card" onclick="showPlayerDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="player-avatar"><img src="${p.avatar}" alt="${p.name}" onerror="this.style.background='linear-gradient(135deg,#667eea,#764ba2)';this.innerHTML=''"></div>
                        <div>
                            <div class="font-bold">${p.name}</div>
                            <div class="text-xs text-slate-400">${p.age} yrs · ${p.position}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold game-title ${p.ovr>=75?'text-cyan-300':p.ovr>=65?'text-green-400':'text-slate-400'}">${p.ovr}</div>
                        ${showPrice ? `<div class="text-amber-400 text-xs">${fmt(p.askPrice)}</div>` : ''}
                    </div>
                </div>
                ${showSignButtons ? `<div class="flex gap-1 mt-2"><button onclick="event.stopPropagation();signProspect('${p.id}')" class="btn-game green flex-1 text-xs">✅ ${t('sign')}</button><button onclick="event.stopPropagation();rejectProspect('${p.id}')" class="btn-game red flex-1 text-xs">❌ ${t('reject')}</button></div>` : ''}
            </div>
        `;
    }

    function renderTeam() {
        const sorted = [...game.team].sort((a, b) => b.ovr - a.ovr);
        return `
            <div class="mb-3 flex gap-1 overflow-x-auto pb-1">
                ${[['all','全部'],['GK','门将'],['DEF','后卫'],['MID','中场'],['ATT','前锋']].map(([key, label]) => `
                    <button onclick="filterPos='${key}';render()" class="btn-game text-xs whitespace-nowrap ${filterPos===key?'gold':'purple'}">${label}</button>
                `).join('')}
            </div>
            <div class="space-y-2">${sorted.filter(p => filterPos==='all' || (filterPos==='GK'&&p.position==='GK') || (filterPos==='DEF'&&['CB','LB','RB'].includes(p.position)) || (filterPos==='MID'&&['CDM','CM','CAM','LW','RW'].includes(p.position)) || (filterPos==='ATT'&&['ST'].includes(p.position))).map(p => `
                <div class="player-card" onclick="showPlayerDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="player-avatar"><img src="${p.avatar}" alt="${p.name}" onerror="this.style.background='linear-gradient(135deg,#667eea,#764ba2)';this.innerHTML=''"></div>
                            <div>
                                <div class="font-bold">${p.name}</div>
                                <div class="text-xs text-slate-400">${p.age} yrs · ${p.region}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-bold game-title ${p.ovr>=75?'text-cyan-300':p.ovr>=65?'text-green-400':'text-slate-400'}">${p.ovr}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-5 gap-1 mt-2 text-center">
                        <div><div class="text-xs text-slate-400">${t('pace')}</div><div class="text-sm font-semibold">${p.pace}</div></div>
                        <div><div class="text-xs text-slate-400">${t('shooting')}</div><div class="text-sm font-semibold">${p.shooting}</div></div>
                        <div><div class="text-xs text-slate-400">${t('passing')}</div><div class="text-sm font-semibold">${p.passing}</div></div>
                        <div><div class="text-xs text-slate-400">${t('defending')}</div><div class="text-sm font-semibold">${p.defending}</div></div>
                        <div><div class="text-xs text-slate-400">${t('physical')}</div><div class="text-sm font-semibold">${p.physical}</div></div>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <div class="flex-1 bg-slate-800/50 rounded p-1 text-center"><div class="text-xs text-slate-400">⚡${t('fitness')}</div><div class="stat-bar"><div class="stat-fill ${p.fitness>=70?'bg-green-500':p.fitness>=40?'bg-yellow-500':'bg-red-500'}" style="width:${p.fitness}%"></div></div></div>
                        <div class="flex-1 bg-slate-800/50 rounded p-1 text-center"><div class="text-xs text-slate-400">😊${t('morale')}</div><div class="stat-bar"><div class="stat-fill ${p.morale>=70?'bg-green-500':p.morale>=40?'bg-yellow-500':'bg-red-500'}" style="width:${p.morale}%"></div></div></div>
                    </div>
                </div>
            `).join('')}</div>
        `;
    }

    function renderTactics() {
        const formations = ['4-4-2', '4-3-3', '4-2-3-1', '3-5-2'];
        const tactics = ['attack', 'balance', 'defend'];
        return `
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-3">⚙️ ${t('formation')}</h3>
                <div class="grid grid-cols-2 gap-2">${formations.map(f => `<button onclick="game.formation='${f}';save();render()" class="p-3 rounded-xl text-center ${game.formation===f?'bg-cyan-500/20 border-2 border-cyan-400':'bg-slate-800/50 border border-slate-600'}"><div class="text-xl font-bold game-title">${f}</div></button>`).join('')}</div>
            </div>
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-3">🎯 ${t('style')}</h3>
                <div class="grid grid-cols-3 gap-2">${tactics.map(key => `<button onclick="game.tactic='${key}';save();render()" class="p-3 rounded-xl text-center ${game.tactic===key?'bg-cyan-500/20 border-2 border-cyan-400':'bg-slate-800/50 border border-slate-600'}"><div class="text-2xl mb-1">${key==='attack'?'⚔️':key==='balance'?'⚖️':'🛡️'}</div><div class="font-bold">${t(key)}</div></button>`).join('')}</div>
            </div>
            <div class="card p-3">
                <h3 class="font-bold text-sm mb-3">📋 ${t('currentTeam')}</h3>
                <div class="text-xs text-slate-400 mb-2">${t('formation')}: ${game.formation} · ${t(game.tactic)}</div>
                <div class="space-y-1">${game.team.slice(0,11).map(p => `<div class="flex justify-between items-center bg-slate-800/50 p-2 rounded-lg text-sm"><span>${p.name}</span><span class="text-cyan-400 font-bold">${p.position}</span><span class="text-amber-400">${p.ovr}</span></div>`).join('')}</div>
            </div>
        `;
    }

    function renderFacility() {
        const facilities = [{key:'training',name:LANG==='zh'?'训练场':'Training Ground',icon:'🏋️'},{key:'academy',name:LANG==='zh'?'青训营':'Youth Academy',icon:'🌟'},{key:'stadium',name:LANG==='zh'?'体育场':'Stadium',icon:'🏟️'}];
        const costs = [50000,100000,200000,400000,800000,1600000,3200000,6400000,12800000];
        return `<div class="space-y-3">${facilities.map(f => {
            const level = game.facilities[f.key];
            const cost = costs[Math.min(level-1,8)];
            const canAfford = game.budget >= cost;
            return `<div class="card p-4">
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-2"><span class="text-2xl">${f.icon}</span><div class="font-bold">${f.name}</div></div>
                    <div class="text-2xl font-bold game-title text-cyan-300">Lv.${level}</div>
                </div>
                <button onclick="upgradeFacility('${f.key}')" class="btn-game w-full text-xs ${canAfford&&level<10?'gold':'purple'}" ${(!canAfford||level>=10)?'disabled':''}>${level>=10?'MAX':`⬆️ ${t('upgrade')} (${fmt(cost)})`}</button>
                <div class="flex gap-1 mt-2">${Array.from({length:10}).map((_,i)=>`<div class="h-2 flex-1 rounded ${i<level?'bg-cyan-400':'bg-slate-700'}"></div>`).join('')}</div>
            </div>`;
        }).join('')}</div>`;
    }

    function renderMatchTab() {
        if (matchState) return renderMatchView();
        const opp = game.league[rand(1,game.league.length-1)];
        return `
            <div class="card p-4 mb-3 text-center">
                <h3 class="font-bold text-lg mb-4">⚽ ${LANG==='zh'?'下一场比赛':'Next Match'}</h3>
                <div class="flex items-center justify-center gap-4">
                    <div class="text-center"><div class="text-2xl mb-1">🔵</div><div class="font-bold">${getLeagueName(0)}</div></div>
                    <div class="text-3xl font-bold game-title text-slate-500">${t('vs')}</div>
                    <div class="text-center"><div class="text-2xl mb-1">🔴</div><div class="font-bold">${getLeagueName(opp.index)}</div></div>
                </div>
            </div>
            <button onclick="startMatch()" class="btn-game gold w-full text-lg py-4">⚽ ${t('play')}</button>
        `;
    }

    function renderMatchView() {
        return `
            <div class="card p-3 mb-3">
                <div class="flex justify-between items-center">
                    <div class="text-center"><div class="text-xs text-slate-400">${getLeagueName(0)}</div><div class="text-4xl font-bold game-title text-cyan-300">${matchState.myScore}</div></div>
                    <div class="text-center"><div class="text-xs text-red-400 font-bold animate-pulse">${t('live')}</div><div class="text-2xl font-bold game-title">${matchState.minute}'</div></div>
                    <div class="text-center"><div class="text-xs text-slate-400">${matchState.oppName}</div><div class="text-4xl font-bold game-title text-red-400">${matchState.oppScore}</div></div>
                </div>
            </div>
            <div class="card p-2 mb-3" style="background:#1a5d1a;border-radius:12px;">
                <canvas id="matchCanvas" width="350" height="200" style="width:100%;height:auto;border-radius:8px;"></canvas>
            </div>
            <div class="card p-3" style="max-height:200px;overflow-y:auto;">
                <h4 class="font-bold text-sm mb-2">📋 Events</h4>
                <div id="matchEvents" class="space-y-1">${matchState.events.map(e => `<div class="event-${e.type==='goal'?'goal':e.type==='card'?'card':e.type==='shot'?'shot':e.type==='foul'?'foul':e.type==='sub'?'card':'pass'} p-2 rounded text-xs border-l-2" style="border-color:${e.type==='goal'?'#22c55e':e.type==='card'?'#fbbf24':e.type==='shot'?'#f59e0b':e.type==='foul'?'#ef4444':'#3b82f6'};background:${e.type==='goal'?'rgba(34,197,94,0.1)':e.type==='card'?'rgba(251,191,36,0.1)':e.type==='shot'?'rgba(245,158,11,0.1)':e.type==='foul'?'rgba(239,68,68,0.1)':'rgba(59,130,246,0.1)'}"><span class="text-slate-400 mr-2">${e.time}</span>${e.text}</div>`).join('')}</div>
            </div>
            ${matchState.finished ? `<div class="mt-3 text-center"><div class="text-2xl font-bold mb-2 ${matchState.myScore>matchState.oppScore?'text-green-400':matchState.myScore===matchState.oppScore?'text-yellow-400':'text-red-400'}">${matchState.myScore>matchState.oppScore?'🎉 WIN!':matchState.myScore===matchState.oppScore?'🤝 DRAW!':'😢 LOSS...'}</div><button onclick="currentTab='home';matchState=null;render()" class="btn-game gold">${t('back')}</button></div>` : ''}
        `;
    }

    function renderMatchUI() {
        const el = document.getElementById('matchEvents');
        if (el && matchState) {
            el.innerHTML = matchState.events.map(e => `<div class="p-2 rounded text-xs border-l-2" style="border-color:${e.type==='goal'?'#22c55e':e.type==='card'?'#fbbf24':e.type==='shot'?'#f59e0b':e.type==='foul'?'#ef4444':'#3b82f6'};background:${e.type==='goal'?'rgba(34,197,94,0.1)':e.type==='card'?'rgba(251,191,36,0.1)':e.type==='shot'?'rgba(245,158,11,0.1)':e.type==='foul'?'rgba(239,68,68,0.1)':'rgba(59,130,246,0.1)'}"><span class="text-slate-400 mr-2">${e.time}</span>${e.text}</div>`).join('');
        }
    }

    function renderMatchCanvas() {
        if (!canvas || !ctx) return;
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(0, 0, w, h);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, w-20, h-20);
        ctx.beginPath(); ctx.moveTo(w/2, 10); ctx.lineTo(w/2, h-10); ctx.stroke();
        ctx.beginPath(); ctx.arc(w/2, h/2, 35, 0, Math.PI*2); ctx.stroke();
        ctx.strokeRect(10, h/4, 40, h/2); ctx.strokeRect(w-50, h/4, 40, h/2);
        
        matchState.myTeam.forEach(p => {
            const x = p.x * w, y = p.y * h;
            ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2);
            ctx.fillStyle = '#00d4ff'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#000'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(p.name.split(' ')[0].substring(0,3), x, y);
        });
        
        matchState.oppTeam.forEach(p => {
            const x = p.x * w, y = p.y * h;
            ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2);
            ctx.fillStyle = '#ff6b6b'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(p.name.split(' ')[0].substring(0,3), x, y);
        });
        
        const bx = matchState.ball.x * w, by = matchState.ball.y * h;
        ctx.beginPath(); ctx.arc(bx, by+6, 6, 0, Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fill();
        ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
        
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(w/2-60, 5, 120, 28);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Orbitron'; ctx.textAlign = 'center';
        ctx.fillText(`${matchState.myScore} - ${matchState.oppScore}`, w/2, 24);
        
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(w-50, 5, 45, 28);
        ctx.fillStyle = matchState.minute>=45&&matchState.minute<46?'#ffff00':'#ff4444'; ctx.font = 'bold 16px Orbitron';
        ctx.fillText(`${matchState.minute}'`, w-27, 24);
    }

    // ==================== Actions ====================
    function upgradeFacility(key) {
        const costs = [50000,100000,200000,400000,800000,1600000,3200000,6400000,12800000];
        const cost = costs[Math.min(game.facilities[key]-1,8)];
        if (game.budget>=cost && game.facilities[key]<10) {
            game.budget -= cost; game.facilities[key]++;
            addNews(`🔧 ${key} upgraded to Lv.${game.facilities[key]}!`);
            showToast = t('upgraded'); save(); render();
        } else { showToast = t('noMoney'); render(); }
    }

    function signProspect(id) {
        const p = game.prospects.find(x => x.id === id);
        if (p && game.budget >= p.value * 0.3) {
            game.budget -= Math.floor(p.value * 0.3);
            game.team.push(p);
            game.prospects = game.prospects.filter(x => x.id !== id);
            addNews(`✅ Signed ${p.name}!`);
            showToast = t('signed'); save(); render();
        } else { showToast = t('noMoney'); render(); }
    }

    function rejectProspect(id) {
        game.prospects = game.prospects.filter(x => x.id !== id);
        render();
    }

    // ==================== Boot ====================
    initGame();
    refreshMarket();
    scoutAcademy();
    render();
    </script>
</body>
</html>
