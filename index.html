<!DOCTYPE html>

    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root { --gold: #ffd700; --cyan: #00d4ff; --purple: #9333ea; --green: #22c55e; --red: #ef4444; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%); color: #fff; overflow-x: hidden; }
        .game-title { font-family: 'Orbitron', sans-serif; }
        .card { background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95)); border: 1px solid rgba(0,212,255,0.2); border-radius: 16px; backdrop-filter: blur(10px); }
        .btn-game { background: linear-gradient(135deg, var(--cyan), #0099cc); border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; color: #000; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,212,255,0.3); text-transform: uppercase; letter-spacing: 1px; }
        .btn-game:active { transform: scale(0.95); }
        .btn-game.gold { background: linear-gradient(135deg, var(--gold), #b8860b); box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .btn-game.green { background: linear-gradient(135deg, var(--green), #16a34a); }
        .btn-game.red { background: linear-gradient(135deg, var(--red), #dc2626); }
        .btn-game.purple { background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; }
        .lang-btn { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
        .lang-btn.active { background: var(--cyan); color: #000; border-color: var(--cyan); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.2s; }
        .nav-btn.active { color: var(--cyan); }
        .nav-btn .icon { font-size: 18px; }
        .nav-btn .text { font-size: 9px; margin-top: 2px; }
        .stat-bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.5); overflow: hidden; }
        .stat-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.95)); padding: 12px 24px; border-radius: 30px; font-weight: 600; z-index: 100; box-shadow: 0 4px 20px rgba(34,197,94,0.4); }
        .player-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 12px; position: relative; cursor: pointer; transition: all 0.2s; }
        .player-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
        .player-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--cyan), var(--gold)); }
        .standings-row { display: grid; grid-template-columns: 30px 1fr 40px 50px; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; align-items: center; font-size: 13px; }
        .standings-row.me { background: linear-gradient(90deg, rgba(0,212,255,0.3), transparent) !important; border: 1px solid rgba(0,212,255,0.5); }
        @keyframes spin3d { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .player-3d { perspective: 600px; width: 120px; height: 200px; margin: 0 auto; }
        .player-3d-inner { width: 100%; height: 100%; transform-style: preserve-3d; animation: spin3d 8s linear infinite; }
        .player-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; overflow: hidden; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse { animation: pulse 1s infinite; }
        canvas { display: block; }
    </style>
</head>

            Portugal: ['#FFDFC4', '#F0C8A0', '#D4A574', '#E8C4A0']
        };
        
        const colors = skinTones[player.region] || skinTones['USA'];
        const skinColor = colors[seed % colors.length];
        
        // 发型风格
        const hairStyles = ['short', 'medium', 'long', 'bald'];
        const hairStyle = hairStyles[(seed + player.age) % hairStyles.length];
        
        const hairColors = ['#1a1a1a', '#2C1810', '#4A3728', '#8B4513', '#D4A574', '#8B0000', '#3D2314', '#1C1C1C'];
        const hairColor = hairColors[seed % hairColors.length];
        
        // 根据位置决定体型
        const bodyTypes = {
            GK: { width: 1.2, height: 1.15 }, // 高大壮
            CB: { width: 1.1, height: 1.1 },
            ST: { width: 1.05, height: 1.05 },
            LW: { width: 0.9, height: 1.0 },
            RW: { width: 0.9, height: 1.0 },
            CM: { width: 0.95, height: 1.0 },
            CAM: { width: 0.95, height: 1.0 },

        const bodyType = bodyTypes[player.position] || { width: 1, height: 1 };
        
        // 根据身高体重调整
        const heightRatio = (player.height - 170) / 30; // -1 to 1
        const weightRatio = (player.weight - 75) / 20; // -1 to 1
        const bodyW = bodyType.width * (1 + weightRatio * 0.15);
        const bodyH = bodyType.height * (1 + heightRatio * 0.1);
        
        // 队服颜色 (根据位置分组)

        // 短裤颜色

            <ellipse cx="70" cy="152" rx="10" ry="5" fill="#1a1a1a"/>
        </svg>`;
        
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    
    function adjustColor(hex, amount) {
        const num = parseInt(hex.replace('#', ''), 16);
        const r = Math.min(255, Math.max(0, (num >> 16) + amount));
        const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
        const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // ==================== Player Creation ====================
    function generatePlayerStats(position, age) {
        const heightBase = { GK: rand(188, 196), CB: rand(184, 193), LB: rand(177, 185), RB: rand(177, 185), CDM: rand(180, 188), CM: rand(177, 185), CAM: rand(175, 182), LW: rand(172, 180), RW: rand(172, 180), ST: rand(179, 191) };
        const base = heightBase[position] || 180;
        const growthFactor = age < 20 ? (20 - age) * 0.08 : 0;
        const height = Math.round(base - growthFactor);
        const weight = Math.round(height * 0.65 + rand(-5, 5));
        return { height, weight };
    }

    function createPlayer(region, position, quality = 60) {
        const age = rand(17, 35);
        const names = PLAYER_NAMES[region] || PLAYER_NAMES['England'];
        const name = names[rand(0, names.length - 1)];
        
        const posBonus = {
            GK: { pace: -20, shooting: -25, defending: 20, passing: 5 },
            CB: { pace: -5, shooting: -15, defending: 25, physical: 20 },
            LB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            RB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            CDM: { pace: 0, shooting: -5, defending: 15, passing: 15 },
            CM: { pace: 5, shooting: 10, defending: 5, passing: 18 },
            CAM: { pace: 10, shooting: 18, defending: -5, passing: 15 },
            LW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            RW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            ST: { pace: 12, shooting: 25, defending: -15, physical: 15 }
        };
        
        const b = posBonus[position] || {};
        const potential = Math.min(99, quality + rand(5, 22));
        const baseOvr = Math.max(30, Math.min(99, quality + rand(-8, 8)));
        const baseValue = Math.floor(baseOvr * 8000 * (age < 22 ? 1.6 : age < 26 ? 1.2 : age < 30 ? 0.8 : 0.35));
        const stats = generatePlayerStats(position, age);

    let lastTimestamp = 0;
    function startMatchLoop() {
        lastTimestamp = performance.now();
        requestAnimationFrame(matchLoop);
    }

    function matchLoop(timestamp) {
        if (!matchState || !matchState.started || matchState.finished) return;
        
        const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
        lastTimestamp = timestamp;
        
        updateMatch(dt);
        renderMatch();
        
        animationId = requestAnimationFrame(matchLoop);
    }

    function updateMatch(dt) {
        // 时间推进 (1秒真实时间 = 1分钟比赛时间)
        matchState.second += dt;
        
        if (matchState.second >= 60) {
            matchState.second = 0;
            matchState.minute++;
            
            // 半场
            if (matchState.minute === 45 && !matchState.halftimeDone) {
                matchState.halftimeDone = true;
                addMatchEvent('⏱️ 半场结束!', 'info');
            }
            
            // 90分钟后进入加时
            if (matchState.minute >= 90 && !matchState.extraTime) {
                matchState.extraTime = true;
                addMatchEvent('⏱️ 进入加时赛!', 'info');
            }
            
            // 120分钟后结束 (联赛无加时)
            if (matchState.minute >= 120) {
                endMatch();
                return;
            }
        }
        
        // 更新球员
        updatePlayers(dt);
        
        // 更新球
        updateBall(dt);
        
        // 产生事件
        if (timestamp - matchState.lastEventTime > 3000 && Math.random() < 0.15) {
            generateMatchEvent();
            matchState.lastEventTime = timestamp;
        }
    }

    function updatePlayers(dt) {
        const ball = matchState.ball;
        const myAttack = matchState.possession === 'my';
        
        [...matchState.myTeam, ...matchState.oppTeam].forEach((player, idx) => {
            const isMy = idx < 11;
            const teammates = isMy ? matchState.myTeam : matchState.oppTeam;
            const opponents = isMy ? matchState.oppTeam : matchState.myTeam;
            
            let tx, ty;
            
            if (ball.owner) {
                // 有持球者
                if (isMy === (ball.owner.id ? matchState.myTeam.includes(ball.owner) : false)) {
                    // 队友 - 进攻跑位
                    if (ball.owner.id === player.id) {
                        tx = player.homeX + (isMy ? 0.08 : -0.08);
                        ty = player.homeY;
                    } else {
                        // 跑位接应
                        const dx = ball.owner.x - player.x;
                        const dy = ball.owner.y - player.y;
                        tx = player.homeX + (isMy ? 0.1 : -0.1) + (Math.random() - 0.5) * 0.1;
                        ty = player.homeY + (Math.random() - 0.5) * 0.2;
                    }
                } else {
                    // 对手 - 防守
                    const closestBall = Math.hypot(ball.x - player.x, ball.y - player.y);
                    if (closestBall < 0.25) {
                        tx = ball.x + (isMy ? -0.05 : 0.05);
                        ty = ball.y;
                    } else {
                        tx = player.homeX;
                        ty = player.homeY;
                    }
                }
            } else {
                // 球自由状态
                tx = ball.x * 0.5 + player.homeX * 0.5;
                ty = ball.y * 0.5 + player.homeY * 0.5;
            }
            
            // 平滑移动
            const dx = tx - player.x;
            const dy = ty - player.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0.01) {
                const speed = player.speed * (1 + Math.random() * 0.1);
                player.x += (dx / dist) * speed * dt;
                player.y += (dy / dist) * speed * dt;
            }
            
            // 边界限制
            if (isMy) {
                player.x = Math.max(0.05, Math.min(0.6, player.x));
            } else {
                player.x = Math.max(0.4, Math.min(0.95, player.x));
            }
            player.y = Math.max(0.02, Math.min(0.98, player.y));
        });
    }

    function updateBall(dt) {
        const ball = matchState.ball;
        
        if (ball.flying) {
            // 球在空中飞
            const dx = ball.targetX - ball.x;
            const dy = ball.targetY - ball.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0.02) {
                ball.x += (dx / dist) * 0.6 * dt;
                ball.y += (dy / dist) * 0.6 * dt;
                // 抛物线
                const progress = 1 - dist / Math.hypot(ball.targetX - ball.startX, ball.targetY - ball.startY);
                ball.z = Math.sin(progress * Math.PI) * 0.1;
            } else {
                ball.x = ball.targetX;
                ball.y = ball.targetY;
                ball.z = 0;
                ball.flying = false;
                
                // 落地后随机被捡起
                if (Math.random() < 0.4) {
                    const nearby = [...matchState.myTeam, ...matchState.oppTeam].filter(p => 
                        Math.hypot(p.x - ball.x, p.y - ball.y) < 0.15
                    );
                    if (nearby.length > 0) {
                        ball.owner = nearby[rand(0, nearby.length - 1)];
                        matchState.possession = matchState.myTeam.includes(ball.owner) ? 'my' : 'opp';
                    }
                }
            }
        } else if (ball.owner) {
            // 球跟随持球者
            ball.x += (ball.owner.x - ball.x) * 5 * dt;
            ball.y += (ball.owner.y - ball.y) * 5 * dt;
        } else {
            // 球自由滚动/停止
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            ball.vx *= 0.95;
            ball.vy *= 0.95;
            
            // 边界反弹
            if (ball.x < 0.02) { ball.x = 0.02; ball.vx *= -0.5; }
            if (ball.x > 0.98) { ball.x = 0.98; ball.vx *= -0.5; }
            if (ball.y < 0.02) { ball.y = 0.02; ball.vy *= -0.5; }
            if (ball.y > 0.98) { ball.y = 0.98; ball.vy *= -0.5; }
        }
    }

    function generateMatchEvent() {
        if (!matchState) return;
        
        const myAttack = matchState.possession === 'my';
        const attackers = myAttack ? matchState.myTeam : matchState.oppTeam;
        const defenders = myAttack ? matchState.oppTeam : matchState.myTeam;
        const eventType = rand(1, 100);
        
        if (eventType <= 20) {
            // 射门
            const shooter = attackers.filter(p => ['ST','LW','RW','CAM'].includes(p.position))[0] || attackers[0];
            const gk = defenders[0];
            
            matchState.shots[myAttack ? 'my' : 'opp']++;
            
            const shotQuality = (shooter.shooting + shooter.pace) / 2;
            const saveChance = gk.defending + 30;
            
            // 传球到射门位置
            const targetX = myAttack ? 0.85 : 0.15;
            const targetY = 0.25 + Math.random() * 0.5;
            
            matchState.ball.startX = matchState.ball.x;
            matchState.ball.startY = matchState.ball.y;
            matchState.ball.targetX = targetX;
            matchState.ball.targetY = targetY;
            matchState.ball.flying = true;
            matchState.ball.owner = shooter;
            
            setTimeout(() => {
                if (shotQuality > saveChance + 15) {
                    if (myAttack) { matchState.myScore++; shooter.goals++; }
                    else { matchState.oppScore++; }
                    addMatchEvent(`⚽ ${shooter.name.split(' ').pop()} 进球! ${matchState.myScore}-${matchState.oppScore}`, 'goal');
                } else if (shotQuality > saveChance - 5) {
                    addMatchEvent(`🧤 扑出!`, 'shot');
                } else {
                    addMatchEvent(`❌ 射偏!`, 'shot');
                }
            }, 800);
            
        } else if (eventType <= 45) {
            // 传球
            const passer = matchState.ball.owner || attackers[0];
            const receivers = attackers.filter(p => p.id !== passer?.id);
            const receiver = receivers[rand(0, Math.min(receivers.length - 1, 4))];
            
            if (receiver) {
                matchState.ball.startX = matchState.ball.x;
                matchState.ball.startY = matchState.ball.y;
                matchState.ball.targetX = receiver.x + (Math.random() - 0.5) * 0.03;
                matchState.ball.targetY = receiver.y + (Math.random() - 0.5) * 0.03;
                matchState.ball.flying = true;
                matchState.ball.owner = receiver;
                addMatchEvent(`👟 ${passer?.name.split(' ').pop()} → ${receiver.name.split(' ').pop()}`, 'pass');
            }
        } else if (eventType <= 55) {
            // 铲球/拦截
            const interceptor = defenders[rand(0, 5)];
            if (interceptor) {
                ball.owner = interceptor;
                matchState.possession = myAttack ? 'opp' : 'my';
                addMatchEvent(`🔄 抢断!`, 'pass');
            }
        } else if (eventType <= 60) {
            // 犯规
            const fouler = attackers[rand(0, 4)];
            if (fouler) {
                ball.owner = null;
                ball.vx = (Math.random() - 0.5) * 0.3;
                ball.vy = (Math.random() - 0.5) * 0.3;
                addMatchEvent(`⚠️ ${fouler.name.split(' ').pop()} 犯规!`, 'foul');
            }
        }
    }

    function addMatchEvent(text, type) {
        if (!matchState) return;
        matchState.events.unshift({ text, type, time: `${matchState.minute}'` });
        if (matchState.events.length > 15) matchState.events.pop();
        renderMatchUI();
    }

    function endMatch() {
        if (!matchState) return;
        matchState.finished = true;
        
        if (animationId) cancelAnimationFrame(animationId);
        
        addMatchEvent(`🏁 全场结束: ${matchState.myScore}-${matchState.oppScore}`, 'info');
        
        // 更新联赛
        const myL = game.league.find(l => l.name === 'FC United');
        const oppL = game.league.find(l => l.name === matchState.oppName);
        
        myL.played++; oppL.played++;
        myL.gf += matchState.myScore; myL.ga += matchState.oppScore;
        oppL.gf += matchState.oppScore; oppL.ga += matchState.myScore;
        
        if (matchState.myScore > matchState.oppScore) { myL.won++; myL.pts += 3; oppL.lost++; }
        else if (matchState.myScore === matchState.oppScore) { myL.drawn++; myL.pts += 1; oppL.drawn++; oppL.pts += 1; }
        else { myL.lost++; oppL.won++; oppL.pts += 3; }
        
        const income = 120000 * game.facilities.stadium;
        game.budget += income;
        
        game.team.slice(0, 11).forEach(p => {
            p.matches++;
            p.fitness = Math.max(45, p.fitness - rand(10, 20));
            p.morale = Math.min(100, p.morale + (matchState.myScore > matchState.oppScore ? 6 : -4));
            if (Math.random() < 0.12) p.assists++;
        });
        
        game.week++;
        const res = matchState.myScore > matchState.oppScore ? '🎉 胜利!' : matchState.myScore === matchState.oppScore ? '🤝 平局!' : '😢 失利...';
        addNews(`${res} FC联 ${matchState.myScore}-${matchState.oppScore} vs ${matchState.oppName}`);
        
        if (game.week > 38) {
            game.season++;
            game.week = 1;
            game.league.sort((a, b) => b.pts - a.pts);
            const pos = game.league.findIndex(l => l.name === 'FC United') + 1;
            addNews(`🏆 第 ${game.season-1} 赛季结束! 排名 #${pos}`);
            game.league.forEach(l => {
                if (l.name !== 'FC United') l.strength = Math.max(35, Math.min(95, l.strength + rand(-6, 6)));
                l.played=l.won=l.drawn=l.lost=l.gf=l.ga=l.pts=0;
            });
            game.budget += 2500000;
        }
        
        save();
        renderMatchUI();
    }

    function renderMatch() {
        if (!canvas || !ctx) return;
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        
        // 草地
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(0, 0, w, h);
        
        // 草地纹理
        for (let i = 0; i < h; i += 20) {
            ctx.fillStyle = i % 40 === 0 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, i, w, 10);
        }
        
        // 球场线条
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, w-30, h-30);
        ctx.beginPath(); ctx.moveTo(w/2, 15); ctx.lineTo(w/2, h-15); ctx.stroke();
        ctx.beginPath(); ctx.arc(w/2, h/2, 30, 0, Math.PI*2); ctx.stroke();
        ctx.strokeRect(15, h/4, 35, h/2);
        ctx.strokeRect(w-50, h/4, 35, h/2);
        
        // 球员
        const drawPlayer = (p, color, isMe) => {
            const x = p.x * w;
            const y = p.y * h;
            
            // 阴影
            ctx.beginPath();
            ctx.ellipse(x, y + 12, 10, 4, 0, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();
            
            // 身体
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI*2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 名字
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 7px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const name = p.name.split(' ').pop();
            ctx.fillText(name.substring(0, 4), x, y);
        };
        
        matchState.myTeam.forEach(p => drawPlayer(p, '#00d4ff', true));
        matchState.oppTeam.forEach(p => drawPlayer(p, '#ff6b6b', false));
        
        // 球
        const bx = matchState.ball.x * w;
        const by = matchState.ball.y * h + matchState.ball.z * 30;
        
        ctx.beginPath();
        ctx.ellipse(bx, by + 5, 6, 3, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(bx, by, 6, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // 比分
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(w/2-50, 8, 100, 30);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Orbitron, Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.myScore} - ${matchState.oppScore}`, w/2, 28);
        
        // 时间
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(w-45, 8, 40, 22);
        ctx.fillStyle = matchState.halftimeDone ? '#ffff00' : '#ff4444';
        ctx.font = 'bold 14px Orbitron, Arial';
        ctx.fillText(`${matchState.minute}'`, w-25, 24);
    }

    // ==================== Actions ====================
    function upgradeFacility(key) {
        const costs = [50000,100000,200000,400000,800000,1600000,3200000,6400000,12800000];
        const cost = costs[Math.min(game.facilities[key]-1,8)];
        if (game.budget>=cost && game.facilities[key]<10) {
            game.budget -= cost; game.facilities[key]++;
            addNews(`🔧 ${key} 升级到 Lv.${game.facilities[key]}!`);
            showToast = t('upgraded'); save(); render();
        } else { showToast = t('noMoney'); render(); }
    }

    function signProspect(id) {
        const p = game.prospects.find(x => x.id === id);
        if (p && game.budget >= p.value * 0.3) {
            game.budget -= Math.floor(p.value * 0.3);
            game.team.push(p);
            game.prospects = game.prospects.filter(x => x.id !== id);
            addNews(`✅ 签约 ${p.name}!`);
            showToast = t('signed'); save(); render();
        } else { showToast = t('noMoney'); render(); }
    }

    function rejectProspect(id) {
        game.prospects = game.prospects.filter(x => x.id !== id);
        render();
    }

    // ==================== Boot ====================
    initGame();
    refreshMarket();
    scoutAcademy();
    render();
    </script>
</body>
</html>
