<script>
// ---- Utils (must be before engine) ----
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

// ============================================================
// UFO Match Engine v3.0 - INLINE
// 整合: openfootmanager 多因子模型 + phaser-simple-soccer 状态机
// ============================================================

const PlayerState = {
  WAIT: 'wait',
  CHASE_BALL: 'chase',
  DRIBBLE: 'dribble',
  PASS: 'pass',
  SHOOT: 'shoot',
  RECEIVE_BALL: 'receive',
  RETURN_HOME: 'home',
  SUPPORT_ATTACKER: 'support',
  PRESS: 'press'
};

const Zone = {
  HOME_BOX: 'home_box',
  HOME_THIRD: 'home_third',
  MIDFIELD: 'midfield',
  AWAY_THIRD: 'away_third',
  AWAY_BOX: 'away_box'
};

function getZone(x, isMyTeam) {
  if (x < 0.2) return isMyTeam ? Zone.HOME_BOX : Zone.AWAY_BOX;
  if (x < 0.4) return isMyTeam ? Zone.HOME_THIRD : Zone.AWAY_THIRD;
  if (x < 0.6) return Zone.MIDFIELD;
  if (x < 0.8) return isMyTeam ? Zone.AWAY_THIRD : Zone.HOME_THIRD;
  return isMyTeam ? Zone.AWAY_BOX : Zone.HOME_BOX;
}

const Tactics = {
  TIKITAKA: { name: 'Tiki-Taka', passBonus: 1.15, pressBonus: 1.1, shootPenalty: 0.9 },
  COUNTER: { name: 'Counter Attack', paceBonus: 1.2, passPenalty: 0.9, shootBonus: 1.1 },
  PARK_BUS: { name: 'Park the Bus', defendBonus: 1.2, attackPenalty: 0.75 },
  GEGENPRESS: { name: 'Gegenpress', pressBonus: 1.25, staminaPenalty: 0.9 },
  WING_PLAY: { name: 'Wing Play', crossBonus: 1.2, aerialBonus: 1.1 }
};

function expandPlayerStats(p) {
  return {
    ...p,
    x: p.x || p.hx || 0.5,
    y: p.y || p.hy || 0.5,
    vx: 0, vy: 0, ax: 0, ay: 0,
    pace: p.pace || 70,
    shooting: p.shooting || 70,
    passing: p.passing || 70,
    defending: p.defending || 70,
    physical: p.physical || 70,
    vision: Math.min(99, (p.passing || 70) + rand(-5, 5)),
    composure: Math.min(99, (p.shooting || 70) + rand(-8, 3)),
    teamwork: Math.min(99, (p.passing || 70) + rand(-3, 8)),
    decisions: Math.min(99, ((p.passing || 70) + (p.defending || 70)) / 2 + rand(-5, 5)),
    positioning: Math.min(99, (p.defending || 70) + rand(-3, 7)),
    tackling: Math.min(99, (p.defending || 70) + rand(-5, 5)),
    agility: Math.min(99, (p.pace || 70) + rand(-8, 2)),
    aerial: Math.min(99, (p.physical || 70) + rand(-5, 5)),
    stamina: Math.min(99, (p.physical || 70) + (p.pace || 70) / 2 + rand(-10, 5)),
    state: PlayerState.RETURN_HOME,
    stateTimer: 0,
    targetX: p.hx || 0.5,
    targetY: p.hy || 0.5,
    distanceRun: 0, touches: 0, passesAttempted: 0, passesCompleted: 0,
    shots: 0, tackles: 0, interceptions: 0
  };
}

// ============================================================
// UFO Match Engine v4.0 - Pre-computed + Playback
// 赛前一次性生成所有帧，播放时零 AI 计算，纯 Canvas 渲染
// ============================================================

const MATCH_FPS = 5;   // 每秒 5 帧动画（足够流畅，内存友好）
const MATCH_DURATION = 270; // 270 game-minutes = 45+45 min (×3 scale → 90s real)
const MATCH_REAL_SEC = 90;  // 90 秒现实时间播完 270 分钟比赛

class MatchEngine {
  constructor(myTeam, oppTeam, oppName, myTactic = {}, oppTactic = {}) {
    this.oppName = oppName;
    this.myTactic = myTactic;
    this.oppTactic = oppTactic;
    this.score = { my: 0, opp: 0 };
    this.events = [];
    this.stats = {
      my: { shots: 0, shotsOn: 0, passes: 0, passesComp: 0, tackles: 0, fouls: 0, corners: 0 },
      opp: { shots: 0, shotsOn: 0, passes: 0, passesComp: 0, tackles: 0, fouls: 0, corners: 0 }
    };
    // 展开球员属性
    this.myTeam = myTeam.map(p => ({ ...expandPlayerStats({ ...p, isMy: true }), hx: p.hx, hy: p.hy }));
    this.oppTeam = oppTeam.map(p => ({ ...expandPlayerStats({ ...p, isMy: false }), hx: p.hx, hy: p.hy }));
    // 预计算所有帧
    this.frames = [];
    this._precompute();
  }

  // ---- 预计算阶段（一次性）----
  _precompute() {
    const fp = FP[G.formation] || FP['4-4-2'];
    // 初始化位置
    const state = {
      my: this.myTeam.map((p, i) => {
        const pos = fp[i] || [0.25, 0.5];
        return { ...p, x: pos[0], y: pos[1], hx: pos[0], hy: pos[1], vx: 0, vy: 0 };
      }),
      opp: this.oppTeam.map((p, i) => {
        const pos = fp[i] || [0.75, 0.5];
        return { ...p, x: 1 - pos[0], y: pos[1], hx: 1 - pos[0], hy: pos[1], vx: 0, vy: 0 };
      }),
      ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 },
      score: { my: 0, opp: 0 },
      possession: 'my',
      phase: 'opening', // opening | first_half | half_time | second_half | finished
      ticks: 0,
      goalTicks: null,
      goalScorer: null,
    };

    const totalTicks = Math.ceil(MATCH_DURATION * MATCH_FPS);

    for (let tick = 0; tick < totalTicks; tick++) {
      const min = Math.floor((tick / MATCH_FPS) / 60);
      const sec = Math.floor((tick / MATCH_FPS) % 60);
      const phase = this._getPhase(min, state.phase);

      // 如果刚进球，3 秒内不处理球权
      if (state.goalTicks !== null && tick - state.goalTicks < 3 * MATCH_FPS) {
        // 保持进球画面
      } else {
        this._tick(state, min, phase);
      }

      // 记录事件帧（事件触发后的前 10 帧高亮）
      const evtFrame = this._pendingEvt ? tick : null;

      this.frames.push({
        my: state.my.map(p => ({ x: p.x, y: p.y, isMy: true, role: p.role, name: p.name })),
        opp: state.opp.map(p => ({ x: p.x, y: p.y, isMy: false, role: p.role, name: p.name })),
        ball: { x: state.ball.x, y: state.ball.y },
        score: { ...state.score },
        min,
        sec,
        phase,
        evt: evtFrame,
        possession: state.possession,
      });
    }

    this.score = state.score;
    this.events = this._allEvents || [];
  }

  _getPhase(min, prev) {
    if (min === 0) return 'opening';
    if (min < 1) return 'opening';
    if (min === 45 && prev !== 'half_time') return 'half_time';
    if (min === 46) return 'second_half';
    if (min >= 45 && min < 46) return 'half_time';
    if (min >= 90) return 'finished';
    if (min > 1 && min < 45) return 'first_half';
    return 'second_half';
  }

  _tick(state, min, phase) {
    // 开球阶段：球在中间，双方落位
    if (phase === 'opening') {
      state.ball.x += (0.5 - state.ball.x) * 0.1;
      state.ball.y += (0.5 - state.ball.y) * 0.1;
      this._moveToHome(state.my);
      this._moveToHome(state.opp);
      if (min >= 1) state.phase = 'first_half';
      return;
    }

    // 半场休息
    if (phase === 'half_time') {
      state.ball.x += (0.5 - state.ball.x) * 0.05;
      state.ball.y += (0.5 - state.ball.y) * 0.05;
      this._moveToHome(state.my);
      this._moveToHome(state.opp);
      if (min === 46) {
        // 换边开球
        state.possession = 'my';
        state.ball = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
      }
      return;
    }

    if (phase === 'finished') return;

    // 计算双方进攻倾向
    const myStr = this._teamStrength(state.my, 'my');
    const oppStr = this._teamStrength(state.opp, 'opp');
    const myAtk = state.possession === 'my';
    const atkTeam = myAtk ? state.my : state.opp;
    const defTeam = myAtk ? state.opp : state.my;
    const atkStr = myAtk ? myStr : oppStr;
    const defStr = myAtk ? oppStr : myStr;

    // 球在脚下时：有概率射门/传球/推进
    if (state.ball.vx === 0 && state.ball.vy === 0) {
      const holder = atkTeam[0]; // 默认找前锋
      const defGoal = myAtk ? 0.97 : 0.03;
      const defMid = myAtk ? 0.7 : 0.3;

      // 射门判定
      const inBox = Math.abs(holder.x - defGoal) < 0.15 && Math.abs(holder.y - 0.5) < 0.25;
      const inThird = Math.abs(holder.x - defGoal) < 0.35;
      if ((inBox && Math.random() < 0.18) || (inThird && Math.random() < 0.04)) {
        const shootSkill = holder.shooting || 60;
        const gkSkill = defTeam[0].defending || 50;
        const accuracy = 0.6 + (shootSkill - 60) / 200;
        const onTarget = Math.random() < accuracy;
        if (onTarget) {
          const conversion = 0.3 + (shootSkill - gkSkill) / 200;
          if (Math.random() < conversion) {
            state.score.myAtk ? state.score.my++ : state.score.opp++;
            const scorer = holder;
            const goalTxt = `⚽ 进球! ${scorer.name.split(' ').pop()}! ${state.score.my}-${state.score.opp}`;
            this._allEvents = this._allEvents || [];
            this._allEvents.push({ text: goalTxt, type: 'goal', min: `${min}'`, isMy: !!myAtk });
            state.ball.x = defGoal; state.ball.y = 0.4 + Math.random() * 0.2;
            state.goalTicks = state.ticks;
            state.possession = myAtk ? 'opp' : 'my';
          } else {
            const saveTxt = `🧤 门将扑出!`;
            this._allEvents = this._allEvents || [];
            this._allEvents.push({ text: saveTxt, type: 'save', min: `${min}'`, isMy: !!myAtk });
            state.ball.x = myAtk ? 0.88 : 0.12; state.ball.y = 0.3 + Math.random() * 0.4;
          }
        } else {
          this._allEvents = this._allEvents || [];
          this._allEvents.push({ text: `❌ 偏出!`, type: 'miss', min: `${min}'`, isMy: !!myAtk });
          state.ball.x = myAtk ? 0.9 : 0.1; state.ball.y = Math.random() > 0.5 ? 0.08 : 0.92;
        }
        state.goalTicks = state.ticks;
        return;
      }

      // 传球推进
      const receivers = atkTeam.filter(p => p !== holder);
      const target = receivers[rand(0, receivers.length - 1)];
      if (target) {
        const passSkill = holder.passing || 55;
        const dist = Math.hypot(target.x - holder.x, target.y - holder.y);
        const pressPenalty = this._nearDefenders(holder, defTeam) * 0.1;
        const passOk = Math.random() < (0.75 + (passSkill - 55) / 200 - dist * 0.5 - pressPenalty);
        if (passOk) {
          this._allEvents = this._allEvents || [];
          this._allEvents.push({ text: `👟 ${holder.name.split(' ').pop()} → ${target.name.split(' ').pop()}`, type: 'pass', min: `${min}'`, isMy: !!myAtk });
          state.ball.x = target.x; state.ball.y = target.y;
        } else {
          const def = defTeam[rand(1, defTeam.length - 1)];
          this._allEvents = this._allEvents || [];
          this._allEvents.push({ text: `🚫 拦截! ${def.name.split(' ').pop()}`, type: 'defense', min: `${min}'`, isMy: !myAtk });
          state.ball.x = def.x; state.ball.y = def.y;
          state.possession = myAtk ? 'opp' : 'my';
        }
        return;
      }
    }

    // 球在移动中
    const speed = Math.hypot(state.ball.vx, state.ball.vy);
    if (speed < 0.001) {
      // 球停下，随机给一方
      const receiver = (Math.random() < 0.5 ? state.my : state.opp)[rand(0, 9)];
      state.ball.x = receiver.x; state.ball.y = receiver.y;
      state.possession = receiver.isMy ? 'my' : 'opp';
    } else {
      state.ball.x += state.ball.vx / MATCH_FPS;
      state.ball.y += state.ball.vy / MATCH_FPS;
      state.ball.vx *= 0.85;
      state.ball.vy *= 0.85;
      // 边界反弹
      if (state.ball.x < 0.03) { state.ball.vx = Math.abs(state.ball.vx) * 0.5; state.ball.x = 0.03; }
      if (state.ball.x > 0.97) { state.ball.vx = -Math.abs(state.ball.vx) * 0.5; state.ball.x = 0.97; }
      if (state.ball.y < 0.05) { state.ball.vy = Math.abs(state.ball.vy) * 0.5; state.ball.y = 0.05; }
      if (state.ball.y > 0.95) { state.ball.vy = -Math.abs(state.ball.vy) * 0.5; state.ball.y = 0.95; }

      // 进攻方向趋势（根据双方实力差）
      const goalX = myAtk ? 0.97 : 0.03;
      const trendBias = (atkStr - defStr) * 0.001;
      state.ball.vx += (goalX - state.ball.x) * 0.03 + trendBias;
      state.ball.vy += (0.5 - state.ball.y) * 0.02;
    }

    // 球员跟随（简化：进攻方前压，防守方回撤）
    atkTeam.forEach((p, i) => {
      const target = {
        x: state.ball.x + (i % 3) * 0.08 * (myAtk ? 1 : -1),
        y: state.ball.y + (i - 2) * 0.1
      };
      target.x = Math.max(0.05, Math.min(0.95, target.x));
      target.y = Math.max(0.1, Math.min(0.9, target.y));
      this._moveToward(p, target, 0.08);
    });
    defTeam.forEach((p, i) => {
      const defLine = myAtk ? 0.4 : 0.6;
      const target = {
        x: Math.max(0.1, Math.min(0.9, state.ball.x * 0.5 + defLine)),
        y: state.ball.y + (i - 2) * 0.12
      };
      target.y = Math.max(0.1, Math.min(0.9, target.y));
      this._moveToward(p, target, 0.05);
    });

    state.ticks++;
  }

  _teamStrength(team, side) {
    return team.reduce((s, p) => s + (p.overall || 65), 0) / team.length;
  }

  _nearDefenders(player, defTeam) {
    return defTeam.filter(d => Math.hypot(d.x - player.x, d.y - player.y) < 0.15).length;
  }

  _moveToHome(players) {
    players.forEach(p => this._moveToward(p, { x: p.hx, y: p.hy }, 0.05));
  }

  _moveToward(p, target, speed) {
    const dx = target.x - p.x, dy = target.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.005) return;
    const pace = (p.pace || 70) / 10000;
    p.x += (dx / dist) * Math.min(speed, pace);
    p.y += (dy / dist) * Math.min(speed, pace);
    p.x = Math.max(0.03, Math.min(0.97, p.x));
    p.y = Math.max(0.05, Math.min(0.95, p.y));
  }

  // ---- 播放阶段（零 AI 计算）----
  start() {
    this.playing = true;
    this.playTick = 0;
    this.startTime = performance.now();
    this.lastEvtLen = 0;
    // 每个现实帧对应 gameTick 数
    // 270 game-mins × 60 = 16200 game-seconds
    // 16200 game-seconds / MATCH_REAL_SEC real-seconds = 180 game-sec/real-sec
    // 180 game-sec / MATCH_FPS ticks/sec = 36 ticks/real-sec
    this.ticksPerRealSec = (MATCH_DURATION * 60) / MATCH_REAL_SEC;
  }

  getCurrentFrame() {
    if (!this.playing || !this.frames.length) return null;
    const elapsed = (performance.now() - this.startTime) / 1000;
    const currentTick = Math.min(Math.floor(elapsed * this.ticksPerRealSec), this.frames.length - 1);
    return this.frames[currentTick];
  }

  getDisplayTime() {
    const frame = this.getCurrentFrame();
    if (!frame) return { min: 0, sec: 0 };
    return { min: frame.min, sec: frame.sec };
  }

  isFinished() {
    if (!this.playing) return false;
    const elapsed = (performance.now() - this.startTime) / 1000;
    return elapsed >= MATCH_REAL_SEC;
  }

  getRenderData() {
    const frame = this.getCurrentFrame();
    if (!frame) return null;
    const myEvents = (this.events || []).filter(e => {
      const evFrame = this.frames.findIndex(f => f.evt !== null && f.min === frame.min && f.sec >= frame.sec - 1);
      return true;
    });
    return {
      score: frame.score,
      min: frame.min,
      sec: frame.sec,
      phase: frame.phase,
      ball: frame.ball,
      players: [...frame.my, ...frame.opp],
      events: this.events,
      possession: frame.possession,
      stats: this.stats,
    };
  }
}
</script>

function getAvatar(player) {
  const seed = encodeURIComponent(player.name);
  return `https://api.dicebear.com/9.x/pixel-art/svg?seed=${seed}&backgroundColor=1a2030&radius=50`;
}

function generatePixelAvatar(player) {
  // Pixel art ID-photo style — face centered, ~60% canvas height
  const canvas = document.createElement('canvas');
  const SIZE = 256;
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let seed = 0;
  for (let i = 0; i < player.name.length; i++) seed = (seed * 31 + player.name.charCodeAt(i)) >>> 0;
  function rng() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 0xFFFFFFFF; }
  function ri(min, max) { return Math.floor(rng() * (max - min + 1)) + min; }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

  const skinMap = {
    England:()=>pick(['#F2D8B8','#EAC8A0','#F0D0A8']),
    Germany:()=>pick(['#F0D8B8','#ECD0A4']),
    Spain:()=>pick(['#D8A878','#C8906C']),
    France:()=>pick(['#D8A870','#C48860']),
    Brazil:()=>pick(['#B87040','#A06030']),
    Argentina:()=>pick(['#D4A078','#C49068']),
    Italy:()=>pick(['#D8B088','#C8A070']),
    Nigeria:()=>pick(['#5C2C0C','#4A2008']),
    Japan:()=>pick(['#E8D0A8','#D8C098']),
    Korea:()=>pick(['#E4CC9A','#D4BC88']),
    China:()=>pick(['#E0C8A0','#D0B888']),
    USA:()=>pick(['#D0A078','#C09070']),
  };
  const nat = player.nationality || player.nation || 'England';
  const skinBase = (skinMap[nat] || skinMap.England)();
  function adj(hex, amt) {
    const n = parseInt(hex.slice(1),16);
    const r=Math.min(255,Math.max(0,((n>>16)&0xff)+amt));
    const g=Math.min(255,Math.max(0,((n>>8)&0xff)+amt));
    const b=Math.min(255,Math.max(0,(n&0xff)+amt));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  const skinHi=adj(skinBase,22), skinShd=adj(skinBase,-22), skinDk=adj(skinBase,-40), skinDK2=adj(skinBase,-58);

  const hairPalettes=[
    ['#100804','#281408','#3C2010'],
    ['#281008','#4A2C14','#6A4020'],
    ['#4A2C10','#6A4820','#8A6430'],
    ['#6A4018','#907028','#B09040'],
    ['#9A7830','#C8A050','#E0C070'],
    ['#501408','#7A2818','#A04020'],
    ['#3C3C3C','#606060','#888888'],
  ];
  const [hairDrk,hairMid,hairLit]=hairPalettes[ri(0,hairPalettes.length-1)];
  const eyeCol=pick(['#2A4C8C','#1E5420','#6A3418','#404040','#3A6A8C','#8A5A18']);

  const P=4; // logical px -> canvas px
  function rpx(gx,gy,c,w=1,h=1){ctx.fillStyle=c;ctx.fillRect(gx*P,gy*P,w*P,h*P);}

  // Background: dark blue-grey (ID photo feel)
  ctx.fillStyle='#1a2030'; ctx.fillRect(0,0,SIZE,SIZE);

  // ── ID photo centering: head starts at ~y=18, chin at ~y=185 ──
  // Grid: 64x64 logical, P=4, canvas 256x256
  // Head: centered at x=32, chin at y=46 (chin canvas y=184), top at y=2 (y=8)
  const HGX=14, HGY=2, HW=36, HH=44; // head grid origin + size
  const HCX=HGX+HW/2; // head center x = 32

  // Shoulders (canvas y=188 to 256)
  const jc=pick(['#CC1111','#1133BB','#118811','#CC8800','#881188','#008899','#CC4400']);
  const jl=pick(['#EE3333','#2255DD','#22AA22','#EECC00','#AA22AA','#00AACC','#EE6600']);
  for(let cy=188;cy<256;cy+=P){
    const x0=Math.max(4, 20-(cy-188)/8);
    const x1=Math.min(60, 44+(cy-188)/8);
    for(let cx=x0;cx<x1;cx+=P) rpx(cx,(cy-188)/P,jc);
  }
  // Shoulder highlight
  for(let cy=188;cy<210;cy+=P){
    for(let cx=24;cx<38;cx+=P) rpx(cx,(cy-188)/P,jl);
  }

  // Neck
  for(let gy=40;gy<47;gy++){
    rpx(HGX+12,gy,skinDk); rpx(HGX+11,gy,skinDK2);
    rpx(HGX+HW-12,gy,skinHi); rpx(HGX+HW-11,gy,adj(skinHi,10));
    for(let gx=HGX+13;gx<HGX+HW-13;gx++) rpx(gx,gy,skinShd);
  }

  // ── Head oval ──
  // [leftOffset, rightOffset] from HGX for each gy
  const headShape=[];
  for(let i=0;i<HH;i++){
    const t=i/(HH-1); // 0=top, 1=chin
    const frac=Math.sin(t*Math.PI);
    const hw=Math.floor(HW/2*frac);
    headShape.push([HGX+(HW/2-hw), HGX+(HW/2+hw)]);
  }
  for(let i=0;i<HH;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx;gx<=rx;gx++){
      const dx=(gx-HCX)/(HW/2);
      let s;
      if(dx<-0.65)s=skinDK2;
      else if(dx<-0.25)s=skinDk;
      else if(dx<-0.05)s=skinShd;
      else if(dx>0.65)s=skinHi;
      else if(dx>0.25)s=adj(skinBase,14);
      else s=skinBase;
      if(i<4&&dx>-0.2&&dx<0.6)s=skinHi;
      if(i>HH-6)s=adj(skinShd,-10);
      rpx(gx,gy,s);
    }
  }

  // Ears
  for(let i=10;i<22;i++){
    rpx(HGX-2,i,skinDk); rpx(HGX-1,i,skinShd);
    rpx(HGX+HW+1,i,skinHi); rpx(HGX+HW,i,adj(skinHi,10));
  }

  // ── Hair ──
  const hStyle=ri(0,6);
  for(let i=0;i<HH;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx-2;gx<rx+3;gx++){
      if(gx<lx||gx>rx)rpx(gx,gy,hairDrk);
    }
  }
  for(let i=0;i<HH-4;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx;gx<rx;gx++){
      if(gx<lx+2||gx>rx-2)rpx(gx,gy,hairMid);
    }
  }
  for(let i=0;i<HH-8;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx+HW*0.55;gx<rx-1;gx++){
      if(gx<lx+HW*0.6)rpx(gx,gy,hairLit);
    }
  }
  // Hairline
  const hairRow=HGY+HH*0.2|0;
  for(let gx=HGX;gx<HGX+HW;gx++){
    const [lx,rx]=headShape[hairRow-HGY];
    if(gx<lx+2||gx>rx-2)rpx(gx,hairRow,hairDrk);
  }

  if(hStyle===1){// buzz cut
    for(let gx=HGX;gx<HGX+HW;gx++){
      const hi=headShape[HH*0.15|0];
      if(gx<hi[0]+1||gx>hi[1]-1)rpx(gx,HGY+HH*0.15|0,adj(hairDrk,-12));
    }
  } else if(hStyle===2){// quiff
    for(let gx=HGX+HW*0.35;gx<HGX+HW*0.65;gx++)rpx(gx,HGY-2,hairLit);
    for(let gx=HGX+HW*0.3;gx<HGX+HW*0.7;gx++)rpx(gx,HGY-1,hairMid);
  } else if(hStyle===3){// longer sides
    for(let i=HH*0.25|0;i<HH;i++){rpx(HGX-2,i,hairMid);rpx(HGX-3,i,hairDrk);rpx(HGX+HW+2,i,hairMid);rpx(HGX+HW+3,i,hairDrk);}
  } else if(hStyle===4){// fade
    for(let gx=HGX;gx<HGX+HW;gx++){
      const hi=headShape[HH*0.15|0];
      const f=gx<hi[0]+4?-25:(gx>hi[1]-4?-25:0);
      if(gx<hi[0]+2||gx>hi[1]-2)rpx(gx,HGY+HH*0.15|0,adj(hairDrk,f));
    }
  }

  // ── Eyebrows ──
  const browCol=adj(hairMid,-15);
  const browY=HGY+HH*0.32|0;
  for(let gx=HGX+HW*0.18;gx<HGX+HW*0.42;gx++)rpx(gx,browY,browCol);
  for(let gx=HGX+HW*0.58;gx<HGX+HW*0.82;gx++)rpx(gx,browY,browCol);
  rpx(HGX+HW*0.18,browY+1,browCol);rpx(HGX+HW*0.82,browY+1,browCol);

  // ── Eyes ──
  const EY=HGY+HH*0.37|0, EH=EY+4;
  for(let gx=HGX+HW*0.18;gx<HGX+HW*0.43;gx++)rpx(gx,EY,adj(skinBase,-12));
  for(let gx=HGX+HW*0.57;gx<HGX+HW*0.82;gx++)rpx(gx,EY,adj(skinBase,-12));
  for(let gx=HGX+HW*0.18;gx<HGX+HW*0.43;gx++)rpx(gx,EH,adj(skinBase,-8));
  for(let gx=HGX+HW*0.57;gx<HGX+HW*0.82;gx++)rpx(gx,EH,adj(skinBase,-8));
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.2;gx<HGX+HW*0.4;gx++)rpx(gx,gy,'#D8D4CC');
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.6;gx<HGX+HW*0.8;gx++)rpx(gx,gy,'#D8D4CC');
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.21;gx<HGX+HW*0.39;gx++)rpx(gx,gy,eyeCol);
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.61;gx<HGX+HW*0.79;gx++)rpx(gx,gy,eyeCol);
  for(let gy=EY+2;gy<EH-1;gy++)for(let gx=HGX+HW*0.24;gx<HGX+HW*0.36;gx++)rpx(gx,gy,'#080604');
  for(let gy=EY+2;gy<EH-1;gy++)for(let gx=HGX+HW*0.64;gx<HGX+HW*0.76;gx++)rpx(gx,gy,'#080604');
  rpx(HGX+HW*0.24,EY+1,'#FFFFFF');rpx(HGX+HW*0.64,EY+1,'#FFFFFF');

  // ── Nose ──
  const NY=EH+2;
  rpx(HCX-2,NY,skinShd);rpx(HCX+2,NY,skinShd);
  rpx(HCX-3,NY+1,skinDk);rpx(HCX+3,NY+1,skinDk);
  rpx(HCX-4,NY+2,skinDK2);rpx(HCX+4,NY+2,skinDK2);
  rpx(HCX-3,NY+2,skinShd);rpx(HCX+3,NY+2,skinShd);
  rpx(HCX-4,NY+3,skinDk);rpx(HCX+4,NY+3,skinDk);
  rpx(HCX-3,NY+3,skinBase);rpx(HCX+3,NY+3,skinBase);

  // ── Mouth ──
  const MY=NY+4;
  const lc=adj(skinBase,-24),lc2=adj(skinBase,-10);
  for(let gx=HGX+HW*0.32;gx<HGX+HW*0.68;gx++)rpx(gx,MY,lc);
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+1,lc2);
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+2,lc);
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+3,lc2);
  rpx(HGX+HW*0.36,MY+3,adj(lc2,20));rpx(HGX+HW*0.38,MY+3,adj(lc2,24));
  rpx(HGX+HW*0.62,MY+3,adj(lc2,20));rpx(HGX+HW*0.64,MY+3,adj(lc2,16));
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+4,adj(skinBase,-20));

  // ── Stubble ──
  if(rng()>0.4){
    ctx.globalAlpha=0.3;
    for(let gy=HGY+HH*0.55;gy<HGY+HH*0.82;gy++)for(let gx=HGX+HW*0.15;gx<HGX+HW*0.85;gx++){
      if((gx*7+gy*13+seed)%7===0)rpx(gx,gy,adj(hairMid,5));
    }
    ctx.globalAlpha=1;
  }

  return canvas.toDataURL('image/png');
}

// ---- 3D Voxel Player (Three.js Minecraft style) ----
let voxelScenes = {};
function getVoxelPlayer(player, containerId) {
  const h = player.height || 180;
  const w = player.weight || 75;
  const nat = player.nationality || player.nation || 'England';
  const skinColors = {
    England:'#F2D8B8',Spain:'#D8A878',Germany:'#F0D8B8',France:'#D8A870',
    Brazil:'#B87040',Argentina:'#D4A078',Italy:'#D8B088',Nigeria:'#5C2C0C',
    Japan:'#E8D0A8',Korea:'#E4CC9A',China:'#E0C8A0',USA:'#D0A078'
  };
  const skin = skinColors[nat] || '#F2D8B8';
  const jc = ['#CC1111','#1133BB','#118811','#CC8800','#881188','#008899','#CC4400','#224488'][(player.name.charCodeAt(0)+player.name.charCodeAt(1))%8];
  
  return `<div id="${containerId}" style="width:200px;height:280px;margin:0 auto;"></div>`;
}

function initVoxelPlayer(player, containerId) {
  if(!window.THREE) return;
  const container = document.getElementById(containerId);
  if(!container) return;
  
  // Cleanup previous
  if(voxelScenes[containerId]) {
    voxelScenes[containerId].renderer.dispose();
    container.innerHTML = '';
  }
  
  const h = player.height || 180, w = player.weight || 75, nat = player.nationality || player.nation || 'England';
  const skinColors = {England:'#F2D8B8',Spain:'#D8A878',Germany:'#F0D8B8',France:'#D8A870',Brazil:'#B87040',Argentina:'#D4A078',Italy:'#D8B088',Nigeria:'#5C2C0C',Japan:'#E8D0A8',Korea:'#E4CC9A',China:'#E0C8A0',USA:'#D0A078'};
  const skin = skinColors[nat] || '#F2D8B8';
  const jc = ['#CC1111','#1133BB','#118811','#CC8800','#881188','#008899','#CC4400','#224488'][(player.name.charCodeAt(0)+player.name.charCodeAt(1))%8];
  
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a2030);
  const camera = new THREE.PerspectiveCamera(45, 200/280, 0.1, 100);
  camera.position.set(0, 0.35, 1.1);
  camera.lookAt(0, 0.15, 0);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(200, 280);
  container.appendChild(renderer.domElement);
  
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8);
  dl.position.set(2, 3, 2);
  scene.add(dl);
  const bl = new THREE.DirectionalLight(0x00d4ff, 0.3); bl.position.set(-2, 1, -2); scene.add(bl);
  
  const playerG = new THREE.Group();
  scene.add(playerG);
  
  const skinM = new THREE.MeshLambertMaterial({color:skin});
  const jerseyM = new THREE.MeshLambertMaterial({color:jc});
  const shortM = new THREE.MeshLambertMaterial({color:'#1a1a2e'});
  const shoeM = new THREE.MeshLambertMaterial({color:'#0a0a0a'});
  const hairM = new THREE.MeshLambertMaterial({color:'#281408'});
  
  function box(w,h,d,m,x,y,z){const g=new THREE.BoxGeometry(w,h,d);const me=new THREE.Mesh(g,m);me.position.set(x,y,z);return me;}
  
  // Head
  playerG.add(box(0.1,0.1,0.1,skinM,0,0.35,0));
  playerG.add(box(0.102,0.03,0.102,hairM,0,0.41,0));
  playerG.add(box(0.102,0.06,0.025,hairM,0,0.35,-0.04));
  // Torso
  playerG.add(box(0.08,0.12,0.05,jerseyM,0,0.21,0));
  // Shorts
  playerG.add(box(0.085,0.04,0.055,shortM,0,0.13,0));
  // Legs
  playerG.add(box(0.025,0.08,0.025,skinM,-0.022,0.02,0));
  playerG.add(box(0.025,0.08,0.025,skinM,0.022,0.02,0));
  // Socks
  playerG.add(box(0.023,0.05,0.023,jerseyM,-0.022,-0.05,0));
  playerG.add(box(0.023,0.05,0.023,jerseyM,0.022,-0.05,0));
  // Shoes
  playerG.add(box(0.03,0.015,0.04,shoeM,-0.022,-0.12,0.008));
  playerG.add(box(0.03,0.015,0.04,shoeM,0.022,-0.12,0.008));
  // Arms
  playerG.add(box(0.02,0.07,0.02,skinM,-0.055,0.21,0));
  playerG.add(box(0.02,0.07,0.02,skinM,0.055,0.21,0));
  // Shadow
  const sh = new THREE.Mesh(new THREE.CircleGeometry(0.12,32),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.3}));
  sh.rotation.x=-Math.PI/2;
  sh.position.y=-0.13;
  playerG.add(sh);
  
  let angle=0;
  function animate(){requestAnimationFrame(animate);angle+=0.02;playerG.rotation.y=angle;renderer.render(scene,camera);}
  animate();
  
  voxelScenes[containerId] = {renderer, scene};
}

// ---- 3D Player Body SVG (fallback) ----
function getPlayerBody(player) {
  const h = player.height || 180;
  const w = player.weight || 75;
  // Body proportions based on height/weight
  const bodyW = 28 + (w - 70) * 0.3;
  const bodyH = 35 + (h - 175) * 0.2;
  const legLen = 55 + (h - 175) * 0.4;
  const skinColors = {
    England:'#FFDFC4',Spain:'#F0C8A0',Germany:'#FFE0BD',France:'#FFDFC4',
    Brazil:'#C4956A',Argentina:'#F0C8A0',Italy:'#FFDFC4',Nigeria:'#704214',
    Japan:'#FFE4C4',Korea:'#FFE4C4',China:'#FFE4C4',USA:'#E8B796'
  };
  const skin = skinColors[player.region] || '#FFDFC4';
  const jerseyColors = ['#00d4ff','#ff4444','#22c55e','#ffd700','#9333ea','#f97316','#ec4899','#06b6d4'];
  const jc = jerseyColors[(player.name.charCodeAt(0)+player.name.charCodeAt(1))%jerseyColors.length];
  const num = ((player.name.charCodeAt(0)*3+player.name.charCodeAt(2))%99)+1;
  const cx = 60;
  const headY = 20;
  const neckY = headY + 22;
  const shoulderY = neckY + 8;
  const waistY = shoulderY + bodyH;
  const kneeY = waistY + legLen * 0.55;
  const footY = waistY + legLen;
  const lx = cx - bodyW/2;
  const rx = cx + bodyW/2;

    <!-- Left arm -->
    <path d="M${lx} ${shoulderY+3} L${lx-14} ${shoulderY+bodyH*0.7}" stroke="url(#jg)" stroke-width="${bodyW*0.28}" stroke-linecap="round" fill="none"/>

// ---- Player Creation ----
function createPlayer(region, position, quality=60, ageRange=[14,20]) {
  const age = rand(ageRange[0], ageRange[1]);
  const names = NAMES[region] || NAMES.England;
  const name = names[rand(0,names.length-1)];
  const pb = {GK:{pac:-20,sho:-25,def:20},CB:{pac:-5,sho:-15,def:25,phy:20},LB:{pac:15,def:10,pas:10},RB:{pac:15,def:10,pas:10},CDM:{def:15,pas:15},CM:{sho:10,def:5,pas:18},CAM:{pac:10,sho:18,def:-5,pas:15},LW:{pac:22,sho:18,def:-10},RW:{pac:22,sho:18,def:-10},ST:{pac:12,sho:25,def:-15,phy:15}};
  const b = pb[position]||{};
  const ovr = Math.max(30,Math.min(99,quality+rand(-8,8)));
  const pot = Math.min(99,quality+rand(5,22));
  const hBase = {GK:192,CB:188,LB:181,RB:181,CDM:184,CM:181,CAM:178,LW:176,RW:176,ST:185}[position]||180;
  const height = Math.round(hBase + rand(-4,4) - (age<20?(20-age)*0.08:0));
  const weight = Math.round(height*0.65+rand(-5,5));
  const val = Math.floor(ovr*8000*(age<22?1.6:age<26?1.2:age<30?0.8:0.35)*rand(80,120)/100);
  return {
    id:uid(), name, region, position, age, ovr, potential:pot,
    pace:Math.max(30,Math.min(99,rand(50,85)+(b.pac||0))),
    shooting:Math.max(30,Math.min(99,rand(40,80)+(b.sho||0))),
    passing:Math.max(30,Math.min(99,rand(45,85)+(b.pas||0))),
    defending:Math.max(30,Math.min(99,rand(40,80)+(b.def||0))),
    physical:Math.max(30,Math.min(99,rand(50,85)+(b.phy||0))),
    fitness:rand(75,100), morale:rand(60,100),
    value:val, wage:Math.floor(ovr*80*rand(80,120)/100),
    goals:0, assists:0, matches:0, height, weight
  };
}

// ---- Match Engine v3.0 ----
function startMatch() {
  if(rafId){cancelAnimationFrame(rafId);rafId=null}
  MS = null; tab = 'match'; render();

  setTimeout(()=>{
    const fp = FP[G.formation]||FP['4-4-2'];
    const myTeam = G.team.slice(0,11).map((p,i)=>{
      const pos = fp[i]||[.25,.5];
      return {...p, hx:pos[0], hy:pos[1], role:i===0?'GK':i<3?'DEF':i<7?'MID':'ATT', isMy:true};
    });
    const oppIdx = rand(1,G.league.length-1);
    const oppStr = G.league[oppIdx].strength;
    const oppPos = ['GK','CB','CB','LB','RB','CDM','CM','CM','LW','RW','ST'];
    const oppTeam = oppPos.map((pos,i)=>{
      const p = createPlayer(['England','Spain','Brazil','Germany','France'][rand(0,4)],pos,oppStr);
      return {...p, role:pos, isMy:false};
    });

    // v4: 预计算引擎 — 赛前一次性生成，播放零计算
    MS = new MatchEngine(myTeam, oppTeam, getLN(oppIdx), Tactics.TIKITAKA, Tactics.COUNTER);
    MS.oppName = getLN(oppIdx);
    // 兼容别名
    Object.defineProperty(MS, 'myScore', { get() { return this.score.my; } });
    Object.defineProperty(MS, 'oppScore', { get() { return this.score.opp; } });
    Object.defineProperty(MS, 'finished', { get() { return !this.playing; } });
    MS.start();

    render();
    setTimeout(()=>{rafId=requestAnimationFrame(matchLoopV3)},100);
  },100);
}

function matchLoopV3() {
  if(!MS||!MS.playing){rafId=null;return}
  drawMatchV3();
  const evts=(MS.events||[]).length;
  if(evts!==_lastEvtLen){
    const evtEl=document.getElementById('evts');
    if(evtEl)evtEl.innerHTML=evtHTML();
    _lastEvtLen=evts;
  }
  // 更新 HUD 分数/分钟
  const f=MS.getCurrentFrame();
  if(f){
    const sEl=document.getElementById('scr-my');
    const oEl=document.getElementById('scr-opp');
    const mEl=document.getElementById('scr-min');
    if(sEl)sEl.textContent=f.score.my;
    if(oEl)oEl.textContent=f.score.opp;
    if(mEl)mEl.textContent=f.min+"'";
  }
  if(MS.isFinished()){
    endMatchV3();
    rafId=null;
    return;
  }
  rafId=requestAnimationFrame(matchLoopV3);
}

function evtHTML(){
  if(!MS)return'';
  const colors={goal:'#22c55e',shot:'#f59e0b',foul:'#ef4444',pass:'#3b82f6',info:'#94a3b8',defense:'#a855f7',red:'#dc2626',miss:'#6b7280',save:'#f59e0b',end:'#10b981'};
  return MS.events.slice(0,15).map(e=>`<div style="padding:6px 8px;border-radius:6px;font-size:11px;border-left:3px solid ${colors[e.type]||'#94a3b8'};background:${colors[e.type]||'#94a3b8'}18;margin-bottom:4px"><span style="color:#94a3b8;margin-right:6px">${e.min}</span>${e.txt}</div>`).join('');
}

function endMatchV3(){
  if(!MS||MS.finished===false)return;
  if(rafId){cancelAnimationFrame(rafId);rafId=null}
  
  const myL=G.league.find(l=>l.name==='FC United');
  const oppL=G.league.find(l=>l.name===MS.oppName);
  
  myL.played++;oppL.played++;
  myL.gf+=MS.score.my;myL.ga+=MS.score.opp;
  oppL.gf+=MS.score.opp;oppL.ga+=MS.score.my;
  
  if(MS.score.my>MS.score.opp){myL.won++;myL.pts+=3;oppL.lost++}
  else if(MS.score.my===MS.score.opp){myL.drawn++;myL.pts++;oppL.drawn++;oppL.pts++}
  else{myL.lost++;oppL.won++;oppL.pts+=3}
  
  G.budget+=120000*G.facilities.stadium;
  G.team.slice(0,11).forEach(p=>{
    p.matches++;
    p.fitness=Math.max(45,p.fitness-rand(10,20));
    p.morale=Math.min(100,p.morale+(MS.score.my>MS.score.opp?6:-4));
  });
  
  G.week++;
  const res=MS.score.my>MS.score.opp?t('win'):MS.score.my===MS.score.opp?t('draw'):t('lose');
  addNews(`${res} FC联 ${MS.score.my}-${MS.score.opp} vs ${MS.oppName}`);
  
  if(G.week>38){
    G.season++;G.week=1;
    G.league.sort((a,b)=>b.pts-a.pts);
    const pos=G.league.findIndex(l=>l.name==='FC United')+1;
    addNews(`🏆 第${G.season-1}赛季结束! 排名#${pos}`);
    G.league.forEach(l=>{
      if(l.name!=='FC United')l.strength=Math.max(35,Math.min(95,l.strength+rand(-6,6)));
      l.played=l.won=l.drawn=l.lost=l.gf=l.ga=l.pts=0
    });
    G.budget+=2500000;
  }
  
  save();
  render();
}

let _mcCtx=null;

function drawMatchV3(){
  const cvs=document.getElementById('mc');
  if(!cvs||!MS)return;
  const W=480,H=270;
  if(cvs.width!==W||cvs.height!==H){cvs.width=W;cvs.height=H;_mcCtx=null;}
  if(!_mcCtx||_mcCtx.canvas!==cvs){_mcCtx=cvs.getContext('2d');}
  const c=_mcCtx;

  const data=MS.getRenderData();
  if(!data)return;

  // Grass
  c.fillStyle='#2d8a2d';c.fillRect(0,0,W,H);

  // Simple stripes (fewer iterations)
  for(let i=0;i<10;i+=2){c.fillStyle='rgba(0,0,0,0.03)';c.fillRect(i*(W/10),0,W/10,H);}

  // Lines (simplified)
  c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=1;
  c.strokeRect(12,12,W-24,H-24);
  c.strokeRect(12,H/2-45,35,90);
  c.strokeRect(W-47,H/2-45,35,90);
  c.beginPath();c.moveTo(W/2,12);c.lineTo(W/2,H-12);c.stroke();
  c.beginPath();c.arc(W/2,H/2,30,0,Math.PI*2);c.stroke();

  // Players (simplified - no shadows, fewer state colors)
  c.font='7px Arial';c.textAlign='center';
  data.players.forEach(p=>{
    const bx=p.x*W, by=p.y*H;
    const col=p.isMy?'#0ea5e9':'#ef4444';
    c.fillStyle=col;c.beginPath();c.arc(bx,by,7,0,Math.PI*2);c.fill();
    c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
    c.fillStyle='#fff';c.fillText((p.name||'').split(' ').pop().substr(0,6),bx,by-10);
  });

  // Ball
  const bx=data.ball.x*W, by=data.ball.y*H;
  c.fillStyle='#fff';c.beginPath();c.arc(bx,by,4,0,Math.PI*2);c.fill();

  // Score HUD (HTML overlay is faster, but keep simple)
  c.fillStyle='rgba(0,0,0,0.7)';c.fillRect(W/2-50,4,100,20);
  c.fillStyle='#0ea5e9';c.font='bold 14px Arial';c.textAlign='right';c.fillText(data.score.my,W/2-6,18);
  c.fillStyle='#fff';c.font='12px Arial';c.textAlign='center';c.fillText('-',W/2,18);
  c.fillStyle='#ef4444';c.font='bold 14px Arial';c.textAlign='left';c.fillText(data.score.opp,W/2+6,18);
  c.fillStyle='#94a3b8';c.font='bold 9px Arial';c.textAlign='right';c.fillText(data.min+"'",W/2+44,18);
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

function renderHome(myL,sorted,myPos){
  return `
    <div class="card" style="padding:12px;margin-bottom:12px">

        <div style="background:rgba(30,41,59,.6);border-radius:10px;padding:8px"><div class="gt" style="color:#00d4ff;font-weight:700;font-size:20px">#${myPos}</div><div style="font-size:10px;color:#94a3b8">${t('rank')}</div></div>
        <div style="background:rgba(30,41,59,.6);border-radius:10px;padding:8px"><div style="font-weight:700;font-size:16px">${myL.won}-${myL.drawn}-${myL.lost}</div><div style="font-size:10px;color:#94a3b8">${t('record')}</div></div>
        <div style="background:rgba(30,41,59,.6);border-radius:10px;padding:8px"><div style="font-weight:700;font-size:20px;color:${myL.gf-myL.ga>=0?'#22c55e':'#ef4444'}">${myL.gf-myL.ga>0?'+':''}${myL.gf-myL.ga}</div><div style="font-size:10px;color:#94a3b8">${t('gd')}</div></div>
        <div style="background:rgba(30,41,59,.6);border-radius:10px;padding:8px"><div class="gt" style="color:#fbbf24;font-weight:700;font-size:20px">${myL.pts}</div><div style="font-size:10px;color:#94a3b8">${t('pts')}</div></div>
      </div>
    </div>
    <div class="card" style="padding:12px;margin-bottom:12px">
      <button onclick="startMatch()" class="btn btn-g" style="width:100%;margin-bottom:8px;font-size:15px;padding:14px">⚽ ${t('play')}</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button onclick="trainTeam();render()" class="btn btn-c">🏋️ ${t('train')}</button>
        <button onclick="refreshMarket();scoutAcademy();render()" class="btn btn-p">🔄 ${t('refresh')}</button>
      </div>
    </div>
    ${G.news.length?`<div class="card" style="padding:12px;margin-bottom:12px"><div style="font-weight:700;font-size:13px;margin-bottom:8px">📰 ${t('news')}</div>${G.news.slice(0,5).map(n=>`<div style="font-size:11px;background:rgba(30,41,59,.6);padding:8px;border-radius:8px;margin-bottom:4px">${n.txt}</div>`).join('')}</div>`:''}
    ${G.prospects.length?`<div class="card" style="padding:12px;margin-bottom:12px"><div style="font-weight:700;font-size:13px;margin-bottom:8px">🌟 ${t('academy')} (${G.prospects.length})</div>${G.prospects.map(p=>pCardHTML(p,true,false)).join('')}</div>`:''}
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">💰 ${t('market')}</div>
      ${G.market.map(p=>pCardHTML(p,false,true)).join('')}
    </div>
    <div class="card" style="padding:12px">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">📊 ${t('standings')}</div>
      ${sorted.slice(0,10).map((s,i)=>{
        const isMe=s.name==='FC United';
        return `<div style="display:grid;grid-template-columns:28px 1fr 36px 44px;padding:7px 10px;border-radius:8px;margin-bottom:3px;font-size:12px;align-items:center;${isMe?'background:linear-gradient(90deg,rgba(0,212,255,.25),transparent);border:1px solid rgba(0,212,255,.4)':''}">
          <span style="font-weight:700;color:${i<3?'#22c55e':'#94a3b8'}">${i+1}</span>
          <span style="font-weight:${isMe?700:400};color:${isMe?'#00d4ff':'#e2e8f0'}">${getLN(s.index)}</span>
          <span style="text-align:center">${s.won}</span>
          <span style="text-align:right;font-weight:700;color:#fbbf24">${s.pts}</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

function pCardHTML(p,showSign,showPrice){
  const av=getAvatar(p);
  return `<div class="pcard" onclick="selPlayer=${JSON.stringify(p).replace(/"/g,'&quot;')};tab='playerDetail';render()" style="margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px">
        <img src="${av}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,212,255,.4)">
        <div>
          <div style="font-weight:700;font-size:13px">${p.name}</div>
          <div style="font-size:11px;color:#94a3b8">${p.age}岁 · ${p.position} · ${p.region}</div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="gt" style="font-size:24px;font-weight:700;color:${p.ovr>=75?'#00d4ff':p.ovr>=65?'#22c55e':'#94a3b8'}">${p.ovr}</div>
        ${showPrice?`<div style="font-size:11px;color:#fbbf24">${fmt(p.askPrice)}</div>`:''}
      </div>
    </div>
    ${showSign?`<div style="display:flex;gap:6px;margin-top:8px">
      <button onclick="event.stopPropagation();signP('${p.id}')" class="btn btn-gr" style="flex:1;font-size:11px;padding:7px">✅ ${t('sign')}</button>
      <button onclick="event.stopPropagation();rejectP('${p.id}')" class="btn btn-r" style="flex:1;font-size:11px;padding:7px">❌ ${t('reject')}</button>
    </div>`:''}
  </div>`;
}

function renderDetail(){
  const p = typeof selPlayer==='string'?JSON.parse(selPlayer):selPlayer;
  if(!p)return'';
  const av=getAvatar(p);
  const voxelId='voxel-'+Date.now();
  const stats=[{l:t('pace'),v:p.pace,c:'#00d4ff'},{l:t('shooting'),v:p.shooting,c:'#ef4444'},{l:t('passing'),v:p.passing,c:'#fbbf24'},{l:t('defending'),v:p.defending,c:'#22c55e'},{l:t('physical'),v:p.physical,c:'#8b5cf6'}];
  const bmi=(p.weight/Math.pow(p.height/100,2)).toFixed(1);
  return `
    <div class="card" style="padding:16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <img src="${av}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #00d4ff;box-shadow:0 0 20px rgba(0,212,255,.4)">
        <div>
          <div class="gt" style="font-size:20px;font-weight:700;color:#00d4ff">${p.name}</div>
          <div style="font-size:12px;color:#94a3b8">${p.position} · ${p.region}</div>
          <div style="font-size:16px;font-weight:700;color:#fbbf24;margin-top:4px">${p.ovr} OVR ${p.potential>p.ovr?`<span style="color:#22c55e;font-size:12px">(↑${p.potential-p.ovr})</span>`:''}</div>
        </div>
      </div>

      <!-- 3D Voxel Player -->
      <div style="background:rgba(15,23,42,.8);border-radius:12px;padding:16px;margin-bottom:12px;text-align:center">
        <div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:12px">🏃 3D 像素球员</div>
        ${getVoxelPlayer(p, voxelId)}
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">
          <div style="background:rgba(30,41,59,.6);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:10px;color:#94a3b8">${t('height')}</div>
            <div style="font-size:18px;font-weight:700">${p.height}cm</div>
          </div>
          <div style="background:rgba(30,41,59,.6);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:10px;color:#94a3b8">${t('weight')}</div>
            <div style="font-size:18px;font-weight:700">${p.weight}kg</div>
          </div>
          <div style="background:rgba(30,41,59,.6);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:10px;color:#94a3b8">${t('bmi')}</div>
            <div style="font-size:18px;font-weight:700;color:${bmi<18.5?'#60a5fa':bmi<25?'#22c55e':bmi<30?'#fbbf24':'#ef4444'}">${bmi}</div>
          </div>
        </div>
      </div>

      <!-- 能力值 -->
      <div style="background:rgba(15,23,42,.8);border-radius:12px;padding:12px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:10px">📊 ${t('abilities')}</div>
        ${stats.map(s=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="font-size:11px;color:#94a3b8;width:36px">${s.l}</span>
          <div class="sbar" style="flex:1"><div class="sfill" style="width:${s.v}%;background:${s.c}"></div></div>
          <span style="font-size:13px;font-weight:700;width:28px;text-align:right">${s.v}</span>
        </div>`).join('')}
      </div>

      <!-- 统计 -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
        <div style="background:rgba(34,197,94,.15);border-radius:8px;padding:8px;text-align:center"><div style="font-size:22px;font-weight:700;color:#22c55e">${p.goals}</div><div style="font-size:10px;color:#94a3b8">${t('goals')}</div></div>
        <div style="background:rgba(0,212,255,.15);border-radius:8px;padding:8px;text-align:center"><div style="font-size:22px;font-weight:700;color:#00d4ff">${p.assists}</div><div style="font-size:10px;color:#94a3b8">${t('assists')}</div></div>
        <div style="background:rgba(251,191,36,.15);border-radius:8px;padding:8px;text-align:center"><div style="font-size:22px;font-weight:700;color:#fbbf24">${p.matches}</div><div style="font-size:10px;color:#94a3b8">${t('matches')}</div></div>
        <div style="background:rgba(139,92,246,.15);border-radius:8px;padding:8px;text-align:center"><div style="font-size:22px;font-weight:700;color:#8b5cf6">${p.age}</div><div style="font-size:10px;color:#94a3b8">${t('age')}</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:rgba(30,41,59,.6);border-radius:8px;padding:10px"><div style="font-size:10px;color:#94a3b8">${t('value')}</div><div style="font-size:14px;font-weight:700;color:#22c55e">${fmt(p.value)}</div></div>
        <div style="background:rgba(30,41,59,.6);border-radius:8px;padding:10px"><div style="font-size:10px;color:#94a3b8">${t('wage')}</div><div style="font-size:14px;font-weight:700;color:#fbbf24">${fmt(p.wage)}/w</div></div>
      </div>

      <button onclick="tab='home';selPlayer=null;render()" class="btn btn-p" style="width:100%">← ${t('back')}</button>
    </div>
    <div id="${voxelId}" data-player='${JSON.stringify(p).replace(/'/g,"&apos;")}'></div>
  `;
}

function renderTeam(){
  const sorted=[...G.team].sort((a,b)=>b.ovr-a.ovr);
  const filters=[['all','全部'],['GK','门将'],['DEF','后卫'],['MID','中场'],['ATT','前锋']];
  const filtered=sorted.filter(p=>filterPos==='all'||(filterPos==='GK'&&p.position==='GK')||(filterPos==='DEF'&&['CB','LB','RB'].includes(p.position))||(filterPos==='MID'&&['CDM','CM','CAM','LW','RW'].includes(p.position))||(filterPos==='ATT'&&p.position==='ST'));
  return `
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px">
      ${filters.map(([k,l])=>`<button onclick="filterPos='${k}';render()" class="btn ${filterPos===k?'btn-g':'btn-p'}" style="white-space:nowrap;font-size:11px;padding:7px 12px">${l}</button>`).join('')}
    </div>
    ${filtered.map(p=>{
      const av=getAvatar(p);
      return `<div class="pcard" onclick="selPlayer=${JSON.stringify(p).replace(/"/g,'&quot;')};tab='playerDetail';render()" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:10px">
            <img src="${av}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,212,255,.4)">
            <div>
              <div style="font-weight:700">${p.name}</div>
              <div style="font-size:11px;color:#94a3b8">${p.age}岁 · ${p.region}</div>
            </div>
          </div>
          <div class="gt" style="font-size:28px;font-weight:700;color:${p.ovr>=75?'#00d4ff':p.ovr>=65?'#22c55e':'#94a3b8'}">${p.ovr}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;margin-bottom:8px">
          ${[['速',p.pace,'#00d4ff'],['射',p.shooting,'#ef4444'],['传',p.passing,'#fbbf24'],['防',p.defending,'#22c55e'],['体',p.physical,'#8b5cf6']].map(([l,v,c])=>`<div style="background:rgba(30,41,59,.6);border-radius:6px;padding:4px"><div style="font-size:9px;color:#94a3b8">${l}</div><div style="font-size:13px;font-weight:700;color:${c}">${v}</div></div>`).join('')}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div style="background:rgba(30,41,59,.4);border-radius:6px;padding:4px"><div style="font-size:9px;color:#94a3b8">⚡体能</div><div class="sbar" style="margin-top:3px"><div class="sfill" style="width:${p.fitness}%;background:${p.fitness>=70?'#22c55e':p.fitness>=40?'#fbbf24':'#ef4444'}"></div></div></div>
          <div style="background:rgba(30,41,59,.4);border-radius:6px;padding:4px"><div style="font-size:9px;color:#94a3b8">😊士气</div><div class="sbar" style="margin-top:3px"><div class="sfill" style="width:${p.morale}%;background:${p.morale>=70?'#22c55e':p.morale>=40?'#fbbf24':'#ef4444'}"></div></div></div>
        </div>
      </div>`;
    }).join('')}
  `;
}

function renderTactics(){
  const fms=['4-4-2','4-3-3','4-2-3-1','3-5-2'];
  const tcs=['attack','balance','defend'];
  return `
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">⚙️ ${t('formation')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${fms.map(f=>`<button onclick="G.formation='${f}';save();render()" style="padding:12px;border-radius:10px;text-align:center;border:2px solid ${G.formation===f?'#00d4ff':'rgba(100,116,139,.4)'};background:${G.formation===f?'rgba(0,212,255,.15)':'rgba(30,41,59,.6)'};cursor:pointer;color:#fff"><div class="gt" style="font-size:18px;font-weight:700">${f}</div></button>`).join('')}
      </div>
    </div>
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">🎯 ${t('style')}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${tcs.map(k=>`<button onclick="G.tactic='${k}';save();render()" style="padding:12px;border-radius:10px;text-align:center;border:2px solid ${G.tactic===k?'#00d4ff':'rgba(100,116,139,.4)'};background:${G.tactic===k?'rgba(0,212,255,.15)':'rgba(30,41,59,.6)'};cursor:pointer;color:#fff"><div style="font-size:22px;margin-bottom:4px">${k==='attack'?'⚔️':k==='balance'?'⚖️':'🛡️'}</div><div style="font-size:12px;font-weight:600">${t(k)}</div></button>`).join('')}
      </div>
    </div>
    <div class="card" style="padding:12px">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px">📋 ${t('currentSquad')}</div>
      ${G.team.slice(0,11).map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;background:rgba(30,41,59,.5);padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:12px"><span>${p.name}</span><span style="color:#00d4ff;font-weight:700">${p.position}</span><span style="color:#fbbf24">${p.ovr}</span></div>`).join('')}
    </div>
  `;
}

function renderFacility(){
  const facs=[{k:'training',n:'训练场',ic:'🏋️'},{k:'academy',n:'青训营',ic:'🌟'},{k:'stadium',n:'体育场',ic:'🏟️'}];
  const costs=[50000,100000,200000,400000,800000,1600000,3200000,6400000,12800000];
  return facs.map(f=>{
    const lv=G.facilities[f.k];
    const cost=costs[Math.min(lv-1,8)];
    const can=G.budget>=cost&&lv<10;
    return `<div class="card" style="padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:28px">${f.ic}</span><div style="font-weight:700;font-size:15px">${f.n}</div></div>
        <div class="gt" style="font-size:24px;font-weight:700;color:#00d4ff">Lv.${lv}</div>
      </div>
      <div style="display:flex;gap:3px;margin-bottom:10px">${Array.from({length:10}).map((_,i)=>`<div style="height:6px;flex:1;border-radius:3px;background:${i<lv?'#00d4ff':'rgba(100,116,139,.4)'}"></div>`).join('')}</div>
      <button onclick="upgFac('${f.k}')" class="btn ${can?'btn-g':'btn-p'}" style="width:100%;font-size:12px" ${!can?'disabled':''}>${lv>=10?'MAX ✅':`⬆️ ${t('upgrade')} (${fmt(cost)})`}</button>
    </div>`;
  }).join('');
}

function renderMatch(){
  if(!MS){
    const opp=G.league[rand(1,G.league.length-1)];
    return `
      <div class="card" style="padding:24px;margin-bottom:12px;text-align:center">
        <div style="font-size:16px;font-weight:700;margin-bottom:20px">⚽ 下一场比赛</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:20px">
          <div style="text-align:center"><div style="font-size:28px;margin-bottom:6px">🔵</div><div style="font-weight:700">FC联</div></div>
          <div class="gt" style="font-size:28px;font-weight:700;color:#475569">${t('vs')}</div>
          <div style="text-align:center"><div style="font-size:28px;margin-bottom:6px">🔴</div><div style="font-weight:700">${getLN(opp.index)}</div></div>
        </div>
      </div>
      <button onclick="startMatch()" class="btn btn-g" style="width:100%;font-size:18px;padding:18px">⚽ ${t('play')}</button>
    `;
  }
  return `
    <div class="card" style="padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="text-align:center"><div style="font-size:11px;color:#94a3b8">FC联</div><div class="gt" style="font-size:40px;font-weight:700;color:#00d4ff" id="scr-my">${MS.myScore}</div></div>
        <div style="text-align:center"><div class="pulse" style="font-size:11px;color:#ef4444;font-weight:700">${t('live')}</div><div class="gt" style="font-size:22px;font-weight:700" id="scr-min">0'</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:#94a3b8">${MS.oppName}</div><div class="gt" style="font-size:40px;font-weight:700;color:#ef4444" id="scr-opp">${MS.oppScore}</div></div>
      </div>
    </div>
    <div style="margin-bottom:10px">
      <canvas id="mc" width="480" height="270" style="width:100%;height:auto;display:block"></canvas>
    </div>
    <div class="card" style="padding:12px;max-height:180px;overflow-y:auto">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">📋 事件</div>
      <div id="evts">${evtHTML()}</div>
    </div>
    ${MS.finished?`<div style="text-align:center;margin-top:16px"><div style="font-size:24px;font-weight:700;margin-bottom:12px;color:${MS.myScore>MS.oppScore?'#22c55e':MS.myScore===MS.oppScore?'#fbbf24':'#ef4444'}">${MS.myScore>MS.oppScore?'🎉 '+t('win'):MS.myScore===MS.oppScore?'🤝 '+t('draw'):'😢 '+t('lose')}</div><button onclick="tab='home';MS=null;render()" class="btn btn-g">${t('back')}</button></div>`:''}
  `;
}

// ---- Actions ----
function upgFac(k){
  const costs=[50000,100000,200000,400000,800000,1600000,3200000,6400000,12800000];
  const cost=costs[Math.min(G.facilities[k]-1,8)];
  if(G.budget>=cost&&G.facilities[k]<10){G.budget-=cost;G.facilities[k]++;addNews(`🔧 ${k}升级到Lv.${G.facilities[k]}!`);showToast(t('upgraded'));save()}
  else showToast(t('noMoney'));
}
function signP(id){
  const p=G.prospects.find(x=>x.id===id);
  if(p&&G.budget>=p.value*.3){G.budget-=Math.floor(p.value*.3);G.team.push(p);G.prospects=G.prospects.filter(x=>x.id!==id);addNews(`✅ 签约${p.name}!`);showToast(t('signed'));save()}
  else showToast(t('noMoney'));
}
function rejectP(id){G.prospects=G.prospects.filter(x=>x.id!==id);render()}

// ---- Boot ----
initGame();
refreshMarket();
scoutAcademy();
render();
</script>
</body>
</html>
