<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root {
            --gold: #ffd700;
            --cyan: #00d4ff;
            --purple: #9333ea;
            --green: #22c55e;
            --red: #ef4444;
        }
        body { 
            margin: 0; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            color: #fff;
            overflow-x: hidden;
        }
        .game-title { font-family: 'Orbitron', sans-serif; }
        
        #matchCanvas {
            border-radius: 12px;
            background: #1a5d1a;
        }
        
        .event-item {
            animation: slideIn 0.3s ease-out;
            border-left: 3px solid;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        .event-goal { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .event-shot { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
        .event-foul { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .event-card { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
        .event-sub { border-color: #8b5cf6; background: rgba(139,92,246,0.1); }
        .event-pass { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        
        .card {
            background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        
        .btn-game {
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,212,255,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-game:active { transform: scale(0.95); }
        .btn-game.gold {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
        }
        .btn-game.green { background: linear-gradient(135deg, var(--green), #16a34a); }
        .btn-game.red { background: linear-gradient(135deg, var(--red), #dc2626); }
        .btn-game.purple { background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; }
        
        .lang-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--cyan);
            color: #000;
            border-color: var(--cyan);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 12px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active { color: var(--cyan); }
        .nav-btn .icon { font-size: 18px; }
        .nav-btn .text { font-size: 9px; margin-top: 2px; }
        
        .stat-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.95));
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(34,197,94,0.4);
        }
        
        .standings-row {
            display: grid;
            grid-template-columns: 30px 1fr 40px 50px;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            align-items: center;
            font-size: 13px;
        }
        .standings-row.me { background: linear-gradient(90deg, rgba(0,212,255,0.3), transparent) !important; border: 1px solid rgba(0,212,255,0.5); }
        
        .player-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px;
            padding: 12px;
            position: relative;
        }
        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--cyan), var(--gold));
        }
        
        .pos-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

    function fmt(n) {
        if (n >= 1000000) return '€' + (n / 1000000).toFixed(1) + 'M';

        return '€' + n;

    // ==================== Player Creation ====================
    function createPlayer(region, position, quality = 60) {
        const age = rand(17, 35);
        const names = PLAYER_NAMES[region] || PLAYER_NAMES['England'];
        const name = names[rand(0, names.length - 1)];
        
        const posBonus = {
            GK: { pace: -20, shooting: -25, defending: 20, passing: 5 },
            CB: { pace: -5, shooting: -15, defending: 25, physical: 20 },
            LB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            RB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            CDM: { pace: 0, shooting: -5, defending: 15, passing: 15 },
            CM: { pace: 5, shooting: 10, defending: 5, passing: 18 },
            CAM: { pace: 10, shooting: 18, defending: -5, passing: 15 },
            LW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            RW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            ST: { pace: 12, shooting: 25, defending: -15, physical: 15 }
        };
        const b = posBonus[position] || {};
        const potential = Math.min(99, quality + rand(5, 22));
        const baseOvr = Math.max(30, Math.min(99, quality + rand(-8, 8)));
        const baseValue = Math.floor(baseOvr * 8000 * (age < 22 ? 1.6 : age < 26 ? 1.2 : age < 30 ? 0.8 : 0.35));
        
        return {
            id: uid(),
            name,
            region,
            position,
            age,
            ovr: baseOvr,
            pace: Math.max(30, Math.min(99, rand(50, 85) + (b.pace || 0))),
            shooting: Math.max(30, Math.min(99, rand(40, 80) + (b.shooting || 0))),
            passing: Math.max(30, Math.min(99, rand(45, 85) + (b.passing || 0))),
            defending: Math.max(30, Math.min(99, rand(40, 80) + (b.defending || 0))),
            physical: Math.max(30, Math.min(99, rand(50, 85) + (b.physical || 0))),
            potential,
            fitness: rand(75, 100),
            morale: rand(60, 100),
            value: Math.floor(baseValue * rand(80, 120) / 100),
            wage: Math.floor(baseOvr * 80 * rand(80, 120) / 100),
            goals: 0, assists: 0, matches: 0,
            avatar: null,
            isGK: position === 'GK'
        };
    }

    // ==================== Game Init ====================

        const saved = localStorage.getItem('football_v5_save');
        if (saved) {
            try {
                game = JSON.parse(saved);
                return;
            } catch(e) {}
        }
        
        game = {
            budget: 5000000,
            team: [],
            league: [],
            facilities: { training: 1, academy: 1, stadium: 1 },
            season: 1, week: 1, day: 0,
            formation: '4-4-2', tactic: 'balance',
            market: [], prospects: [], news: []
        };
        
        const positions = ['GK','CB','CB','CB','LB','RB','CDM','CM','CM','CAM','LW','RW','ST','ST','CM','CDM','CB','LB','RB','GK','CM','ST'];
        const regions = ['England','Spain','Brazil','Germany','France','Italy','Argentina','Portugal','Nigeria','Japan','Korea','China','USA','Mexico','England','Spain','Brazil','Germany','France','Italy','Argentina','Portugal'];
        
        for (let i = 0; i < 22; i++) {
            game.team.push(createPlayer(regions[i], positions[i], rand(58, 72)));
        }
        
        const teamNames = {
            en: ['FC United', 'Athletic Club', 'Dragon FC', 'Lion SC', 'Red Stars', 'Blue Moon', 'Green FC', 'Phoenix FC', 'Silver Eagles', 'Golden Snakes', 'Violets', 'Panthers'],
            zh: ['FC联', '竞技俱乐部', '龙之队', '雄狮FC', '红星队', '蓝月亮', '绿茵FC', '凤凰FC', '银鹰SC', '金蛇队', '紫百合', '黑豹FC']
        };
        
        game.league = teamNames.en.map((name, i) => ({
            name, index: i, strength: rand(40, 88),
            played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, pts: 0
        }));
        game.leagueNames = teamNames;
    }

    function save() {
        localStorage.setItem('football_v5_save', JSON.stringify(game));
    }

    function getLeagueName(i) {
        return LANG === 'zh' ? game.leagueNames.zh[i] : game.leagueNames.en[i];
    }

        const q = 55 + game.facilities.academy * 3;
        game.market = [];
        const regions = ['England', 'Spain', 'Brazil', 'Germany', 'France', 'Italy', 'Argentina', 'Portugal'];
        for (let i = 0; i < 6; i++) {
            const p = createPlayer(regions[rand(0, regions.length - 1)], ['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST'][rand(0, 9)], rand(q - 10, q + 15));
            p.askPrice = Math.floor(p.value * rand(75, 125) / 100);
            game.market.push(p);
        }
        save();
    }

    function scoutAcademy() {
        const count = 2 + Math.floor(game.facilities.academy / 2);
        const q = 42 + game.facilities.academy * 4;
        game.prospects = [];
        for (let i = 0; i < Math.min(count, 4); i++) {
            game.prospects.push(createPlayer('China', ['GK','CB','CM','ST'][rand(0, 3)], rand(q - 12, q + 12)));
        }
        addNews(`🌟 Academy found ${game.prospects.length} talents!`);
    }

    function trainTeam() {
        const bonus = 1 + game.facilities.training * 0.18;
        game.team.forEach(p => {
            if (p.age < 29 && p.ovr < p.potential) {
                const gain = Math.floor(rand(0, 2) * bonus);
                if (gain > 0) {
                    p.ovr = Math.min(p.potential, p.ovr + gain);
                    if (rand(1, 100) <= 25) {
                        const stats = ['pace', 'shooting', 'passing', 'defending', 'physical'];
                        p[stats[rand(0, 4)]] = Math.min(99, p[stats[rand(0, 4)]] + 1);
                    }
                }
            }
            p.fitness = Math.min(100, p.fitness + rand(8, 18));
        });
        addNews(t('trained'));
        save();
    }

    function addNews(text) {
        game.news.unshift({ text, time: Date.now() });
        if (game.news.length > 20) game.news = game.news.slice(0, 20);
    }

    // ==================== Match Simulation ====================
    // ==================== Formation Positions ====================
    const TACTICS = {
        attack: { att: 15, def: -10 },
        balance: { att: 0, def: 0 },
        defend: { att: -10, def: 15 }
    };

    const FORMATION_POSITIONS = {
        '4-4-2': [
            { x: 0.1, y: 0.5 },   // GK
            { x: 0.25, y: 0.2 }, { x: 0.25, y: 0.5 }, { x: 0.25, y: 0.8 }, // CB
            { x: 0.2, y: 0.15 }, { x: 0.2, y: 0.85 }, // LB RB
            { x: 0.4, y: 0.25 }, { x: 0.4, y: 0.5 }, { x: 0.4, y: 0.75 }, // CM
            { x: 0.5, y: 0.35 }, { x: 0.5, y: 0.65 }  // ST
        ],
        '4-3-3': [
            { x: 0.1, y: 0.5 },   // GK
            { x: 0.25, y: 0.15 }, { x: 0.25, y: 0.4 }, { x: 0.25, y: 0.6 }, { x: 0.25, y: 0.85 }, // CB LB RB
            { x: 0.4, y: 0.3 }, { x: 0.4, y: 0.5 }, { x: 0.4, y: 0.7 }, // CDM CM
            { x: 0.5, y: 0.2 }, { x: 0.5, y: 0.5 }, { x: 0.5, y: 0.8 }  // LW ST RW
        ],
        '4-2-3-1': [
            { x: 0.1, y: 0.5 },   // GK
            { x: 0.25, y: 0.15 }, { x: 0.25, y: 0.4 }, { x: 0.25, y: 0.6 }, { x: 0.25, y: 0.85 }, // CB LB RB
            { x: 0.35, y: 0.35 }, { x: 0.35, y: 0.65 }, // CDM
            { x: 0.45, y: 0.25 }, { x: 0.45, y: 0.5 }, { x: 0.45, y: 0.75 }, // CAM
            { x: 0.55, y: 0.5 }   // ST
        ],
        '3-5-2': [
            { x: 0.1, y: 0.5 },   // GK
            { x: 0.25, y: 0.25 }, { x: 0.25, y: 0.5 }, { x: 0.25, y: 0.75 }, // CB
            { x: 0.35, y: 0.1 }, { x: 0.35, y: 0.9 }, // LWB RWB
            { x: 0.4, y: 0.3 }, { x: 0.4, y: 0.5 }, { x: 0.4, y: 0.7 }, // CM
            { x: 0.5, y: 0.35 }, { x: 0.5, y: 0.65 }  // ST
        ]
    };

    function getFormationPositions(formation, isOpponent = false) {
        const positions = FORMATION_POSITIONS[formation] || FORMATION_POSITIONS['4-4-2'];
        if (isOpponent) {
            return positions.map(p => ({ x: 1 - p.x, y: p.y }));
        }
        return positions;
    }

    function startMatch() {
        currentTab = 'match';
        render();
        
        const formationPos = getFormationPositions(game.formation, false);
        const myTeam = game.team.slice(0, 11).map((p, i) => {
            const pos = formationPos[i] || { x: 0.3, y: 0.5 };
            return {
                ...p,
                x: pos.x,
                y: pos.y,
                targetX: pos.x,
                targetY: pos.y,
                homeX: pos.x,
                homeY: pos.y,
                vx: 0, vy: 0,
                speed: 0.02 + (p.pace / 100) * 0.03
            };
        });
        
        const oppIdx = rand(1, game.league.length - 1);
        const oppStrength = game.league[oppIdx].strength;
        const oppRegion = ['England', 'Spain', 'Brazil', 'Germany', 'France'][rand(0, 4)];
        const oppTeam = [];
        const oppPositions = ['GK','CB','CB','LB','RB','CDM','CM','CM','LW','ST','RW'];
        
        const oppFormationPos = getFormationPositions('4-3-3', true);
        for (let i = 0; i < 11; i++) {
            const p = createPlayer(oppRegion, oppPositions[i], oppStrength);
            const pos = oppFormationPos[i] || { x: 0.7, y: 0.5 };
            p.x = pos.x;
            p.y = pos.y;
            p.targetX = pos.x;
            p.targetY = pos.y;
            p.homeX = pos.x;
            p.homeY = pos.y;
            p.vx = 0;
            p.vy = 0;
            p.speed = 0.02 + (p.pace / 100) * 0.03;
            oppTeam.push(p);
        }
        
        matchState = {
            myTeam,
            oppTeam,
            oppName: getLeagueName(oppIdx),
            myScore: 0,
            oppScore: 0,
            minute: 0,
            second: 0,
            events: [],
            ball: { x: 0.5, y: 0.5, vx: 0, vy: 0, owner: null, lastOwner: null },
            possession: 'my',
            phase: 'kickoff',
            nextEventMinute: rand(2, 5),
            started: false,
            finished: false,
            halftime: false,
            yellowCards: { my: [], opp: [] },
            substitutions: { my: [], opp: [] },
            passChain: 0
        };
        
        addNews(`⚽ Match started: FC United vs ${matchState.oppName}`);
        
        setTimeout(() => {
            matchState.started = true;
            startMatchAnimation();
        }, 1000);
    }

    function startMatchAnimation() {
        if (!matchState || matchState.finished) return;
        
        const canvas = document.getElementById('matchCanvas');
        if (!canvas) return;
        
        matchCanvas = canvas;
        matchCtx = canvas.getContext('2d');
        
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        matchCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        function gameLoop() {
            if (!matchState || !matchState.started) return;
            
            updateMatch();
            renderMatch();
            
            if (!matchState.finished) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }
        
        animationId = requestAnimationFrame(gameLoop);
    }

    function updateMatch() {
        if (!matchState || !matchState.started || matchState.finished) return;
        
        matchState.second += 1.5;
        if (matchState.second >= 60) {
            matchState.second = 0;
            matchState.minute++;
            
            if (matchState.minute === 45 && !matchState.halftime) {
                matchState.halftime = true;
                matchState.phase = 'halftime';
                addMatchEvent('⏱️ HALF TIME', 'info');
            }
            
            if (matchState.minute >= 90) {
                endMatch();
                return;
            }
        }
        
        moveBall();
        movePlayers();
        
        // Generate events less frequently
        if (matchState.minute % 5 === 0 && matchState.second < 2 && !matchState.halftime) {
            generateMatchEvent();
        }
    }

    function moveBall() {
        const ball = matchState.ball;
        
        if (ball.owner) {
            // Ball follows owner smoothly
            const dx = ball.owner.x - ball.x;
            const dy = ball.owner.y - ball.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0.02) {
                ball.x += (dx / dist) * 0.04;
                ball.y += (dy / dist) * 0.04;
            } else {
                ball.x = ball.owner.x;
                ball.y = ball.owner.y;
            }
        } else {
            // Ball rolls freely
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.96;
            ball.vy *= 0.96;
            
            // Bounce off walls
            if (ball.x < 0.02) { ball.x = 0.02; ball.vx *= -0.5; }
            if (ball.x > 0.98) { ball.x = 0.98; ball.vx *= -0.5; }
            if (ball.y < 0.02) { ball.y = 0.02; ball.vy *= -0.5; }
            if (ball.y > 0.98) { ball.y = 0.98; ball.vy *= -0.5; }
            
            // Try to intercept
            if (Math.random() < 0.015) {
                const defenders = matchState.possession === 'my' ? matchState.oppTeam : matchState.myTeam;
                const closest = defenders.reduce((best, p) => {
                    const dist = Math.hypot(p.x - ball.x, p.y - ball.y);
                    return dist < best.dist ? { p, dist } : best;
                }, { p: null, dist: Infinity });
                
                if (closest.dist < 0.1) {
                    ball.owner = closest.p;
                    ball.lastOwner = closest.p;
                    matchState.possession = matchState.possession === 'my' ? 'opp' : 'my';
                    matchState.passChain = 0;
                }
            }
        }
    }

    function movePlayers() {
        const ball = matchState.ball;
        const tactics = TACTICS[game.tactic] || { att: 0, def: 0 };
        
        // Move my team
        matchState.myTeam.forEach((p, i) => {
            let targetX = p.homeX;
            let targetY = p.homeY;
            
            if (matchState.possession === 'my') {
                // Attacking - spread out, move forward
                if (ball.owner && matchState.myTeam.includes(ball.owner)) {
                    // Support ball carrier
                    const dx = ball.owner.x - p.x;
                    const dy = ball.owner.y - p.y;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > 0.15 && dist < 0.4) {
                        // Move to support position
                        targetX = p.homeX + 0.1;
                        targetY = p.homeY + (Math.random() - 0.5) * 0.1;
                    } else {
                        // Move forward
                        targetX = Math.min(0.55, p.homeX + 0.08);
                        targetY = p.homeY + (Math.random() - 0.5) * 0.05;
                    }
                } else {
                    targetX = p.homeX;
                    targetY = p.homeY;
                }
            } else {
                // Defending - mark opponents, stay compact
                const oppWithBall = matchState.oppTeam.find(op => op === ball.owner);
                if (oppWithBall) {
                    // Mark nearest opponent
                    const closest = matchState.oppTeam.reduce((best, op) => {
                        const dist = Math.hypot(op.x - p.x, op.y - p.y);
                        return dist < best.dist ? { op, dist } : best;
                    }, { op: null, dist: Infinity });
                    
                    if (closest.dist < 0.2) {
                        targetX = closest.op.x - 0.05;
                        targetY = closest.op.y;
                    } else {
                        targetX = p.homeX - 0.05;
                        targetY = p.homeY;
                    }
                } else {
                    targetX = p.homeX - 0.05;
                    targetY = p.homeY;
                }
            }
            
            // Smooth movement
            const dx = targetX - p.x;
            const dy = targetY - p.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0.01) {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }
            
            // Keep in bounds
            p.x = Math.max(0.05, Math.min(0.5, p.x));
            p.y = Math.max(0.02, Math.min(0.98, p.y));
        });
        
        // Move opponent team
        matchState.oppTeam.forEach((p, i) => {
            let targetX = p.homeX;
            let targetY = p.homeY;
            
            if (matchState.possession === 'opp') {
                // Attacking
                if (ball.owner && matchState.oppTeam.includes(ball.owner)) {
                    const dx = ball.owner.x - p.x;
                    const dy = ball.owner.y - p.y;
                    const dist = Math.hypot(dx, dy);
                    
                    if (dist > 0.15 && dist < 0.4) {
                        targetX = p.homeX - 0.1;
                        targetY = p.homeY + (Math.random() - 0.5) * 0.1;
                    } else {
                        targetX = Math.max(0.45, p.homeX - 0.08);
                        targetY = p.homeY + (Math.random() - 0.5) * 0.05;
                    }
                } else {
                    targetX = p.homeX;
                    targetY = p.homeY;
                }
            } else {
                // Defending
                const closest = matchState.myTeam.reduce((best, my) => {
                    const dist = Math.hypot(my.x - p.x, my.y - p.y);
                    return dist < best.dist ? { my, dist } : best;
                }, { my: null, dist: Infinity });
                
                if (closest.dist < 0.2) {
                    targetX = closest.my.x + 0.05;
                    targetY = closest.my.y;
                } else {
                    targetX = p.homeX + 0.05;
                    targetY = p.homeY;
                }
            }
            
            const dx = targetX - p.x;
            const dy = targetY - p.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 0.01) {
                p.x += (dx / dist) * p.speed;
                p.y += (dy / dist) * p.speed;
            }
            
            p.x = Math.max(0.5, Math.min(0.95, p.x));
            p.y = Math.max(0.02, Math.min(0.98, p.y));
        });
    }

    function generateMatchEvent() {
        if (!matchState || matchState.finished || matchState.halftime) return;
        
        const myAttack = matchState.possession === 'my';
        const attackers = myAttack ? matchState.myTeam : matchState.oppTeam;
        
        // Decide action type
        const eventType = rand(1, 100);
        
        if (eventType <= 20 && matchState.passChain > 2) {
            // Shot attempt
            const shooters = attackers.filter(p => ['ST', 'LW', 'RW', 'CAM'].includes(p.position));
            const shooter = shooters[rand(0, shooters.length - 1)] || attackers[rand(0, 5)];
            
            const shotQuality = (shooter.shooting + shooter.pace) / 2;
            const gk = myAttack ? matchState.oppTeam[0] : matchState.myTeam[0];
            const saveChance = (gk.defending + 40) / 2;
            
            matchState.ball.owner = null;
            matchState.ball.vx = (Math.random() - 0.5) * 0.3;
            matchState.ball.vy = (Math.random() - 0.5) * 0.3;
            
            if (shotQuality > saveChance + 15) {
                if (myAttack) {
                    matchState.myScore++;
                    shooter.goals++;
                } else {
                    matchState.oppScore++;
                }
                addMatchEvent(`⚽ ${shooter.name.split(' ')[0]} SCORES! ${matchState.myScore} - ${matchState.oppScore}`, 'goal');
            } else if (shotQuality > saveChance - 5) {
                addMatchEvent(`🧤 ${shooter.name.split(' ')[0]} - Saved!`, 'shot');
            } else {
                addMatchEvent(`❌ ${shooter.name.split(' ')[0]} - Missed!`, 'shot');
            }
            
            matchState.passChain = 0;
        } else if (eventType <= 35) {
            // Pass
            const passer = attackers[rand(0, Math.min(7, attackers.length - 1))];
            const receivers = attackers.filter(p => p.id !== passer.id);
            const receiver = receivers[rand(0, receivers.length - 1)];
            
            if (passer && receiver) {
                matchState.ball.owner = receiver;
                matchState.ball.x = receiver.x;
                matchState.ball.y = receiver.y;
                matchState.passChain++;
                addMatchEvent(`👟 ${passer.name.split(' ')[0]} → ${receiver.name.split(' ')[0]}`, 'pass');
            }
        } else if (eventType <= 45) {
            // Foul/Tackle
            const fouler = attackers[rand(0, attackers.length - 1)];
            const defenders = myAttack ? matchState.oppTeam : matchState.myTeam;
            const fouled = defenders[rand(0, defenders.length - 1)];
            
            if (rand(1, 100) <= 20) {
                const team = myAttack ? 'my' : 'opp';
                if (!matchState.yellowCards[team].includes(fouler.id)) {
                    matchState.yellowCards[team].push(fouler.id);
                    addMatchEvent(`🟨 Yellow Card: ${fouler.name.split(' ')[0]}`, 'card');
                } else {
                    addMatchEvent(`🟥 RED CARD: ${fouler.name.split(' ')[0]}`, 'card');
                }
            } else {
                addMatchEvent(`⚠️ Foul by ${fouler.name.split(' ')[0]}`, 'foul');
            }
            
            matchState.possession = matchState.possession === 'my' ? 'opp' : 'my';
            matchState.passChain = 0;
        } else if (eventType <= 55) {
            // Interception
            const defenders = myAttack ? matchState.oppTeam : matchState.myTeam;
            const interceptor = defenders[rand(0, defenders.length - 1)];
            
            matchState.ball.owner = interceptor;
            matchState.ball.x = interceptor.x;
            matchState.ball.y = interceptor.y;
            matchState.possession = matchState.possession === 'my' ? 'opp' : 'my';
            matchState.passChain = 0;
            addMatchEvent(`🔄 ${interceptor.name.split(' ')[0]} - Interception!`, 'pass');
        }
    }

    function addMatchEvent(text, type) {
        if (!matchState) return;
        matchState.events.unshift({ text, type, time: `${matchState.minute}'` });
        if (matchState.events.length > 15) matchState.events.pop();
        renderMatchUI();
    }

    function endMatch() {
        if (!matchState) return;
        matchState.finished = true;
        matchState.phase = 'fulltime';
        
        if (animationId) {
            cancelAnimationFrame(animationId);
        }
        
        const myLeague = game.league.find(l => l.name === 'FC United');
        const oppLeague = game.league.find(l => l.name === matchState.oppName);
        
        myLeague.played++; oppLeague.played++;
        myLeague.gf += matchState.myScore; myLeague.ga += matchState.oppScore;
        oppLeague.gf += matchState.oppScore; oppLeague.ga += matchState.myScore;
        
        if (matchState.myScore > matchState.oppScore) {
            myLeague.won++; myLeague.pts += 3; oppLeague.lost++;
        } else if (matchState.myScore === matchState.oppScore) {
            myLeague.drawn++; myLeague.pts += 1; oppLeague.drawn++; oppLeague.pts += 1;
        } else {
            myLeague.lost++; oppLeague.won++; oppLeague.pts += 3;
        }
        
        const income = 120000 * game.facilities.stadium;
        game.budget += income;
        
        game.team.slice(0, 11).forEach(p => {
            p.matches++;
            p.fitness = Math.max(45, p.fitness - rand(10, 20));
            p.morale = Math.min(100, p.morale + (matchState.myScore > matchState.oppScore ? 6 : -4));
            if (Math.random() < 0.12) p.assists++;
        });
        
        game.week++;
        const resultText = matchState.myScore > matchState.oppScore ? '🎉 WIN!' : matchState.myScore === matchState.oppScore ? '🤝 DRAW!' : '😢 LOSS...';
        addNews(`${resultText} FC United ${matchState.myScore}-${matchState.oppScore} ${matchState.oppName}`);
        
        if (game.week > 38) {
            game.season++;
            game.week = 1;
            game.league.sort((a, b) => b.pts - a.pts);
            const pos = game.league.findIndex(l => l.name === 'FC United') + 1;
            addNews(`🏆 Season ${game.season - 1} ended! Rank #${pos}`);
            game.league.forEach(l => {
                if (l.name !== 'FC United') l.strength = Math.max(35, Math.min(95, l.strength + rand(-6, 6)));
                l.played = l.won = l.drawn = l.lost = l.gf = l.ga = l.pts = 0;
            });
            game.budget += 2500000;
        }
        
        save();
        renderMatchUI();
    }

                        <div class="text-xs text-slate-400">${t('gd')}</div>
                    </div>
                    <div class="bg-slate-800/50 rounded-lg p-2">
                        <div class="text-amber-400 font-bold text-lg game-title">${myLeague.pts}</div>
                        <div class="text-xs text-slate-400">${t('pts')}</div>
                    </div>
                </div>
            </div>
            
            <div class="card p-3 mb-3">
                <button onclick="startMatch()" class="btn-game gold w-full text-sm mb-2">⚽ ${t('play')}</button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="trainTeam();render()" class="btn-game text-xs">🏋️ ${t('train')}</button>
                    <button onclick="refreshMarket();render()" class="btn-game purple text-xs">🔄 ${t('refresh')}</button>
                </div>
            </div>
            
            ${game.news.length > 0 ? `
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-2 flex items-center gap-1">📰 News</h3>
                <div class="space-y-1 max-h-32 overflow-y-auto">
                    ${game.news.slice(0, 5).map(n => `<div class="text-xs bg-slate-800/60 p-2 rounded-lg">${n.text}</div>`).join('')}
                </div>
            </div>
            ` : ''}
            
            ${game.prospects.length > 0 ? `
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-2">🌟 ${t('academy')} (${game.prospects.length})</h3>
                <div class="space-y-2">
                    ${game.prospects.map(p => `
                        <div class="player-card">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <div class="player-avatar">
                                        <img src="${p.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23667eea%22/%3E%3C/svg%3E'}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23667eea%22/%3E%3C/svg%3E'">
                                    </div>
                                    <div>
                                        <div class="font-bold">${p.name}</div>
                                        <div class="text-xs text-slate-400">${p.age} yrs · ${t('potential')}: ${p.potential}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-bold game-title ${p.ovr>=70?'text-cyan-300':p.ovr>=60?'text-green-400':'text-slate-400'}">${p.ovr}</div>
                                </div>
                            </div>
                            <div class="flex gap-1 mt-2">
                                <button onclick="signProspect('${p.id}')" class="btn-game green flex-1 text-xs">✅ ${t('sign')}</button>
                                <button onclick="rejectProspect('${p.id}')" class="btn-game red flex-1 text-xs">❌ ${t('reject')}</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
            ` : ''}
            
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-2">💰 ${t('market')}</h3>
                <div class="space-y-2 max-h-48 overflow-y-auto">
                    ${game.market.map(p => `
                        <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded-lg cursor-pointer hover:bg-slate-700/50" onclick="buyPlayer('${p.id}')">
                            <div class="flex items-center gap-2">
                                <div class="player-avatar" style="width:36px;height:36px;">
                                    <img src="${p.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23667eea%22/%3E%3C/svg%3E'}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23667eea%22/%3E%3C/svg%3E'">
                                </div>
                                <div>
                                    <div class="font-medium text-sm">${p.name}</div>
                                    <div class="text-xs text-slate-400">${p.age} yrs · ${p.ovr}⭐</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-amber-400 font-bold">${fmt(p.askPrice)}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
            
            <div class="card p-3">
                <h3 class="font-bold text-sm mb-2">📊 ${t('standings')}</h3>
                <div class="standings-row text-xs text-slate-400 font-semibold mb-1">
                    <span>#</span><span>Team</span><span class="text-center">W</span><span class="text-right">${t('pts')}</span>
                </div>
                ${sorted.slice(0, 10).map((s, i) => {
                    const isMe = s.name === 'FC United';
                    return `<div class="standings-row ${isMe?'me':''} ${i<3?'text-green-400':''}">
                        <span class="font-bold">${i+1}</span>
                        <span class="${isMe?'text-cyan-300 font-bold':'text-slate-200'}">${getLeagueName(s.index)}</span>
                        <span class="text-center">${s.won}</span>
                        <span class="text-right font-bold">${s.pts}</span>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    function renderTeam() {
        const sorted = [...game.team].sort((a, b) => b.ovr - a.ovr);
        
        return `
            <div class="mb-3">
                <div class="flex gap-1 mb-3 overflow-x-auto pb-1">
                    <button onclick="filterPos='all';render()" class="btn-game text-xs whitespace-nowrap ${filterPos==='all'?'gold':'purple'}">${t('all')}</button>
                    <button onclick="filterPos='GK';render()" class="btn-game text-xs whitespace-nowrap ${filterPos==='GK'?'gold':'purple'}">🧤 GK</button>
                    <button onclick="filterPos='DEF';render()" class="btn-game text-xs whitespace-nowrap ${filterPos==='DEF'?'gold':'purple'}">🛡️ DEF</button>
                    <button onclick="filterPos='MID';render()" class="btn-game text-xs whitespace-nowrap ${filterPos==='MID'?'gold':'purple'}">⚙️ MID</button>
                    <button onclick="filterPos='ATT';render()" class="btn-game text-xs whitespace-nowrap ${filterPos==='ATT'?'gold':'purple'}">⚔️ ATT</button>
                </div>
            </div>
            
            <div class="space-y-2">
                ${sorted.filter(p => {
                    if (filterPos === 'all') return true;
                    if (filterPos === 'GK') return p.position === 'GK';
                    if (filterPos === 'DEF') return ['CB','LB','RB'].includes(p.position);
                    if (filterPos === 'MID') return ['CDM','CM','CAM','LW','RW'].includes(p.position);
                    if (filterPos === 'ATT') return ['ST','CF'].includes(p.position);
                    return true;
                }).map(p => `
                    <div class="player-card">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="player-avatar">
                                    <img src="${p.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23667eea%22/%3E%3C/svg%3E'}" alt="${p.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23667eea%22/%3E%3C/svg%3E'">
                                </div>
                                <div>
                                    <div class="font-bold">${p.name}</div>
                                    <div class="text-xs text-slate-400">${p.age} yrs · ${p.region}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-bold game-title ${p.ovr>=75?'text-cyan-300':p.ovr>=65?'text-green-400':'text-slate-400'}">${p.ovr}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-5 gap-1 mt-2 text-center">
                            <div><div class="text-xs text-slate-400">${t('pace')}</div><div class="text-sm font-semibold">${p.pace}</div></div>
                            <div><div class="text-xs text-slate-400">${t('shooting')}</div><div class="text-sm font-semibold">${p.shooting}</div></div>
                            <div><div class="text-xs text-slate-400">${t('passing')}</div><div class="text-sm font-semibold">${p.passing}</div></div>
                            <div><div class="text-xs text-slate-400">${t('defending')}</div><div class="text-sm font-semibold">${p.defending}</div></div>
                            <div><div class="text-xs text-slate-400">${t('physical')}</div><div class="text-sm font-semibold">${p.physical}</div></div>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <div class="flex-1 bg-slate-800/50 rounded p-1 text-center"><div class="text-xs text-slate-400">⚡${t('fitness')}</div><div class="stat-bar"><div class="stat-fill ${p.fitness>=70?'bg-green-500':p.fitness>=40?'bg-yellow-500':'bg-red-500'}" style="width:${p.fitness}%"></div></div></div>
                            <div class="flex-1 bg-slate-800/50 rounded p-1 text-center"><div class="text-xs text-slate-400">😊${t('morale')}</div><div class="stat-bar"><div class="stat-fill ${p.morale>=70?'bg-green-500':p.morale>=40?'bg-yellow-500':'bg-red-500'}" style="width:${p.morale}%"></div></div></div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderTactics() {
        const formations = ['4-4-2', '4-3-3', '4-2-3-1', '3-5-2'];
        const tactics = ['attack', 'balance', 'defend'];
        
        return `
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-3">⚙️ ${t('formation')}</h3>
                <div class="grid grid-cols-2 gap-2">
                    ${formations.map(f => `
                        <button onclick="game.formation='${f}';save();render()" class="p-3 rounded-xl text-center ${game.formation===f?'bg-cyan-500/20 border-2 border-cyan-400':'bg-slate-800/50 border border-slate-600'}">
                            <div class="text-xl font-bold game-title">${f}</div>
                        </button>
                    `).join('')}
                </div>
            </div>
            
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-3">🎯 ${t('style')}</h3>
                <div class="grid grid-cols-3 gap-2">
                    ${tactics.map(key => `
                        <button onclick="game.tactic='${key}';save();render()" class="p-3 rounded-xl text-center ${game.tactic===key?'bg-cyan-500/20 border-2 border-cyan-400':'bg-slate-800/50 border border-slate-600'}">
                            <div class="text-2xl mb-1">${key==='attack'?'⚔️':key==='balance'?'⚖️':'🛡️'}</div>
                            <div class="font-bold">${t(key)}</div>
                        </button>
                    `).join('')}
                </div>
            </div>
            
            <div class="card p-3">
                <h3 class="font-bold text-sm mb-3">📋 ${t('currentTeam')}</h3>
                <div class="text-xs text-slate-400 mb-2">${t('formation')}: ${game.formation} · ${t(game.tactic)}</div>
                <div class="space-y-1">
                    ${game.team.slice(0, 11).map(p => `
                        <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded-lg text-sm">
                            <span>${p.name}</span>
                            <span class="text-cyan-400 font-bold">${p.position}</span>
                            <span class="text-amber-400">${p.ovr}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderFacility() {
        const facilities = [
            { key: 'training', name: 'Training Ground', icon: '🏋️' },
            { key: 'academy', name: 'Youth Academy', icon: '🌟' },
            { key: 'stadium', name: 'Stadium', icon: '🏟️' }
        ];
        const costs = [50000, 100000, 200000, 400000, 800000, 1600000, 3200000, 6400000, 12800000];
        
        return `
            <div class="space-y-3">
                ${facilities.map(f => {
                    const level = game.facilities[f.key];
                    const cost = costs[Math.min(level - 1, 8)];
                    const canAfford = game.budget >= cost;
                    return `
                        <div class="card p-4">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">${f.icon}</span>
                                    <div>
                                        <div class="font-bold">${f.name}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-bold game-title text-cyan-300">Lv.${level}</div>
                                </div>
                            </div>
                            <button onclick="upgradeFacility('${f.key}')" class="btn-game w-full text-xs ${canAfford&&level<10?'gold':'purple'}" ${!canAfford||level>=10?'disabled':''}>
                                ${level >= 10 ? 'MAX' : `⬆️ ${t('upgrade')} (${fmt(cost)})`}
                            </button>
                            <div class="flex gap-1 mt-2">
                                ${Array.from({length: 10}).map((_, i) => `<div class="h-2 flex-1 rounded ${i < level ? 'bg-cyan-400' : 'bg-slate-700'}"></div>`).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    function renderMatchTab() {
        if (matchState) {
            return renderMatchView();
        }
        
        const opp = game.league[rand(1, game.league.length - 1)];
        
        return `
            <div class="card p-4 mb-3 text-center">
                <h3 class="font-bold text-lg mb-4">⚽ ${t('nextMatch')}</h3>
                <div class="flex items-center justify-center gap-4">
                    <div class="text-center">
                        <div class="text-2xl mb-1">🔵</div>
                        <div class="font-bold">${getLeagueName(0)}</div>
                    </div>
                    <div class="text-3xl font-bold game-title text-slate-500">${t('vs')}</div>
                    <div class="text-center">
                        <div class="text-2xl mb-1">🔴</div>
                        <div class="font-bold">${getLeagueName(opp.index)}</div>
                    </div>
                </div>
            </div>
            
            <button onclick="startMatch()" class="btn-game gold w-full text-lg py-4">⚽ ${t('playMatch')}</button>
        `;
    }

    function renderMatchView() {
        return `
            <div class="card p-3 mb-3">
                <div class="flex justify-between items-center">
                    <div class="text-center">
                        <div class="text-xs text-slate-400">${getLeagueName(0)}</div>
                        <div class="text-4xl font-bold game-title text-cyan-300">${matchState.myScore}</div>
                    </div>
                    <div class="text-center">
                        <div class="text-xs text-red-400 font-bold animate-pulse">${t('live')}</div>
                        <div class="text-2xl font-bold game-title">${matchState.minute}'</div>
                        <div class="text-xs text-slate-400">${Math.floor(matchState.second / 60 * 100)}%</div>
                    </div>
                    <div class="text-center">
                        <div class="text-xs text-slate-400">${matchState.oppName}</div>
                        <div class="text-4xl font-bold game-title text-red-400">${matchState.oppScore}</div>
                    </div>
                </div>
            </div>
            
            <div class="card p-2 mb-3" style="background:#1a5d1a; border-radius:12px;">
                <canvas id="matchCanvas" width="350" height="200" style="width:100%;height:auto;border-radius:8px;"></canvas>
            </div>
            
            <div class="card p-3" style="max-height:200px;overflow-y:auto;">
                <h4 class="font-bold text-sm mb-2">📋 Events</h4>
                <div id="matchEvents" class="space-y-1">
                    ${matchState.events.map(e => `
                        <div class="event-item ${e.type === 'goal' ? 'event-goal' : e.type === 'card' ? 'event-card' : e.type === 'shot' ? 'event-shot' : e.type === 'foul' ? 'event-foul' : e.type === 'sub' ? 'event-sub' : 'event-pass'} p-2 rounded text-xs">
                            <span class="text-slate-400 mr-2">${e.time}</span>
                            ${e.text}
                        </div>
                    `).join('')}
                </div>
            </div>
            
            ${matchState.finished ? `
                <div class="mt-3 text-center">
                    <div class="text-2xl font-bold mb-2 ${matchState.myScore > matchState.oppScore ? 'text-green-400' : matchState.myScore === matchState.oppScore ? 'text-yellow-400' : 'text-red-400'}">
                        ${matchState.myScore > matchState.oppScore ? '🎉 WIN!' : matchState.myScore === matchState.oppScore ? '🤝 DRAW!' : '😢 LOSS...'}
                    </div>
                    <button onclick="currentTab='home';matchState=null;render()" class="btn-game gold">${t('back')}</button>
                </div>
            ` : ''}
        `;
    }

    function renderMatchUI() {
        const eventsEl = document.getElementById('matchEvents');
        if (eventsEl && matchState) {
            eventsEl.innerHTML = matchState.events.map(e => `
                <div class="event-item ${e.type === 'goal' ? 'event-goal' : e.type === 'card' ? 'event-card' : e.type === 'shot' ? 'event-shot' : e.type === 'foul' ? 'event-foul' : e.type === 'sub' ? 'event-sub' : 'event-pass'} p-2 rounded text-xs">
                    <span class="text-slate-400 mr-2">${e.time}</span>
                    ${e.text}
                </div>
            `).join('');
        }
    }

    function renderMatch() {
        if (!matchCanvas || !matchCtx) return;
        
        const ctx = matchCtx;
        const w = matchCanvas.width / window.devicePixelRatio;
        const h = matchCanvas.height / window.devicePixelRatio;
        
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(0, 0, w, h);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        
        ctx.strokeRect(10, 10, w - 20, h - 20);
        
        ctx.beginPath();
        ctx.moveTo(w / 2, 10);
        ctx.lineTo(w / 2, h - 10);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 30, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.strokeRect(10, h / 2 - 25, 15, 50);
        ctx.strokeRect(w - 25, h / 2 - 25, 15, 50);
        
        ctx.strokeRect(10, h / 4, 30, h / 2);
        ctx.strokeRect(w - 40, h / 4, 30, h / 2);
        
        matchState.myTeam.forEach((p, i) => {
            const x = p.x * w;
            const y = p.y * h;
            
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#00aaff';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '8px Inter';
            ctx.textAlign = 'center';
            const shortName = p.name.split(' ')[0].substring(0, 4);
            ctx.fillText(shortName, x, y + 22);
        });
        
        matchState.oppTeam.forEach((p, i) => {
            const x = p.x * w;
            const y = p.y * h;
            
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4444';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '8px Inter';
            ctx.textAlign = 'center';
            const shortName = p.name.split(' ')[0].substring(0, 4);
            ctx.fillText(shortName, x, y + 22);
        });
        
        const bx = matchState.ball.x * w;
        const by = matchState.ball.y * h;
        ctx.beginPath();
        ctx.arc(bx, by, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(w/2 - 50, 0, 100, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Orbitron, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.myScore} - ${matchState.oppScore}`, w/2, 15);
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(w - 40, 0, 40, 18);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 10px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.minute}'`, w - 20, 13);
    }

    // ==================== Actions ====================
    function upgradeFacility(key) {
        const costs = [50000, 100000, 200000, 400000, 800000, 1600000, 3200000, 6400000, 12800000];
        const cost = costs[Math.min(game.facilities[key] - 1, 8)];
        if (game.budget >= cost && game.facilities[key] < 10) {
            game.budget -= cost;
            game.facilities[key]++;
            addNews(`🔧 ${key} upgraded to Lv.${game.facilities[key]}!`);
            showToast = t('upgraded');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    function signProspect(id) {
        const p = game.prospects.find(x => x.id === id);
        if (p && game.budget >= p.value * 0.3) {
            game.budget -= Math.floor(p.value * 0.3);
            game.team.push(p);
            game.prospects = game.prospects.filter(x => x.id !== id);
            addNews(`✅ Signed ${p.name}!`);
            showToast = t('signed');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    function rejectProspect(id) {
        game.prospects = game.prospects.filter(x => x.id !== id);
        render();
    }

    function buyPlayer(id) {
        const p = game.market.find(x => x.id === id);
        if (p && game.budget >= p.askPrice) {
            game.budget -= p.askPrice;
            game.team.push(p);
            game.market = game.market.filter(x => x.id !== id);
            addNews(`💰 Signed ${p.name}!`);
            showToast = t('signed');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    // ==================== Boot ====================
    async function boot() {
        initGame();
        
        // Generate avatars for all players
        for (let p of game.team) {
            p.avatar = await generatePlayerAvatar(p.name, p.region);
        }
        
        refreshMarket();
        for (let p of game.market) {
            p.avatar = await generatePlayerAvatar(p.name, p.region);
        }
        
        scoutAcademy();
        for (let p of game.prospects) {
            p.avatar = await generatePlayerAvatar(p.name, p.region);
        }
        
        save();
        render();
    }

    boot();
    </script>
</body>
</html>
