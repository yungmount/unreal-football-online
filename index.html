<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dream Football Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root {
            --gold: #ffd700;
            --cyan: #00d4ff;
            --purple: #9333ea;
            --green: #22c55e;
            --red: #ef4444;
            --dark: #0a0a1a;
        }
        body { 
            margin: 0; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%);
            color: #fff;
            overflow-x: hidden;
        }
        .game-title { font-family: 'Orbitron', sans-serif; }
        
        /* Match Canvas */
        #matchCanvas {
            border-radius: 12px;
            background: #1a5d1a;
        }
        
        /* Events Panel */
        .event-item {
            animation: slideIn 0.3s ease-out;
            border-left: 3px solid;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        .event-goal { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .event-shot { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
        .event-foul { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .event-card { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
        .event-sub { border-color: #8b5cf6; background: rgba(139,92,246,0.1); }
        .event-pass { border-color: #3b82f6; background: rgba(59,130,246,0.1); }
        
        /* Cards */
        .card {
            background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        
        /* Buttons */
        .btn-game {
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,212,255,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-game:active { transform: scale(0.95); }
        .btn-game.gold {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
        }
        .btn-game.green { background: linear-gradient(135deg, var(--green), #16a34a); }
        .btn-game.red { background: linear-gradient(135deg, var(--red), #dc2626); }
        .btn-game.purple { background: linear-gradient(135deg, var(--purple), #7c3aed); color: #fff; }
        
        /* Lang Switch */
        .lang-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--cyan);
            color: #000;
            border-color: var(--cyan);
        }
        
        /* Nav */
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 12px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active { color: var(--cyan); }
        .nav-btn .icon { font-size: 18px; }
        .nav-btn .text { font-size: 9px; margin-top: 2px; }
        
        /* Progress bars */
        .stat-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.95));
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(34,197,94,0.4);
        }
        
        /* Standings */
        .standings-row {
            display: grid;
            grid-template-columns: 30px 1fr 40px 50px;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            align-items: center;
            font-size: 13px;
        }
        .standings-row.me { background: linear-gradient(90deg, rgba(0,212,255,0.3), transparent) !important; border: 1px solid rgba(0,212,255,0.5); }
        
        /* Player Card */
        .player-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px;
            padding: 12px;
            position: relative;
        }
        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--cyan), var(--gold));
        }
        
        .pos-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
    // ==================== FC26 Style Names ====================
    const FIRST_NAMES = [
        'Marcus', 'Lucas', 'Leon', 'Noah', 'Gabriel', 'Diego', 'Kai', 'Julian', 'Matteo', 'Luca',
        'Erik', 'Liam', 'Finn', 'Oscar', 'Victor', 'Alex', 'Max', 'Sam', 'James', 'Ben',
        'Bruno', 'Ruben', 'Dani', 'Mikel', 'Sergio', 'Marco', 'Andrea', 'Paolo', 'Gianluca',
        'Pierre', 'Antoine', 'Olivier', 'Hugo', 'Kingsley', 'Nabil', 'Karim', 'Ousmane',
        'Raheem', 'Jadon', 'Phil', 'Mason', 'Declan', 'Jude', 'Bukayo', 'Cole', 'Noni',
        'Vinicius', 'Rodrygo', 'Endrick', 'Rebe', 'Lautaro', 'Julian', 'Alejandro', 'Dani',
        'Erling', 'Kylian', 'Pedri', 'Gavi', 'Joao', 'Bernardo', 'Raphinha', 'Bruno'

    const LAST_NAMES = [
        'Rashford', 'Fernandez', 'Martinez', 'Silva', 'Santos', 'Costa', 'Muller', 'Werner',
        'Kane', 'Salah', 'Saka', 'Bellingham', 'Rice', 'Haaland', 'Mbappe', 'Vini Jr',
        'Rodri', 'De Bruyne', 'Foden', 'Grealish', 'Mount', 'Pullic', 'Havertz', 'Sancho',
        'Dembele', 'Griezmann', 'Morata', 'Felix', 'Joao Felix', 'Nuno Mendes', 'Vitinha',
        'Leao', 'Tonali', 'Brozovic', 'Calhanoglu', 'Maignan', 'Theo', 'Kramer', 'Schick',
        'Tielemans', 'Maddison', 'Mount', 'James', 'Trippier', 'Shaw', 'Stones', 'Walker',
        'Akanji', 'Dias', 'Rodri', 'Cancelo', 'Silva', 'Mahrez', 'Sterling', 'Palmer',
        'N Williams', 'Saka', 'Martinelli', 'Odegaard', 'Rice', 'Zinchenko', 'Gabriel',
        'Saliba', 'White', 'Tomiyasu', 'Raya', 'Rashford', 'Hojlund', 'Garnacho', 'Mainoo',
        'Son', 'Kane', 'Maddison', 'Van Dijk', 'Salah', 'Nunez', 'Diaz', 'Szoboszlai',
        'Alexander-Arnold', 'Robertson', 'TAA', 'Robbo', 'Dier', 'Romero', 'Udogie', 'Porro',
        'Lloris', 'Lacazette', 'Giroud', 'Thierry', 'Henry', 'Bergkamp', 'Wenger', 'Ferguson'
    ];
    
    const PinyinNames = [
        ['Zhang Wei', 'Zhāng Wěi'], ['Wang Fang', 'Wáng Fāng'], ['Li Ming', 'Lǐ Míng'],
        ['Liu Yang', 'Liú Yáng'], ['Chen Jie', 'Chén Jié'], ['Yang Fan', 'Yáng Fān'],
        ['Huang Lei', 'Huáng Lěi'], ['Zhao Jun', 'Zhào Jūn'], ['Wu Tao', 'Wú Tāo'],
        ['Zhou Peng', 'Zhōu Péng'], ['Xu Hao', 'Xú Hào'], ['Sun Jie', 'Sūn Jié'],
        ['Ma Long', 'Mǎ Lóng'], ['Zheng Kai', 'Zhèng Kǎi'], ['He Yang', 'Hé Yáng'],
        ['Gao Fei', 'Gāo Fēi'], ['Lin Hui', 'Lín Huì'], ['Zhou Xin', 'Zhōu Xīn'],
        ['Xie Feng', 'Xiè Fēng'], ['Han Qiu', 'Hán Qiū'], ['Tang Bo', 'Táng Bó']
    ];
    
    function genName(region) {
        if (region === 'China') {
            const [en, zh] = PinyinNames[Math.floor(Math.random() * PinyinNames.length)];
            return { en, zh, full: `${en} (${zh})` };
        }
        const first = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
        const last = LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)];
        return { en: `${first} ${last}`, zh: `${last}`, full: `${first} ${last}` };
    }

    // ==================== I18n ====================
    const I18N = {
        en: {
            appName: "Dream Football",
            home: "Home", team: "Squad", tactics: "Tactics", facility: "Facility", match: "Match",
            budget: "Budget", round: "Round {0}", season: "Season {0}", rank: "Rank",
            record: "Record", gd: "GD", win: "W", draw: "D", lose: "L", pts: "PTS",
            play: "Play Match", train: "Train", refresh: "Refresh", academy: "Academy",
            market: "Transfer Market", standings: "Standings", sign: "Sign", reject: "Release",
            goals: "G", assists: "A", matches: "M", fitness: "FIT", morale: "MOR",
            pace: "PAC", shooting: "SHO", passing: "PAS", defending: "DEF", physical: "PHY",
            formation: "Formation", style: "Style", upgrade: "Upgrade", attack: "Attack",
            balance: "Balance", defend: "Defend", income: "Income", level: "Level",
            goal: "GOAL!", shot: "Shot", foul: "Foul", yellowCard: "Yellow Card",
            redCard: "Red Card", substitution: "Substitution", kickoff: "Kick Off",
            halftime: "Half Time", fulltime: "Full Time", minute: "'", vs: "VS",
            squad: "Squad ({0})", selectPlayer: "Select Player", sell: "Sell",
            currentTeam: "Current XI", nextMatch: "Next Match", strength: "STR",
            points: "Points", signFee: "Sign Fee", wage: "Wage", value: "Value",
            training: "Training", youthAcademy: "Youth Academy", stadium: "Stadium",
            trainingEff: "Training Eff.", youthQuality: "Youth Quality", matchIncome: "Match Income",
            signed: "Signed!", noMoney: "Not enough funds!", trained: "Trained!",
            upgraded: "Upgraded!", all: "All", goalkeeper: "GK", defenders: "DEF",
            midfielders: "MID", attackers: "ATT", position: "Position", potential: "Potential",
            age: "Age", overall: "OVR", back: "Back", playMatch: "Play Match",
            watching: "Watching Match", live: "LIVE"
        },
        zh: {
            appName: "梦幻足球",
            home: "首页", team: "阵容", tactics: "战术", facility: "设施", match: "比赛",
            budget: "资金", round: "第{0}轮", season: "赛季{0}", rank: "排名",
            record: "战绩", gd: "净胜", win: "胜", draw: "平", lose: "负", pts: "分",
            play: "开始比赛", train: "训练", refresh: "刷新", academy: "青训",
            market: "转会市场", standings: "积分榜", sign: "签约", reject: "放弃",
            goals: "球", assists: "助", matches: "场", fitness: "体", morale: "气",
            pace: "速", shooting: "射", passing: "传", defending: "防", physical: "体",
            formation: "阵型", style: "战术", upgrade: "升级", attack: "进攻",
            balance: "平衡", defend: "防守", income: "收入", level: "等级",
            goal: "进球!", shot: "射门", foul: "犯规", yellowCard: "黄牌",
            redCard: "红牌", substitution: "换人", kickoff: "开球", halftime: "半场",
            fulltime: "全场", minute: "'", vs: "VS",
            squad: "阵容 ({0})", selectPlayer: "选择球员", sell: "出售",
            currentTeam: "当前首发", nextMatch: "下一场", strength: "实力",
            points: "积分", signFee: "签约费", wage: "周薪", value: "身价",
            training: "训练场", youthAcademy: "青训营", stadium: "体育场",
            trainingEff: "训练效率", youthQuality: "青训质量", matchIncome: "比赛收入",
            signed: "签约成功!", noMoney: "资金不足!", trained: "训练完成!",
            upgraded: "升级成功!", all: "全部", goalkeeper: "门将", defenders: "后卫",
            midfielders: "中场", attackers: "前锋", position: "位置", potential: "潜力",
            age: "年龄", overall: "总评", back: "返回", playMatch: "比赛",
            watching: "观看比赛", live: "直播"
        }
    };

    let LANG = 'en';
    function t(key, ...args) {
        let text = I18N[LANG][key] || key;
        args.forEach((v, i) => text = text.replace(`{${i}}`, v));
        return text;
    }

    function fmt(n) {
        if (n >= 1000000) return '€' + (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return '€' + (n / 1000).toFixed(0) + 'K';
        return '€' + n;
    }

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const uid = () => 'p' + Date.now() + Math.random().toString(36).substr(2, 6);

    // ==================== Game State ====================
    let game = null;
    let currentTab = 'home';
    let filterPos = 'all';
    let showToast = null;
    let matchState = null;
    let matchCanvas = null;
    let matchCtx = null;
    let animationId = null;

    // ==================== Player Creation ====================
    function createPlayer(region, position, quality = 60) {
        const age = rand(17, 35);
        const name = genName(region);
        const posBonus = {
            GK: { pace: -20, shooting: -25, defending: 20, passing: 5 },
            CB: { pace: -5, shooting: -15, defending: 25, physical: 20 },
            LB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            RB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            CDM: { pace: 0, shooting: -5, defending: 15, passing: 15 },
            CM: { pace: 5, shooting: 10, defending: 5, passing: 18 },
            CAM: { pace: 10, shooting: 18, defending: -5, passing: 15 },
            LW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            RW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            ST: { pace: 12, shooting: 25, defending: -15, physical: 15 }
        };
        const b = posBonus[position] || {};
        const potential = Math.min(99, quality + rand(5, 22));
        const baseOvr = Math.max(30, Math.min(99, quality + rand(-8, 8)));
        const baseValue = Math.floor(baseOvr * 8000 * (age < 22 ? 1.6 : age < 26 ? 1.2 : age < 30 ? 0.8 : 0.35));
        
        return {
            id: uid(),
            name,
            region,
            position,
            age,
            ovr: baseOvr,
            pace: Math.max(30, Math.min(99, rand(50, 85) + (b.pace || 0))),
            shooting: Math.max(30, Math.min(99, rand(40, 80) + (b.shooting || 0))),
            passing: Math.max(30, Math.min(99, rand(45, 85) + (b.passing || 0))),
            defending: Math.max(30, Math.min(99, rand(40, 80) + (b.defending || 0))),
            physical: Math.max(30, Math.min(99, rand(50, 85) + (b.physical || 0))),
            potential,
            fitness: rand(75, 100),
            morale: rand(60, 100),
            value: Math.floor(baseValue * rand(80, 120) / 100),
            wage: Math.floor(baseOvr * 80 * rand(80, 120) / 100),
            goals: 0, assists: 0, matches: 0,
            isGK: position === 'GK'
        };
    }

    // ==================== Game Init ====================
    function initGame() {
        const saved = localStorage.getItem('football_v4_save');
        if (saved) {
            try {
                game = JSON.parse(saved);
                return;
            } catch(e) {}
        }
        
        game = {
            budget: 5000000,
            team: [],
            league: [],
            facilities: { training: 1, academy: 1, stadium: 1 },
            season: 1, week: 1, day: 0,
            formation: '4-4-2', tactic: 'balance',
            market: [], prospects: [], news: []
        };
        
        const positions = ['GK','CB','CB','CB','LB','RB','CDM','CM','CM','CAM','LW','RW','ST','ST','CM','CDM','CB','LB','RB','GK','CM','ST'];
        const regions = ['China','England','Spain','Brazil','Germany','France','Italy','Argentina','France','England','Spain','Brazil','Germany','France','Italy','Argentina','China','England','Spain','Brazil','Germany','France'];
        
        for (let i = 0; i < 22; i++) {
            game.team.push(createPlayer(regions[i], positions[i], rand(58, 72)));
        }
        
        const teamNames = {
            en: ['FC United', 'Athletic Club', 'Dragon FC', 'Lion SC', 'Red Stars', 'Blue Moon', 'Green FC', 'Phoenix FC', 'Silver Eagles', 'Golden Snakes', 'Violets', 'Panthers'],
            zh: ['FC联', '竞技俱乐部', '龙之队', '雄狮FC', '红星队', '蓝月亮', '绿茵FC', '凤凰FC', '银鹰SC', '金蛇队', '紫百合', '黑豹FC']
        };
        
        game.league = teamNames.en.map((name, i) => ({
            name, index: i, strength: rand(40, 88),
            played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, pts: 0
        }));
        game.leagueNames = teamNames;
    }

    function save() {
        localStorage.setItem('football_v4_save', JSON.stringify(game));
    }

    function getLeagueName(i) {
        return LANG === 'zh' ? game.leagueNames.zh[i] : game.leagueNames.en[i];
    }

    // ==================== Game Actions ====================
    function refreshMarket() {
        const q = 55 + game.facilities.academy * 3;
        game.market = [];
        const regions = ['England', 'Spain', 'Brazil', 'Germany', 'France', 'Italy', 'Argentina'];
        for (let i = 0; i < 6; i++) {
            const p = createPlayer(regions[rand(0, regions.length - 1)], ['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST'][rand(0, 9)], rand(q - 10, q + 15));
            p.askPrice = Math.floor(p.value * rand(75, 125) / 100);
            game.market.push(p);
        }
        save();
    }

    function scoutAcademy() {
        const count = 2 + Math.floor(game.facilities.academy / 2);
        const q = 42 + game.facilities.academy * 4;
        game.prospects = [];
        for (let i = 0; i < Math.min(count, 4); i++) {
            game.prospects.push(createPlayer('China', ['GK','CB','CM','ST'][rand(0, 3)], rand(q - 12, q + 12)));
        }
        addNews(`🌟 Academy found ${game.prospects.length} talents!`);
    }

    function trainTeam() {
        const bonus = 1 + game.facilities.training * 0.18;
        game.team.forEach(p => {
            if (p.age < 29 && p.ovr < p.potential) {
                const gain = Math.floor(rand(0, 2) * bonus);
                if (gain > 0) {
                    p.ovr = Math.min(p.potential, p.ovr + gain);
                    if (rand(1, 100) <= 25) {
                        const stats = ['pace', 'shooting', 'passing', 'defending', 'physical'];
                        p[stats[rand(0, 4)]] = Math.min(99, p[stats[rand(0, 4)]] + 1);
                    }
                }
            }
            p.fitness = Math.min(100, p.fitness + rand(8, 18));
        });
        addNews(t('trained'));
        save();
    }

    function addNews(text) {
        game.news.unshift({ text, time: Date.now() });
        if (game.news.length > 20) game.news = game.news.slice(0, 20);
    }

    // ==================== Match Simulation ====================
    const FORMATION_POSITIONS = {
        '4-4-2': [0, 1, 1, 2, 3, 4, 5, 5, 6, 7, 8, 9, 9, 10],
        '4-3-3': [0, 1, 1, 2, 3, 4, 5, 5, 5, 6, 7, 8, 9, 10],
        '4-2-3-1': [0, 1, 1, 2, 3, 4, 4, 5, 5, 5, 6, 7, 8, 9],
        '3-5-2': [0, 1, 1, 1, 2, 3, 4, 5, 5, 6, 7, 8, 9, 10]
    };

    function startMatch() {
        currentTab = 'match';
        render();
        
        const myTeam = game.team.slice(0, 11).map((p, i) => ({
            ...p,
            x: 0.15 + (i % 4) * 0.08,
            y: 0.2 + Math.floor(i / 4) * 0.15,
            targetX: 0.15 + (i % 4) * 0.08,
            targetY: 0.2 + Math.floor(i / 4) * 0.15,
            vx: 0, vy: 0
        }));
        
        const oppIdx = rand(1, game.league.length - 1);
        const oppStrength = game.league[oppIdx].strength;
        const oppRegion = ['England', 'Spain', 'Brazil', 'Germany', 'France'][rand(0, 4)];
        const oppTeam = [];
        const oppPositions = ['GK','CB','CB','LB','RB','CDM','CM','CM','LW','ST','RW'];
        for (let i = 0; i < 11; i++) {
            oppTeam.push(createPlayer(oppRegion, oppPositions[i], oppStrength));
        }
        
        matchState = {
            myTeam,
            oppTeam,
            oppName: getLeagueName(oppIdx),
            myScore: 0,
            oppScore: 0,
            minute: 0,
            second: 0,
            events: [],
            ball: { x: 0.5, y: 0.5, vx: 0, vy: 0, owner: null },
            possession: 'my',
            phase: 'kickoff',
            nextEventMinute: rand(1, 3),
            started: false,
            finished: false,
            halftime: false,
            yellowCards: { my: [], opp: [] },
            substitutions: { my: [], opp: [] }
        };
        
        addNews(`⚽ Match started: FC United vs ${matchState.oppName}`);
        
        setTimeout(() => {
            matchState.started = true;
            startMatchAnimation();
        }, 1000);
    }

    function startMatchAnimation() {
        if (!matchState || matchState.finished) return;
        
        const canvas = document.getElementById('matchCanvas');
        if (!canvas) return;
        
        matchCanvas = canvas;
        matchCtx = canvas.getContext('2d');
        
        // Set canvas size
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        matchCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        function gameLoop() {
            if (!matchState || !matchState.started) return;
            
            updateMatch();
            renderMatch();
            
            if (!matchState.finished) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }
        
        animationId = requestAnimationFrame(gameLoop);
    }

    function updateMatch() {
        if (!matchState || !matchState.started || matchState.finished) return;
        
        // Update time
        matchState.second += 2;
        if (matchState.second >= 60) {
            matchState.second = 0;
            matchState.minute++;
            matchState.nextEventMinute = rand(15, 45);
            
            if (matchState.minute === 45 && !matchState.halftime) {
                matchState.halftime = true;
                matchState.phase = 'halftime';
                addMatchEvent('⏱️ HALF TIME', 'info');
            }
            
            if (matchState.minute >= 90) {
                endMatch();
                return;
            }
        }
        
        // Move ball
        moveBall();
        
        // Generate events
        if (matchState.second >= matchState.nextEventMinute * 2 && !matchState.halftime) {
            generateMatchEvent();
            matchState.nextEventMinute = rand(15, 45);
        }
        
        // Move players
        movePlayers();
    }

    function moveBall() {
        const ball = matchState.ball;
        
        if (ball.owner) {
            // Ball follows owner
            ball.x += (ball.owner.x - ball.x) * 0.3;
            ball.y += (ball.owner.y - ball.y) * 0.3;
        } else {
            // Ball moves freely
            ball.x += ball.vx * 0.02;
            ball.y += ball.vy * 0.02;
            ball.vx *= 0.95;
            ball.vy *= 0.95;
            
            // Keep in bounds
            ball.x = Math.max(0.02, Math.min(0.98, ball.x));
            ball.y = Math.max(0.02, Math.min(0.98, ball.y));
            
            // Try to intercept
            if (Math.random() < 0.02) {
                const attackers = matchState.possession === 'my' ? matchState.oppTeam : matchState.myTeam;
                const closest = attackers.reduce((best, p) => {
                    const dist = Math.hypot(p.x - ball.x, p.y - ball.y);
                    return dist < best.dist ? { p, dist } : best;
                }, { p: null, dist: Infinity });
                
                if (closest.dist < 0.08) {
                    ball.owner = closest.p;
                    matchState.possession = matchState.possession === 'my' ? 'opp' : 'my';
                }
            }
        }
    }

    function movePlayers() {
        const ball = matchState.ball;
        
        matchState.myTeam.forEach((p, i) => {
            let targetX = p.x;
            let targetY = p.y;
            
            if (ball.owner) {
                if (matchState.possession === 'my') {
                    // Attack - move towards goal
                    targetX = 0.5 + (p.x - 0.5) * 0.5;
                    targetY = 0.3 + Math.random() * 0.4;
                } else {
                    // Defend - track back
                    targetX = 0.3 + (p.x - 0.3) * 0.5;
                    targetY = 0.2 + Math.random() * 0.6;
                }
            } else {
                // Follow ball
                targetX = ball.x + (p.x - 0.5) * 0.3;
                targetY = ball.y + (p.y - 0.5) * 0.3;
            }
            
            p.x += (targetX - p.x) * 0.05;
            p.y += (targetY - p.y) * 0.05;
            p.x = Math.max(0.05, Math.min(0.5, p.x));
            p.y = Math.max(0.05, Math.min(0.95, p.y));
        });
        
        matchState.oppTeam.forEach((p, i) => {
            let targetX = p.x;
            let targetY = p.y;
            
            if (ball.owner) {
                if (matchState.possession === 'opp') {
                    targetX = 0.5 + (p.x - 0.5) * 0.5;
                    targetY = 0.3 + Math.random() * 0.4;
                } else {
                    targetX = 0.7 - (0.5 - p.x) * 0.5;
                    targetY = 0.2 + Math.random() * 0.6;
                }
            } else {
                targetX = ball.x + (p.x - 0.5) * 0.3;
                targetY = ball.y + (p.y - 0.5) * 0.3;
            }
            
            p.x += (targetX - p.x) * 0.05;
            p.y += (targetY - p.y) * 0.05;
            p.x = Math.max(0.5, Math.min(0.95, p.x));
            p.y = Math.max(0.05, Math.min(0.95, p.y));
        });
    }

    function generateMatchEvent() {
        if (!matchState || matchState.finished || matchState.halftime) return;
        
        const myAttack = matchState.possession === 'my';
        const attackers = myAttack ? matchState.myTeam : matchState.oppTeam;
        const shooters = attackers.filter(p => ['ST', 'LW', 'RW', 'CAM'].includes(p.position));
        const shooter = shooters[rand(0, shooters.length - 1)] || attackers[rand(0, 5)];
        
        const eventType = rand(1, 100);
        
        if (eventType <= 25) {
            // Shot
            const shotQuality = (shooter.shooting + shooter.pace) / 2;
            const saveChance = myAttack ? (matchState.oppTeam[0].defending + 40) / 2 : (matchState.myTeam[0].defending + 40)            const shooterOvr = shooter.ovr;
            
            matchState.ball.owner = shooter;
            matchState.ball.x = shooter.x;
            matchState.ball.y = shooter.y;
            
            if (shotQuality > saveChance + 10) {
                // Goal!
                if (myAttack) {
                    matchState.myScore++;
                    shooter.goals++;
                } else {
                    matchState.oppScore++;
                }
                addMatchEvent(`⚽ ${shooter.name.en.split(' ')[0]} SCORES! ${matchState.myScore} - ${matchState.oppScore}`, 'goal');
            } else if (shotQuality > saveChance - 5) {
                // Saved
                addMatchEvent(`🧤 ${shooter.name.en.split(' ')[0]} - Saved!`, 'shot');
                const gk = myAttack ? matchState.oppTeam[0] : matchState.myTeam[0];
                matchState.ball.owner = null;
                matchState.ball.vx = (Math.random() - 0.5) * 2;
                matchState.ball.vy = (Math.random() - 0.5) * 2;
            } else {
                // Missed
                addMatchEvent(`❌ ${shooter.name.en.split(' ')[0]} - Missed!`, 'shot');
                matchState.ball.owner = null;
                matchState.ball.vx = (Math.random() - 0.5) * 3;
                matchState.ball.vy = (Math.random() - 0.5) * 3;
            }
        } else if (eventType <= 35) {
            // Foul
            const fouler = attackers[rand(0, attackers.length - 1)];
            const fouled = myAttack ? matchState.oppTeam[rand(0, 5)] : matchState.myTeam[rand(0, 5)];
            
            if (rand(1, 100) <= 15) {
                // Yellow card
                const team = myAttack ? 'my' : 'opp';
                if (!matchState.yellowCards[team].includes(fouler.id)) {
                    matchState.yellowCards[team].push(fouler.id);
                    addMatchEvent(`🟨 Yellow Card: ${fouler.name.en.split(' ')[0]}`, 'card');
                } else {
                    // Second yellow = red
                    addMatchEvent(`🟥 RED CARD: ${fouler.name.en.split(' ')[0]}`, 'card');
                }
            } else {
                addMatchEvent(`⚠️ Foul by ${fouler.name.en.split(' ')[0]}`, 'foul');
            }
            
            matchState.possession = matchState.possession === 'my' ? 'opp' : 'my';
        } else if (eventType <= 50) {
            // Pass/Skills
            const passer = attackers[rand(0, 7)];
            const receiver = attackers[rand(0, 7)];
            
            if (passer && receiver && passer.id !== receiver.id) {
                matchState.ball.owner = receiver;
                matchState.ball.x = receiver.x;
                matchState.ball.y = receiver.y;
                addMatchEvent(`👟 ${passer.name.en.split(' ')[0]} → ${receiver.name.en.split(' ')[0]}`, 'pass');
            }
        } else if (eventType <= 55) {
            // Substitution
            if (matchState.minute >= 60 && matchState.myTeam.length > 11) {
                addMatchEvent(`🔄 Substitution: ${matchState.myTeam[11].name.en.split(' ')[0]} ON`, 'sub');
                matchState.myTeam.shift();
            }
        }
    }

    function addMatchEvent(text, type) {
        if (!matchState) return;
        matchState.events.unshift({ text, type, time: `${matchState.minute}'` });
        if (matchState.events.length > 15) matchState.events.pop();
        renderMatchUI();
    }

    function endMatch() {
        if (!matchState) return;
        matchState.finished = true;
        matchState.phase = 'fulltime';
        
        if (animationId) {
            cancelAnimationFrame(animationId);
        }
        
        // Update league
        const myLeague = game.league.find(l => l.name === 'FC United');
        const oppLeague = game.league.find(l => l.name === matchState.oppName);
        
        myLeague.played++; oppLeague.played++;
        myLeague.gf += matchState.myScore; myLeague.ga += matchState.oppScore;
        oppLeague.gf += matchState.oppScore; oppLeague.ga += matchState.myScore;
        
        if (matchState.myScore > matchState.oppScore) {
            myLeague.won++; myLeague.pts += 3; oppLeague.lost++;
        } else if (matchState.myScore === matchState.oppScore) {
            myLeague.drawn++; myLeague.pts += 1; oppLeague.drawn++; oppLeague.pts += 1;
        } else {
            myLeague.lost++; oppLeague.won++; oppLeague.pts += 3;
        }
        
        const income = 120000 * game.facilities.stadium;
        game.budget += income;
        
        game.team.slice(0, 11).forEach(p => {
            p.matches++;
            p.fitness = Math.max(45, p.fitness - rand(10, 20));
            p.morale = Math.min(100, p.morale + (matchState.myScore > matchState.oppScore ? 6 : -4));
            if (Math.random() < 0.12) p.assists++;
        });
        
        game.week++;
        const resultText = matchState.myScore > matchState.oppScore ? '🎉 WIN!' : matchState.myScore === matchState.oppScore ? '🤝 DRAW!' : '😢 LOSS...';
        addNews(`${resultText} FC United ${matchState.myScore}-${matchState.oppScore} ${matchState.oppName}`);
        
        if (game.week > 38) {
            game.season++;
            game.week = 1;
            game.league.sort((a, b) => b.pts - a.pts);
            const pos = game.league.findIndex(l => l.name === 'FC United') + 1;
            addNews(`🏆 Season ${game.season - 1} ended! Rank #${pos}`);
            game.league.forEach(l => {
                if (l.name !== 'FC United') l.strength = Math.max(35, Math.min(95, l.strength + rand(-6, 6)));
                l.played = l.won = l.drawn = l.lost = l.gf = l.ga = l.pts = 0;
            });
            game.budget += 2500000;
        }
        
        save();
        renderMatchUI();
    }

                    ${formations.map(f => `
                        <button onclick="game.formation='${f}';save();render()" class="p-3 rounded-xl text-center ${game.formation===f?'bg-cyan-500/20 border-2 border-cyan-400':'bg-slate-800/50 border border-slate-600'}">
                            <div class="text-xl font-bold game-title">${f}</div>
                        </button>
                    `).join('')}
                </div>
            </div>
            
            <div class="card p-3 mb-3">
                <h3 class="font-bold text-sm mb-3">🎯 ${t('style')}</h3>
                <div class="grid grid-cols-3 gap-2">
                    ${tactics.map(key => `
                        <button onclick="game.tactic='${key}';save();render()" class="p-3 rounded-xl text-center ${game.tactic===key?'bg-cyan-500/20 border-2 border-cyan-400':'bg-slate-800/50 border border-slate-600'}">
                            <div class="text-2xl mb-1">${key==='attack'?'⚔️':key==='balance'?'⚖️':'🛡️'}</div>
                            <div class="font-bold">${t(key)}</div>
                        </button>
                    `).join('')}
                </div>
            </div>
            
            <div class="card p-3">
                <h3 class="font-bold text-sm mb-3">📋 ${t('currentTeam')}</h3>
                <div class="text-xs text-slate-400 mb-2">${t('formation')}: ${game.formation} · ${t(game.tactic)}</div>
                <div class="space-y-1">
                    ${game.team.slice(0, 11).map(p => `
                        <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded-lg text-sm">
                            <span>${LANG === 'zh' ? p.name.zh : p.name.en}</span>
                            <span class="text-cyan-400 font-bold">${p.position}</span>
                            <span class="text-amber-400">${p.ovr}</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderFacility() {
        const facilities = [
            { key: 'training', name: 'Training Ground', icon: '🏋️' },
            { key: 'academy', name: 'Youth Academy', icon: '🌟' },
            { key: 'stadium', name: 'Stadium', icon: '🏟️' }
        ];
        const costs = [50000, 100000, 200000, 400000, 800000, 1600000, 3200000, 6400000, 12800000];
        
        return `
            <div class="space-y-3">
                ${facilities.map(f => {
                    const level = game.facilities[f.key];
                    const cost = costs[Math.min(level - 1, 8)];
                    const canAfford = game.budget >= cost;
                    return `
                        <div class="card p-4">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-2xl">${f.icon}</span>
                                    <div>
                                        <div class="font-bold">${LANG === 'zh' ? (f.key === 'training' ? '训练场' : f.key === 'academy' ? '青训营' : '体育场') : f.name}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-bold game-title text-cyan-300">Lv.${level}</div>
                                </div>
                            </div>
                            <button onclick="upgradeFacility('${f.key}')" class="btn-game w-full text-xs ${canAfford&&level<10?'gold':'purple'}" ${!canAfford||level>=10?'disabled':''}>
                                ${level >= 10 ? 'MAX' : `⬆️ ${t('upgrade')} (${fmt(cost)})`}
                            </button>
                            <div class="flex gap-1 mt-2">
                                ${Array.from({length: 10}).map((_, i) => `<div class="h-2 flex-1 rounded ${i < level ? 'bg-cyan-400' : 'bg-slate-700'}"></div>`).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    function renderMatchTab() {
        if (matchState) {
            return renderMatchView();
        }
        
        const myLeague = game.league.find(l => l.name === 'FC United');
        const opp = game.league[rand(1, game.league.length - 1)];
        
        return `
            <div class="card p-4 mb-3 text-center">
                <h3 class="font-bold text-lg mb-4">⚽ ${t('nextMatch')}</h3>
                <div class="flex items-center justify-center gap-4">
                    <div class="text-center">
                        <div class="text-2xl mb-1">🔵</div>
                        <div class="font-bold">${getLeagueName(0)}</div>
                        <div class="text-xs text-slate-400">#${game.league.sort((a,b)=>b.pts-a.pts).findIndex(l=>l.name==='FC United')+1}</div>
                    </div>
                    <div class="text-3xl font-bold game-title text-slate-500">${t('vs')}</div>
                    <div class="text-center">
                        <div class="text-2xl mb-1">🔴</div>
                        <div class="font-bold">${getLeagueName(opp.index)}</div>
                        <div class="text-xs text-slate-400">${t('strength')}: ${opp.strength}</div>
                    </div>
                </div>
            </div>
            
            <button onclick="startMatch()" class="btn-game gold w-full text-lg py-4">⚽ ${t('playMatch')}</button>
        `;
    }

    function renderMatchView() {
        return `
            <div class="card p-3 mb-3">
                <div class="flex justify-between items-center">
                    <div class="text-center">
                        <div class="text-xs text-slate-400">${getLeagueName(0)}</div>
                        <div class="text-4xl font-bold game-title text-cyan-300">${matchState.myScore}</div>
                    </div>
                    <div class="text-center">
                        <div class="text-xs text-red-400 font-bold animate-pulse">${t('live')}</div>
                        <div class="text-2xl font-bold game-title">${matchState.minute}'</div>
                        <div class="text-xs text-slate-400">${Math.floor(matchState.second / 60 * 100)}%</div>
                    </div>
                    <div class="text-center">
                        <div class="text-xs text-slate-400">${matchState.oppName}</div>
                        <div class="text-4xl font-bold game-title text-red-400">${matchState.oppScore}</div>
                    </div>
                </div>
            </div>
            
            <div class="card p-2 mb-3" style="background:#1a5d1a; border-radius:12px;">
                <canvas id="matchCanvas" width="350" height="200" style="width:100%;height:auto;border-radius:8px;"></canvas>
            </div>
            
            <div class="card p-3" style="max-height:200px;overflow-y:auto;">
                <h4 class="font-bold text-sm mb-2">📋 ${LANG==='zh'?'赛事':'Events'}</h4>
                <div id="matchEvents" class="space-y-1">
                    ${matchState.events.map(e => `
                        <div class="event-item ${e.type === 'goal' ? 'event-goal' : e.type === 'card' ? 'event-card' : e.type === 'shot' ? 'event-shot' : e.type === 'foul' ? 'event-foul' : e.type === 'sub' ? 'event-sub' : 'event-pass'} p-2 rounded text-xs">
                            <span class="text-slate-400 mr-2">${e.time}</span>
                            ${e.text}
                        </div>
                    `).join('')}
                </div>
            </div>
            
            ${matchState.finished ? `
                <div class="mt-3 text-center">
                    <div class="text-2xl font-bold mb-2 ${matchState.myScore > matchState.oppScore ? 'text-green-400' : matchState.myScore === matchState.oppScore ? 'text-yellow-400' : 'text-red-400'}">
                        ${matchState.myScore > matchState.oppScore ? '🎉 WIN!' : matchState.myScore === matchState.oppScore ? '🤝 DRAW!' : '😢 LOSS...'}
                    </div>
                    <button onclick="currentTab='home';matchState=null;render()" class="btn-game gold">${t('back')}</button>
                </div>
            ` : ''}
        `;
    }

    function renderMatchUI() {
        const eventsEl = document.getElementById('matchEvents');
        if (eventsEl && matchState) {
            eventsEl.innerHTML = matchState.events.map(e => `
                <div class="event-item ${e.type === 'goal' ? 'event-goal' : e.type === 'card' ? 'event-card' : e.type === 'shot' ? 'event-shot' : e.type === 'foul' ? 'event-foul' : e.type === 'sub' ? 'event-sub' : 'event-pass'} p-2 rounded text-xs">
                    <span class="text-slate-400 mr-2">${e.time}</span>
                    ${e.text}
                </div>
            `).join('');
        }
    }

    function renderMatch() {
        if (!matchCanvas || !matchCtx) return;
        
        const ctx = matchCtx;
        const w = matchCanvas.width / window.devicePixelRatio;
        const h = matchCanvas.height / window.devicePixelRatio;
        
        // Clear
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(0, 0, w, h);
        
        // Field lines
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        
        // Border
        ctx.strokeRect(10, 10, w - 20, h - 20);
        
        // Center line
        ctx.beginPath();
        ctx.moveTo(w / 2, 10);
        ctx.lineTo(w / 2, h - 10);
        ctx.stroke();
        
        // Center circle
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 30, 0, Math.PI * 2);
        ctx.stroke();
        
        // Goals
        ctx.strokeRect(10, h / 2 - 25, 15, 50);
        ctx.strokeRect(w - 25, h / 2 - 25, 15, 50);
        
        // Penalty areas
        ctx.strokeRect(10, h / 4, 30, h / 2);
        ctx.strokeRect(w - 40, h / 4, 30, h / 2);
        
        // Draw players
        matchState.myTeam.forEach((p, i) => {
            const x = p.x * w;
            const y = p.y * h;
            
            // Player dot
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#00aaff';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Name
            ctx.fillStyle = '#ffffff';
            ctx.font = '8px Inter';
            ctx.textAlign = 'center';
            const shortName = p.name.en.split(' ')[0].substring(0, 4);
            ctx.fillText(shortName, x, y + 22);
        });
        
        matchState.oppTeam.forEach((p, i) => {
            const x = p.x * w;
            const y = p.y * h;
            
            // Player dot
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4444';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Name
            ctx.fillStyle = '#ffffff';
            ctx.font = '8px Inter';
            ctx.textAlign = 'center';
            const shortName = p.name.en.split(' ')[0].substring(0, 4);
            ctx.fillText(shortName, x, y + 22);
        });
        
        // Draw ball
        const bx = matchState.ball.x * w;
        const by = matchState.ball.y * h;
        ctx.beginPath();
        ctx.arc(bx, by, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Score overlay
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(w/2 - 50, 0, 100, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Orbitron, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.myScore} - ${matchState.oppScore}`, w/2, 15);
        
        // Minute
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(w - 40, 0, 40, 18);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 10px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.minute}'`, w - 20, 13);
    }

    // ==================== Actions ====================
    function upgradeFacility(key) {
        const costs = [50000, 100000, 200000, 400000, 800000, 1600000, 3200000, 6400000, 12800000];
        const cost = costs[Math.min(game.facilities[key] - 1, 8)];
        if (game.budget >= cost && game.facilities[key] < 10) {
            game.budget -= cost;
            game.facilities[key]++;
            addNews(`🔧 ${key} upgraded to Lv.${game.facilities[key]}!`);
            showToast = t('upgraded');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    function signProspect(id) {
        const p = game.prospects.find(x => x.id === id);
        if (p && game.budget >= p.value * 0.3) {
            game.budget -= Math.floor(p.value * 0.3);
            game.team.push(p);
            game.prospects = game.prospects.filter(x => x.id !== id);
            addNews(`✅ Signed ${p.name.en}!`);
            showToast = t('signed');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    function rejectProspect(id) {
        game.prospects = game.prospects.filter(x => x.id !== id);
        render();
    }

    function buyPlayer(id) {
        const p = game.market.find(x => x.id === id);
        if (p && game.budget >= p.askPrice) {
            game.budget -= p.askPrice;
            game.team.push(p);
            game.market = game.market.filter(x => x.id !== id);
            addNews(`💰 Signed ${p.name.en}!`);
            showToast = t('signed');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    // ==================== Boot ====================
    initGame();
    refreshMarket();
    scoutAcademy();
    render();
    </script>
</body>
</html>
