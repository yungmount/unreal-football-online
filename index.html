<script>
// ---- Utils (must be before engine) ----
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

// ============================================================
// UFO Match Engine v3.0 - INLINE
// 整合: openfootmanager 多因子模型 + phaser-simple-soccer 状态机
// ============================================================

const PlayerState = {
  WAIT: 'wait',
  CHASE_BALL: 'chase',
  DRIBBLE: 'dribble',
  PASS: 'pass',
  SHOOT: 'shoot',
  RECEIVE_BALL: 'receive',
  RETURN_HOME: 'home',
  SUPPORT_ATTACKER: 'support',
  PRESS: 'press'
};

const Zone = {
  HOME_BOX: 'home_box',
  HOME_THIRD: 'home_third',
  MIDFIELD: 'midfield',
  AWAY_THIRD: 'away_third',
  AWAY_BOX: 'away_box'
};

function getZone(x, isMyTeam) {
  if (x < 0.2) return isMyTeam ? Zone.HOME_BOX : Zone.AWAY_BOX;
  if (x < 0.4) return isMyTeam ? Zone.HOME_THIRD : Zone.AWAY_THIRD;
  if (x < 0.6) return Zone.MIDFIELD;
  if (x < 0.8) return isMyTeam ? Zone.AWAY_THIRD : Zone.HOME_THIRD;
  return isMyTeam ? Zone.AWAY_BOX : Zone.HOME_BOX;
}

const Tactics = {
  TIKITAKA: { name: 'Tiki-Taka', passBonus: 1.15, pressBonus: 1.1, shootPenalty: 0.9 },
  COUNTER: { name: 'Counter Attack', paceBonus: 1.2, passPenalty: 0.9, shootBonus: 1.1 },
  PARK_BUS: { name: 'Park the Bus', defendBonus: 1.2, attackPenalty: 0.75 },
  GEGENPRESS: { name: 'Gegenpress', pressBonus: 1.25, staminaPenalty: 0.9 },
  WING_PLAY: { name: 'Wing Play', crossBonus: 1.2, aerialBonus: 1.1 }
};

function expandPlayerStats(p) {
  return {
    ...p,
    x: p.x || p.hx || 0.5,
    y: p.y || p.hy || 0.5,
    vx: 0, vy: 0, ax: 0, ay: 0,
    pace: p.pace || 70,
    shooting: p.shooting || 70,
    passing: p.passing || 70,
    defending: p.defending || 70,
    physical: p.physical || 70,
    vision: Math.min(99, (p.passing || 70) + rand(-5, 5)),
    composure: Math.min(99, (p.shooting || 70) + rand(-8, 3)),
    teamwork: Math.min(99, (p.passing || 70) + rand(-3, 8)),
    decisions: Math.min(99, ((p.passing || 70) + (p.defending || 70)) / 2 + rand(-5, 5)),
    positioning: Math.min(99, (p.defending || 70) + rand(-3, 7)),
    tackling: Math.min(99, (p.defending || 70) + rand(-5, 5)),
    agility: Math.min(99, (p.pace || 70) + rand(-8, 2)),
    aerial: Math.min(99, (p.physical || 70) + rand(-5, 5)),
    stamina: Math.min(99, (p.physical || 70) + (p.pace || 70) / 2 + rand(-10, 5)),
    state: PlayerState.RETURN_HOME,
    stateTimer: 0,
    targetX: p.hx || 0.5,
    targetY: p.hy || 0.5,
    distanceRun: 0, touches: 0, passesAttempted: 0, passesCompleted: 0,
    shots: 0, tackles: 0, interceptions: 0
  };
}

// ============================================================
// UFO Match Engine v4.0 - Pre-computed + Playback
// 赛前一次性生成所有帧，播放时零 AI 计算，纯 Canvas 渲染
// ============================================================

const MATCH_FPS = 5;   // 每秒 5 帧动画（足够流畅，内存友好）
const MATCH_DURATION = 270; // 270 game-minutes = 45+45 min (×3 scale → 90s real)
const MATCH_REAL_SEC = 90;  // 90 秒现实时间播完 270 分钟比赛

class MatchEngine {
  constructor(myTeam, oppTeam, oppName, myTactic = {}, oppTactic = {}) {
    this.oppName = oppName;
    this.myTactic = myTactic;
    this.oppTactic = oppTactic;
    this.score = { my: 0, opp: 0 };
    this.events = [];
    this.stats = {
      my: { shots: 0, shotsOn: 0, passes: 0, passesComp: 0, tackles: 0, fouls: 0, corners: 0 },
      opp: { shots: 0, shotsOn: 0, passes: 0, passesComp: 0, tackles: 0, fouls: 0, corners: 0 }
    };
    // 展开球员属性
    this.myTeam = myTeam.map(p => ({ ...expandPlayerStats({ ...p, isMy: true }), hx: p.hx, hy: p.hy }));
    this.oppTeam = oppTeam.map(p => ({ ...expandPlayerStats({ ...p, isMy: false }), hx: p.hx, hy: p.hy }));
    // 预计算所有帧
    this.frames = [];
    this._precompute();
  }

  // ---- 预计算阶段（一次性）----
  _precompute() {
    const fp = FP[G.formation] || FP['4-4-2'];
    // 初始化位置
    const state = {
      my: this.myTeam.map((p, i) => {
        const pos = fp[i] || [0.25, 0.5];
        return { ...p, x: pos[0], y: pos[1], hx: pos[0], hy: pos[1], vx: 0, vy: 0 };
      }),
      opp: this.oppTeam.map((p, i) => {
        const pos = fp[i] || [0.75, 0.5];
        return { ...p, x: 1 - pos[0], y: pos[1], hx: 1 - pos[0], hy: pos[1], vx: 0, vy: 0 };
      }),
      ball: { x: 0.5, y: 0.5, vx: 0, vy: 0 },
      score: { my: 0, opp: 0 },
      possession: 'my',
      phase: 'opening', // opening | first_half | half_time | second_half | finished
      ticks: 0,
      goalTicks: null,
      goalScorer: null,
    };

    const totalTicks = Math.ceil(MATCH_DURATION * MATCH_FPS);

    for (let tick = 0; tick < totalTicks; tick++) {
      const min = Math.floor((tick / MATCH_FPS) / 60);
      const sec = Math.floor((tick / MATCH_FPS) % 60);
      const phase = this._getPhase(min, state.phase);

      // 如果刚进球，3 秒内不处理球权
      if (state.goalTicks !== null && tick - state.goalTicks < 3 * MATCH_FPS) {
        // 保持进球画面
      } else {
        this._tick(state, min, phase);
      }

      // 记录事件帧（事件触发后的前 10 帧高亮）
      const evtFrame = this._pendingEvt ? tick : null;

      this.frames.push({
        my: state.my.map(p => ({ x: p.x, y: p.y, isMy: true, role: p.role, name: p.name })),
        opp: state.opp.map(p => ({ x: p.x, y: p.y, isMy: false, role: p.role, name: p.name })),
        ball: { x: state.ball.x, y: state.ball.y },
        score: { ...state.score },
        min,
        sec,
        phase,
        evt: evtFrame,
        possession: state.possession,
      });
    }

    this.score = state.score;
    this.events = this._allEvents || [];
  }

  _getPhase(min, prev) {
    if (min === 0) return 'opening';
    if (min < 1) return 'opening';
    if (min === 45 && prev !== 'half_time') return 'half_time';
    if (min === 46) return 'second_half';
    if (min >= 45 && min < 46) return 'half_time';
    if (min >= 90) return 'finished';
    if (min > 1 && min < 45) return 'first_half';
    return 'second_half';
  }

  _tick(state, min, phase) {
    // 开球阶段：球在中间，双方落位
    if (phase === 'opening') {
      state.ball.x += (0.5 - state.ball.x) * 0.1;
      state.ball.y += (0.5 - state.ball.y) * 0.1;
      this._moveToHome(state.my);
      this._moveToHome(state.opp);
      if (min >= 1) state.phase = 'first_half';
      return;
    }

    // 半场休息
    if (phase === 'half_time') {
      state.ball.x += (0.5 - state.ball.x) * 0.05;
      state.ball.y += (0.5 - state.ball.y) * 0.05;
      this._moveToHome(state.my);
      this._moveToHome(state.opp);
      if (min === 46) {
        // 换边开球
        state.possession = 'my';
        state.ball = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
      }
      return;
    }

    if (phase === 'finished') return;

    // 计算双方进攻倾向
    const myStr = this._teamStrength(state.my, 'my');
    const oppStr = this._teamStrength(state.opp, 'opp');
    const myAtk = state.possession === 'my';
    const atkTeam = myAtk ? state.my : state.opp;
    const defTeam = myAtk ? state.opp : state.my;
    const atkStr = myAtk ? myStr : oppStr;
    const defStr = myAtk ? oppStr : myStr;

    // 球在脚下时：有概率射门/传球/推进
    if (state.ball.vx === 0 && state.ball.vy === 0) {
      const holder = atkTeam[0]; // 默认找前锋
      const defGoal = myAtk ? 0.97 : 0.03;
      const defMid = myAtk ? 0.7 : 0.3;

      // 射门判定
      const inBox = Math.abs(holder.x - defGoal) < 0.15 && Math.abs(holder.y - 0.5) < 0.25;
      const inThird = Math.abs(holder.x - defGoal) < 0.35;
      if ((inBox && Math.random() < 0.18) || (inThird && Math.random() < 0.04)) {
        const shootSkill = holder.shooting || 60;
        const gkSkill = defTeam[0].defending || 50;
        const accuracy = 0.6 + (shootSkill - 60) / 200;
        const onTarget = Math.random() < accuracy;
        if (onTarget) {
          const conversion = 0.3 + (shootSkill - gkSkill) / 200;
          if (Math.random() < conversion) {
            state.score.myAtk ? state.score.my++ : state.score.opp++;
            const scorer = holder;
            const goalTxt = `⚽ 进球! ${scorer.name.split(' ').pop()}! ${state.score.my}-${state.score.opp}`;
            this._allEvents = this._allEvents || [];
            this._allEvents.push({ text: goalTxt, type: 'goal', min: `${min}'`, isMy: !!myAtk });
            state.ball.x = defGoal; state.ball.y = 0.4 + Math.random() * 0.2;
            state.goalTicks = state.ticks;
            state.possession = myAtk ? 'opp' : 'my';
          } else {
            const saveTxt = `🧤 门将扑出!`;
            this._allEvents = this._allEvents || [];
            this._allEvents.push({ text: saveTxt, type: 'save', min: `${min}'`, isMy: !!myAtk });
            state.ball.x = myAtk ? 0.88 : 0.12; state.ball.y = 0.3 + Math.random() * 0.4;
          }
        } else {
          this._allEvents = this._allEvents || [];
          this._allEvents.push({ text: `❌ 偏出!`, type: 'miss', min: `${min}'`, isMy: !!myAtk });
          state.ball.x = myAtk ? 0.9 : 0.1; state.ball.y = Math.random() > 0.5 ? 0.08 : 0.92;
        }
        state.goalTicks = state.ticks;
        return;
      }

      // 传球推进
      const receivers = atkTeam.filter(p => p !== holder);
      const target = receivers[rand(0, receivers.length - 1)];
      if (target) {
        const passSkill = holder.passing || 55;
        const dist = Math.hypot(target.x - holder.x, target.y - holder.y);
        const pressPenalty = this._nearDefenders(holder, defTeam) * 0.1;
        const passOk = Math.random() < (0.75 + (passSkill - 55) / 200 - dist * 0.5 - pressPenalty);
        if (passOk) {
          this._allEvents = this._allEvents || [];
          this._allEvents.push({ text: `👟 ${holder.name.split(' ').pop()} → ${target.name.split(' ').pop()}`, type: 'pass', min: `${min}'`, isMy: !!myAtk });
          state.ball.x = target.x; state.ball.y = target.y;
        } else {
          const def = defTeam[rand(1, defTeam.length - 1)];
          this._allEvents = this._allEvents || [];
          this._allEvents.push({ text: `🚫 拦截! ${def.name.split(' ').pop()}`, type: 'defense', min: `${min}'`, isMy: !myAtk });
          state.ball.x = def.x; state.ball.y = def.y;
          state.possession = myAtk ? 'opp' : 'my';
        }
        return;
      }
    }

    // 球在移动中
    const speed = Math.hypot(state.ball.vx, state.ball.vy);
    if (speed < 0.001) {
      // 球停下，随机给一方
      const receiver = (Math.random() < 0.5 ? state.my : state.opp)[rand(0, 9)];
      state.ball.x = receiver.x; state.ball.y = receiver.y;
      state.possession = receiver.isMy ? 'my' : 'opp';
    } else {
      state.ball.x += state.ball.vx / MATCH_FPS;
      state.ball.y += state.ball.vy / MATCH_FPS;
      state.ball.vx *= 0.85;
      state.ball.vy *= 0.85;
      // 边界反弹
      if (state.ball.x < 0.03) { state.ball.vx = Math.abs(state.ball.vx) * 0.5; state.ball.x = 0.03; }
      if (state.ball.x > 0.97) { state.ball.vx = -Math.abs(state.ball.vx) * 0.5; state.ball.x = 0.97; }
      if (state.ball.y < 0.05) { state.ball.vy = Math.abs(state.ball.vy) * 0.5; state.ball.y = 0.05; }
      if (state.ball.y > 0.95) { state.ball.vy = -Math.abs(state.ball.vy) * 0.5; state.ball.y = 0.95; }

      // 进攻方向趋势（根据双方实力差）
      const goalX = myAtk ? 0.97 : 0.03;
      const trendBias = (atkStr - defStr) * 0.001;
      state.ball.vx += (goalX - state.ball.x) * 0.03 + trendBias;
      state.ball.vy += (0.5 - state.ball.y) * 0.02;
    }

    // 球员跟随（简化：进攻方前压，防守方回撤）
    atkTeam.forEach((p, i) => {
      const target = {
        x: state.ball.x + (i % 3) * 0.08 * (myAtk ? 1 : -1),
        y: state.ball.y + (i - 2) * 0.1
      };
      target.x = Math.max(0.05, Math.min(0.95, target.x));
      target.y = Math.max(0.1, Math.min(0.9, target.y));
      this._moveToward(p, target, 0.08);
    });
    defTeam.forEach((p, i) => {
      const defLine = myAtk ? 0.4 : 0.6;
      const target = {
        x: Math.max(0.1, Math.min(0.9, state.ball.x * 0.5 + defLine)),
        y: state.ball.y + (i - 2) * 0.12
      };
      target.y = Math.max(0.1, Math.min(0.9, target.y));
      this._moveToward(p, target, 0.05);
    });

    state.ticks++;
  }

  _teamStrength(team, side) {
    return team.reduce((s, p) => s + (p.overall || 65), 0) / team.length;
  }

  _nearDefenders(player, defTeam) {
    return defTeam.filter(d => Math.hypot(d.x - player.x, d.y - player.y) < 0.15).length;
  }

  _moveToHome(players) {
    players.forEach(p => this._moveToward(p, { x: p.hx, y: p.hy }, 0.05));
  }

  _moveToward(p, target, speed) {
    const dx = target.x - p.x, dy = target.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.005) return;
    const pace = (p.pace || 70) / 10000;
    p.x += (dx / dist) * Math.min(speed, pace);
    p.y += (dy / dist) * Math.min(speed, pace);
    p.x = Math.max(0.03, Math.min(0.97, p.x));
    p.y = Math.max(0.05, Math.min(0.95, p.y));
  }

  // ---- 播放阶段（零 AI 计算）----
  start() {
    this.playing = true;
    this.playTick = 0;
    this.startTime = performance.now();
    this.lastEvtLen = 0;
    // 每个现实帧对应 gameTick 数
    // 270 game-mins × 60 = 16200 game-seconds
    // 16200 game-seconds / MATCH_REAL_SEC real-seconds = 180 game-sec/real-sec
    // 180 game-sec / MATCH_FPS ticks/sec = 36 ticks/real-sec
    this.ticksPerRealSec = (MATCH_DURATION * 60) / MATCH_REAL_SEC;
  }

  getCurrentFrame() {
    if (!this.playing || !this.frames.length) return null;
    const elapsed = (performance.now() - this.startTime) / 1000;
    const currentTick = Math.min(Math.floor(elapsed * this.ticksPerRealSec), this.frames.length - 1);
    return this.frames[currentTick];
  }

  getDisplayTime() {
    const frame = this.getCurrentFrame();
    if (!frame) return { min: 0, sec: 0 };
    return { min: frame.min, sec: frame.sec };
  }

  isFinished() {
    if (!this.playing) return false;
    const elapsed = (performance.now() - this.startTime) / 1000;
    return elapsed >= MATCH_REAL_SEC;
  }

  getRenderData() {
    const frame = this.getCurrentFrame();
    if (!frame) return null;
    const myEvents = (this.events || []).filter(e => {
      const evFrame = this.frames.findIndex(f => f.evt !== null && f.min === frame.min && f.sec >= frame.sec - 1);
      return true;
    });
    return {
      score: frame.score,
      min: frame.min,
      sec: frame.sec,
      phase: frame.phase,
      ball: frame.ball,
      players: [...frame.my, ...frame.opp],
      events: this.events,
      possession: frame.possession,
      stats: this.stats,
    };
  }
}
</script>

function getAvatar(player) {
  const seed = encodeURIComponent(player.name);
  return `https://api.dicebear.com/9.x/pixel-art/svg?seed=${seed}&backgroundColor=1a2030&radius=50`;

function generatePixelAvatar(player) {
  // Pixel art ID-photo style — face centered, ~60% canvas height
  const canvas = document.createElement('canvas');
  const SIZE = 256;
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  let seed = 0;
  for (let i = 0; i < player.name.length; i++) seed = (seed * 31 + player.name.charCodeAt(i)) >>> 0;
  function rng() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 0xFFFFFFFF; }
  function ri(min, max) { return Math.floor(rng() * (max - min + 1)) + min; }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }

  const skinMap = {
    England:()=>pick(['#F2D8B8','#EAC8A0','#F0D0A8']),
    Germany:()=>pick(['#F0D8B8','#ECD0A4']),
    Spain:()=>pick(['#D8A878','#C8906C']),
    France:()=>pick(['#D8A870','#C48860']),
    Brazil:()=>pick(['#B87040','#A06030']),
    Argentina:()=>pick(['#D4A078','#C49068']),
    Italy:()=>pick(['#D8B088','#C8A070']),
    Nigeria:()=>pick(['#5C2C0C','#4A2008']),
    Japan:()=>pick(['#E8D0A8','#D8C098']),
    Korea:()=>pick(['#E4CC9A','#D4BC88']),
    China:()=>pick(['#E0C8A0','#D0B888']),
    USA:()=>pick(['#D0A078','#C09070']),
  };
  const nat = player.nationality || player.nation || 'England';
  const skinBase = (skinMap[nat] || skinMap.England)();
  function adj(hex, amt) {
    const n = parseInt(hex.slice(1),16);
    const r=Math.min(255,Math.max(0,((n>>16)&0xff)+amt));
    const g=Math.min(255,Math.max(0,((n>>8)&0xff)+amt));
    const b=Math.min(255,Math.max(0,(n&0xff)+amt));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  const skinHi=adj(skinBase,22), skinShd=adj(skinBase,-22), skinDk=adj(skinBase,-40), skinDK2=adj(skinBase,-58);

  const hairPalettes=[
    ['#100804','#281408','#3C2010'],
    ['#281008','#4A2C14','#6A4020'],
    ['#4A2C10','#6A4820','#8A6430'],
    ['#6A4018','#907028','#B09040'],
    ['#9A7830','#C8A050','#E0C070'],
    ['#501408','#7A2818','#A04020'],
    ['#3C3C3C','#606060','#888888'],
  ];
  const [hairDrk,hairMid,hairLit]=hairPalettes[ri(0,hairPalettes.length-1)];
  const eyeCol=pick(['#2A4C8C','#1E5420','#6A3418','#404040','#3A6A8C','#8A5A18']);

  const P=4; // logical px -> canvas px
  function rpx(gx,gy,c,w=1,h=1){ctx.fillStyle=c;ctx.fillRect(gx*P,gy*P,w*P,h*P);}

  // Background: dark blue-grey (ID photo feel)
  ctx.fillStyle='#1a2030'; ctx.fillRect(0,0,SIZE,SIZE);

  // ── ID photo centering: head starts at ~y=18, chin at ~y=185 ──
  // Grid: 64x64 logical, P=4, canvas 256x256
  // Head: centered at x=32, chin at y=46 (chin canvas y=184), top at y=2 (y=8)
  const HGX=14, HGY=2, HW=36, HH=44; // head grid origin + size
  const HCX=HGX+HW/2; // head center x = 32

  // Shoulders (canvas y=188 to 256)
  const jc=pick(['#CC1111','#1133BB','#118811','#CC8800','#881188','#008899','#CC4400']);
  const jl=pick(['#EE3333','#2255DD','#22AA22','#EECC00','#AA22AA','#00AACC','#EE6600']);
  for(let cy=188;cy<256;cy+=P){
    const x0=Math.max(4, 20-(cy-188)/8);
    const x1=Math.min(60, 44+(cy-188)/8);
    for(let cx=x0;cx<x1;cx+=P) rpx(cx,(cy-188)/P,jc);
  }
  // Shoulder highlight
  for(let cy=188;cy<210;cy+=P){
    for(let cx=24;cx<38;cx+=P) rpx(cx,(cy-188)/P,jl);
  }

  // Neck
  for(let gy=40;gy<47;gy++){
    rpx(HGX+12,gy,skinDk); rpx(HGX+11,gy,skinDK2);
    rpx(HGX+HW-12,gy,skinHi); rpx(HGX+HW-11,gy,adj(skinHi,10));
    for(let gx=HGX+13;gx<HGX+HW-13;gx++) rpx(gx,gy,skinShd);
  }

  // ── Head oval ──
  // [leftOffset, rightOffset] from HGX for each gy
  const headShape=[];
  for(let i=0;i<HH;i++){
    const t=i/(HH-1); // 0=top, 1=chin
    const frac=Math.sin(t*Math.PI);
    const hw=Math.floor(HW/2*frac);
    headShape.push([HGX+(HW/2-hw), HGX+(HW/2+hw)]);
  }
  for(let i=0;i<HH;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx;gx<=rx;gx++){
      const dx=(gx-HCX)/(HW/2);
      let s;
      if(dx<-0.65)s=skinDK2;
      else if(dx<-0.25)s=skinDk;
      else if(dx<-0.05)s=skinShd;
      else if(dx>0.65)s=skinHi;
      else if(dx>0.25)s=adj(skinBase,14);
      else s=skinBase;
      if(i<4&&dx>-0.2&&dx<0.6)s=skinHi;
      if(i>HH-6)s=adj(skinShd,-10);
      rpx(gx,gy,s);
    }
  }

  // Ears
  for(let i=10;i<22;i++){
    rpx(HGX-2,i,skinDk); rpx(HGX-1,i,skinShd);
    rpx(HGX+HW+1,i,skinHi); rpx(HGX+HW,i,adj(skinHi,10));
  }

  // ── Hair ──
  const hStyle=ri(0,6);
  for(let i=0;i<HH;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx-2;gx<rx+3;gx++){
      if(gx<lx||gx>rx)rpx(gx,gy,hairDrk);
    }
  }
  for(let i=0;i<HH-4;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx;gx<rx;gx++){
      if(gx<lx+2||gx>rx-2)rpx(gx,gy,hairMid);
    }
  }
  for(let i=0;i<HH-8;i++){
    const gy=HGY+i, [lx,rx]=headShape[i];
    for(let gx=lx+HW*0.55;gx<rx-1;gx++){
      if(gx<lx+HW*0.6)rpx(gx,gy,hairLit);
    }
  }
  // Hairline
  const hairRow=HGY+HH*0.2|0;
  for(let gx=HGX;gx<HGX+HW;gx++){
    const [lx,rx]=headShape[hairRow-HGY];
    if(gx<lx+2||gx>rx-2)rpx(gx,hairRow,hairDrk);
  }

  if(hStyle===1){// buzz cut
    for(let gx=HGX;gx<HGX+HW;gx++){
      const hi=headShape[HH*0.15|0];
      if(gx<hi[0]+1||gx>hi[1]-1)rpx(gx,HGY+HH*0.15|0,adj(hairDrk,-12));
    }
  } else if(hStyle===2){// quiff
    for(let gx=HGX+HW*0.35;gx<HGX+HW*0.65;gx++)rpx(gx,HGY-2,hairLit);
    for(let gx=HGX+HW*0.3;gx<HGX+HW*0.7;gx++)rpx(gx,HGY-1,hairMid);
  } else if(hStyle===3){// longer sides
    for(let i=HH*0.25|0;i<HH;i++){rpx(HGX-2,i,hairMid);rpx(HGX-3,i,hairDrk);rpx(HGX+HW+2,i,hairMid);rpx(HGX+HW+3,i,hairDrk);}
  } else if(hStyle===4){// fade
    for(let gx=HGX;gx<HGX+HW;gx++){
      const hi=headShape[HH*0.15|0];
      const f=gx<hi[0]+4?-25:(gx>hi[1]-4?-25:0);
      if(gx<hi[0]+2||gx>hi[1]-2)rpx(gx,HGY+HH*0.15|0,adj(hairDrk,f));
    }
  }

  // ── Eyebrows ──
  const browCol=adj(hairMid,-15);
  const browY=HGY+HH*0.32|0;
  for(let gx=HGX+HW*0.18;gx<HGX+HW*0.42;gx++)rpx(gx,browY,browCol);
  for(let gx=HGX+HW*0.58;gx<HGX+HW*0.82;gx++)rpx(gx,browY,browCol);
  rpx(HGX+HW*0.18,browY+1,browCol);rpx(HGX+HW*0.82,browY+1,browCol);

  // ── Eyes ──
  const EY=HGY+HH*0.37|0, EH=EY+4;
  for(let gx=HGX+HW*0.18;gx<HGX+HW*0.43;gx++)rpx(gx,EY,adj(skinBase,-12));
  for(let gx=HGX+HW*0.57;gx<HGX+HW*0.82;gx++)rpx(gx,EY,adj(skinBase,-12));
  for(let gx=HGX+HW*0.18;gx<HGX+HW*0.43;gx++)rpx(gx,EH,adj(skinBase,-8));
  for(let gx=HGX+HW*0.57;gx<HGX+HW*0.82;gx++)rpx(gx,EH,adj(skinBase,-8));
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.2;gx<HGX+HW*0.4;gx++)rpx(gx,gy,'#D8D4CC');
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.6;gx<HGX+HW*0.8;gx++)rpx(gx,gy,'#D8D4CC');
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.21;gx<HGX+HW*0.39;gx++)rpx(gx,gy,eyeCol);
  for(let gy=EY+1;gy<EH;gy++)for(let gx=HGX+HW*0.61;gx<HGX+HW*0.79;gx++)rpx(gx,gy,eyeCol);
  for(let gy=EY+2;gy<EH-1;gy++)for(let gx=HGX+HW*0.24;gx<HGX+HW*0.36;gx++)rpx(gx,gy,'#080604');
  for(let gy=EY+2;gy<EH-1;gy++)for(let gx=HGX+HW*0.64;gx<HGX+HW*0.76;gx++)rpx(gx,gy,'#080604');
  rpx(HGX+HW*0.24,EY+1,'#FFFFFF');rpx(HGX+HW*0.64,EY+1,'#FFFFFF');

  // ── Nose ──
  const NY=EH+2;
  rpx(HCX-2,NY,skinShd);rpx(HCX+2,NY,skinShd);
  rpx(HCX-3,NY+1,skinDk);rpx(HCX+3,NY+1,skinDk);
  rpx(HCX-4,NY+2,skinDK2);rpx(HCX+4,NY+2,skinDK2);
  rpx(HCX-3,NY+2,skinShd);rpx(HCX+3,NY+2,skinShd);
  rpx(HCX-4,NY+3,skinDk);rpx(HCX+4,NY+3,skinDk);
  rpx(HCX-3,NY+3,skinBase);rpx(HCX+3,NY+3,skinBase);

  // ── Mouth ──
  const MY=NY+4;
  const lc=adj(skinBase,-24),lc2=adj(skinBase,-10);
  for(let gx=HGX+HW*0.32;gx<HGX+HW*0.68;gx++)rpx(gx,MY,lc);
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+1,lc2);
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+2,lc);
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+3,lc2);
  rpx(HGX+HW*0.36,MY+3,adj(lc2,20));rpx(HGX+HW*0.38,MY+3,adj(lc2,24));
  rpx(HGX+HW*0.62,MY+3,adj(lc2,20));rpx(HGX+HW*0.64,MY+3,adj(lc2,16));
  for(let gx=HGX+HW*0.34;gx<HGX+HW*0.66;gx++)rpx(gx,MY+4,adj(skinBase,-20));

  // ── Stubble ──
  if(rng()>0.4){
    ctx.globalAlpha=0.3;
    for(let gy=HGY+HH*0.55;gy<HGY+HH*0.82;gy++)for(let gx=HGX+HW*0.15;gx<HGX+HW*0.85;gx++){
      if((gx*7+gy*13+seed)%7===0)rpx(gx,gy,adj(hairMid,5));
    }
    ctx.globalAlpha=1;
  }

  return canvas.toDataURL('image/png');
}

// ============================================================
// LPC 千人千面球员渲染器 - 主游戏集成
// 使用 LPC Spritesheet Character Generator
// ============================================================

// 全局 LPC 生成器实例
let lpcGenerator = null;

/**
 * 初始化 LPC 球员渲染
 * @param {Object} player - 球员数据
 * @param {string} containerId - 容器元素 ID
 */
async function initLPCPlayer(player, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  
  // 防止重复初始化
  if (container.dataset.lpcLoading === '1') return;
  container.dataset.lpcLoading = '1';
  
  container.innerHTML = '';
  
  // 检查 LPC 渲染器是否可用
  if (typeof LPCPlayerGenerator === 'undefined') {
    console.warn('[LPC] 渲染器未加载，回退到 Three.js');
    initVoxelPlayer(player, containerId);
    return;
  }
  
  // 初始化生成器
  if (!lpcGenerator) {
    lpcGenerator = new LPCPlayerGenerator();
  }
  
  // 球队颜色（根据球员所属球队）
  const isMy = !!player.isMy;
  const teamData = {
    primaryColor: isMy ? 'red' : 'blue',
    secondaryColor: 'white',
    bootsColor: 'black'
  };
  
  // 球员数据转换
  const playerData = {
    id: player.id || player.name,
    name: player.name || 'Player',
    position: player.position || 'MID',
    jerseyNumber: player.num || player.shirtNumber || 10,
    // 根据国籍决定肤色倾向
    nationality: player.nationality || player.region || 'England',
    // 体型（根据身高体重）
    bodyType: (player.height > 185 && player.weight > 80) ? 'muscular' : 
              (player.height < 175) ? 'teen' : 'male'
  };
  
  try {
    // 生成外观配置
    const appearance = lpcGenerator.generateAppearance(playerData, teamData);
    
    // 生成精灵 Canvas (idle 动画, direction=3 正面视角)
    const spriteCanvas = await lpcGenerator.generatePlayerSprite(appearance, 'idle', 3, false);
    
    // 创建球员卡片
    const cardCanvas = document.createElement('canvas');
    cardCanvas.width = 200;
    cardCanvas.height = 320;
    const ctx = cardCanvas.getContext('2d');
    
    // 背景（球队颜色渐变）
    const teamColor = lpcGenerator.hexToTeamColor(teamData.primaryColor);
    const gradient = ctx.createLinearGradient(0, 0, 0, cardCanvas.height);
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(1, '#0f0f1a');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, cardCanvas.width, cardCanvas.height);
    
    // 球队颜色边框
    ctx.strokeStyle = teamColor;
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, cardCanvas.width - 4, cardCanvas.height - 4);
    
    // 绘制球员精灵 (放大 3x)
    ctx.imageSmoothingEnabled = false; // 像素风格
    const scale = 3;
    const spriteWidth = 64 * scale;
    const spriteHeight = 64 * scale;
    const spriteX = (cardCanvas.width - spriteWidth) / 2;
    const spriteY = 60;
    ctx.drawImage(spriteCanvas, spriteX, spriteY, spriteWidth, spriteHeight);
    
    // 球员名字
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(playerData.name, cardCanvas.width / 2, cardCanvas.height - 80);
    
    // 位置
    ctx.font = '13px Arial';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(playerData.position, cardCanvas.width / 2, cardCanvas.height - 60);
    
    // OVR 评分
    const ovr = player.ovr || 70;
    ctx.font = 'bold 28px Arial';
    ctx.fillStyle = ovr >= 80 ? '#00d4ff' : ovr >= 70 ? '#22c55e' : '#fbbf24';
    ctx.fillText(String(ovr), cardCanvas.width / 2, cardCanvas.height - 30);
    
    // 球衣号码
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = teamColor;
    ctx.textAlign = 'right';
    ctx.fillText(`#${playerData.jerseyNumber}`, cardCanvas.width - 15, 30);
    
    // 添加到容器
    container.appendChild(cardCanvas);
    container.dataset.lpcLoading = '2'; // 标记加载完成
    
    // 添加轻微呼吸动画
    let breathOffset = 0;
    function animate() {
      breathOffset += 0.05;
      const bounce = Math.sin(breathOffset) * 2;
      
      // 重绘精灵
      ctx.fillStyle = gradient;
      ctx.fillRect(spriteX, spriteY - 5, spriteWidth, spriteHeight + 10);
      ctx.drawImage(spriteCanvas, spriteX, spriteY + bounce, spriteWidth, spriteHeight);
      
      requestAnimationFrame(animate);
    }
    animate();
    
  } catch (e) {
    console.error('[LPC] 渲染失败:', e);
    container.dataset.lpcLoading = '0'; // 重置锁，允许重试
    // 回退到 Three.js
    initVoxelPlayer(player, containerId);
  }
}

function getVoxelPlayer(player, containerId) {
  return `<div id="${containerId}" data-player='${JSON.stringify(player).replace(/'/g,"&apos;")}' style="width:200px;height:320px;margin:0 auto;"></div>`;
}

// ============================================================
// 千人千面 3D 体素球员生成器
// 参数来自球员属性：身高、体重、力量、肤色(姓名hash)、发型、发色、眼睛
// ============================================================

// 用姓名/ID 生成稳定的伪随机数（0–1）
function playerHash(val, salt=0) {
  let h = 2166136261;
  const str = String(val) + salt;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return (h >>> 0) / 0xFFFFFFFF;
}

// 从 hash 取整数
function hInt(val, salt, min, max) {
  return min + Math.floor(playerHash(val, salt) * (max - min + 1));
}

// 颜色辅助：hex 颜色加深/变浅
function shadeColor(hex, percent) {
  if(!hex || hex[0]!='#') return '#888888';
  var num = parseInt(hex.slice(1), 16);
  var r = Math.min(255, Math.max(0, ((num>>16)&0xFF) + percent));
  var g = Math.min(255, Math.max(0, ((num>>8)&0xFF) + percent));
  var b = Math.min(255, Math.max(0, (num&0xFF) + percent));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}



// ---- 肤色调色盘（按地区细分）----
const SKIN_PALETTES = [
  ['#FFDFC4','#F0D0A8','#E8C090'],  // 浅肤色
  ['#F2D8B8','#E0C0A0','#D0A888'],  // 白人/欧洲
  ['#D8A878','#C89868','#B88858'],  // 地中海
  ['#B87040','#A06030','#8A5030'],  // 拉丁/中东
  ['#8C5C30','#7A4A28','#683820'],  // 深棕
  ['#5C3010','#4A2408','#3A1800'],  // 深棕/非洲
  ['#E8D0A8','#D8B888','#C8A870'],  // 东亚浅
  ['#C8A060','#B89050','#A88040'],  // 东亚
];

// ---- 发色调色盘 ----
const HAIR_COLORS = [
  {r:30,g:15,b:5},   // 黑色
  {r:45,g:25,b:8},   // 深棕
  {r:90,g:55,b:18},  // 棕色
  {r:160,g:110,b:50},// 金色
  {r:130,g:75,b:30}, // 红棕色
  {r:75,g:45,b:20},  // 深红
  {r:20,g:18,b:15},  // 近黑
  {r:200,g:185,b:150},// 浅金/白
];

// ---- 发型（用 canvas 画） ----
// hairStyle: 0=短发, 1=短发+刘海, 2=卷发, 3=莫西干, 4=光头, 5=侧分, 6=平头, 7=长发
const HAIR_STYLES = ['short','fringe','curly','mohawk','bald','side','buzz','long'];

// 画球员面部纹理（canvas → THREE.CanvasTexture）
function drawFaceTexture(faceW, faceH, skinIdx, hairIdx, hairColor, eyeColor, hash, faceWFactor) {
  // 512px 高清面部纹理（比之前的240px细节多4倍）
  const W = 512, H = 512;
  const cvs = document.createElement('canvas');
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = true;

  // 皮肤渐变
  const skin = SKIN_PALETTES[skinIdx % SKIN_PALETTES.length];
  const grad = ctx.createRadialGradient(W*0.42, H*0.35, 0, W*0.5, H*0.5, W*0.55);
  grad.addColorStop(0, skin[0]);
  grad.addColorStop(0.6, skin[1]);
  grad.addColorStop(1, skin[2]);
  ctx.fillStyle = grad;

  // 头型（椭圆，faceWFactor 调整宽窄）
  const cx = W/2, cy = H/2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, W/2 * faceWFactor, H/2, 0, 0, Math.PI * 2);
  ctx.fill();

  // ---- 面部轮廓细节 ----
  // 颧骨阴影（让脸更有立体感）
  const cheekL = ctx.createRadialGradient(W*0.22, H*0.48, 0, W*0.22, H*0.48, W*0.14);
  cheekL.addColorStop(0, 'rgba(0,0,0,0.08)'); cheekL.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cheekL;
  ctx.beginPath(); ctx.ellipse(W*0.22, H*0.48, W*0.12, H*0.10, 0, 0, Math.PI*2); ctx.fill();
  const cheekR = ctx.createRadialGradient(W*0.78, H*0.48, 0, W*0.78, H*0.48, W*0.14);
  cheekR.addColorStop(0, 'rgba(0,0,0,0.08)'); cheekR.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cheekR;
  ctx.beginPath(); ctx.ellipse(W*0.78, H*0.48, W*0.12, H*0.10, 0, 0, Math.PI*2); ctx.fill();

  // 下颌阴影
  const jawSh = ctx.createRadialGradient(cx, H*0.72, 0, cx, H*0.72, W*0.35);
  jawSh.addColorStop(0, 'rgba(0,0,0,0)'); jawSh.addColorStop(1, 'rgba(0,0,0,0.10)');
  ctx.fillStyle = jawSh;
  ctx.beginPath(); ctx.ellipse(cx, cy, W/2 * faceWFactor, H/2, 0, 0, Math.PI*2); ctx.fill();

  // 耳朵（大小/位置/露出程度由 hash 决定）
  const earW = W*0.10, earH = H*0.20;
  const earSize  = 0.6 + playerHash(hash, 91) * 0.6; // 0.6~1.2倍
  const earAngle  = (playerHash(hash, 93) - 0.5) * 0.3;
  const earLShow = playerHash(hash, 91) > 0.2;
  const earRShow = playerHash(hash, 92) > 0.2;
  ctx.fillStyle = skin[1];
  if (earLShow) {
    ctx.save(); ctx.translate(W*0.07, cy - H*0.03); ctx.rotate(earAngle);
    ctx.beginPath(); ctx.ellipse(0, 0, earW*earSize/2, earH*earSize/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if (earRShow) {
    ctx.save(); ctx.translate(W*0.93, cy - H*0.03); ctx.rotate(-earAngle);
    ctx.beginPath(); ctx.ellipse(0, 0, earW*earSize/2, earH*earSize/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ---- 画头发 ----
  _drawHair(ctx, W, H, hairIdx, hairColor, skin, faceWFactor, hash);

  // ---- 眉毛（形状/颜色/角度全部千人千面）----
  const browThick = 5 + playerHash(hash, 80) * 6; // 5~11px
  const browAngleL = (playerHash(hash, 81) - 0.5) * 0.5;
  const browAngleR = (playerHash(hash, 82) - 0.5) * 0.5;
  const browLen   = W * (0.10 + playerHash(hash, 86) * 0.04);
  const browCurve = (playerHash(hash, 87) - 0.5) * 0.05; // 拱形程度
  const browColor = `rgba(${Math.round(hairColor.r*0.65)},${Math.round(hairColor.g*0.65)},${Math.round(hairColor.b*0.65)},0.85)`;
  const browY0 = cy - H*0.19, browY1 = browY0 + browCurve * H;
  ctx.strokeStyle = browColor; ctx.lineWidth = browThick; ctx.lineCap = 'round';
  ctx.save(); ctx.translate(cx - W*0.19, browY0); ctx.rotate(browAngleL);
  ctx.beginPath(); ctx.moveTo(-browLen, browCurve*H*0.5); ctx.quadraticCurveTo(0, -browCurve*H, browLen, browCurve*H*0.5); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(cx + W*0.19, browY0); ctx.rotate(browAngleR);
  ctx.beginPath(); ctx.moveTo(-browLen, browCurve*H*0.5); ctx.quadraticCurveTo(0, -browCurve*H, browLen, browCurve*H*0.5); ctx.stroke(); ctx.restore();

  // ---- 眼睛（大小/形状/眼神 千人千面）----
  const eyeSep = W * (0.24 + playerHash(hash, 70) * 0.06); // 眼距变化
  const eyeW   = W * (0.11 + playerHash(hash, 71) * 0.05);
  const eyeH   = eyeW * (0.30 + playerHash(hash, 72) * 0.20); // 杏眼/圆眼
  const eyeYOff = (playerHash(hash, 73) - 0.5) * H * 0.03; // 眼睛高低
  const eyeY    = cy - H*0.06 + eyeYOff;
  // 眼白
  ctx.fillStyle = '#FAFAFA';
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2, eyeY, eyeW/2, eyeH/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2, eyeY, eyeW/2, eyeH/2, 0, 0, Math.PI*2); ctx.fill();
  // 眼眶线（让眼睛更有轮廓）
  ctx.strokeStyle = skin[2]; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2, eyeY, eyeW/2, eyeH/2, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2, eyeY, eyeW/2, eyeH/2, 0, 0, Math.PI*2); ctx.stroke();
  // 虹膜（7种颜色组合）
  const irisColors = ['#2C1206','#1A2C08','#081830','#281428','#0C1C1C','#2A1408','#3A2810'];
  const irisIdx = hInt(hash, 74, 0, irisColors.length-1);
  const irisR = eyeW * (0.32 + playerHash(hash, 75) * 0.08);
  ctx.fillStyle = irisColors[irisIdx];
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2, eyeY, irisR, irisR*1.05, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2, eyeY, irisR, irisR*1.05, 0, 0, Math.PI*2); ctx.fill();
  // 瞳孔（偏心，模拟自然眼神）
  const pupilOffX = (playerHash(hash, 76) - 0.5) * irisR * 0.3;
  const pupilOffY = (playerHash(hash, 77) - 0.5) * irisR * 0.2;
  const pupilR = irisR * 0.42;
  ctx.fillStyle = '#0A0806';
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2 + pupilOffX, eyeY + pupilOffY, pupilR, pupilR, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2 + pupilOffX, eyeY + pupilOffY, pupilR, pupilR, 0, 0, Math.PI*2); ctx.fill();
  // 眼神光（两个高光点，更有神）
  const hlR = irisR * 0.22;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2 + irisR*0.15, eyeY - irisR*0.25, hlR, hlR*0.8, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2 + irisR*0.15, eyeY - irisR*0.25, hlR, hlR*0.8, 0, 0, Math.PI*2); ctx.fill();
  // 小高光
  ctx.fillStyle = 'rgba(255,255,255,0.60)';
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2 - irisR*0.2, eyeY + irisR*0.15, hlR*0.5, hlR*0.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2 - irisR*0.2, eyeY + irisR*0.15, hlR*0.5, hlR*0.4, 0, 0, Math.PI*2); ctx.fill();
  // 眼睑（上眼皮弧线，更有神）
  ctx.strokeStyle = skin[2]; ctx.lineWidth = 2.0;
  ctx.beginPath(); ctx.ellipse(cx - eyeSep/2, eyeY, eyeW/2, eyeH/2, 0, Math.PI, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + eyeSep/2, eyeY, eyeW/2, eyeH/2, 0, Math.PI, Math.PI*2); ctx.stroke();

  // ---- 睫毛（女性/部分男性可选）----
  const lash = playerHash(hash, 78) > 0.75;
  if (lash) {
    ctx.strokeStyle = `rgba(${Math.round(hairColor.r*0.4)},${Math.round(hairColor.g*0.4)},${Math.round(hairColor.b*0.4)},0.7)`;
    ctx.lineWidth = 1.5;
    for (let i=0; i<5; i++) {
      const a0 = Math.PI + i*Math.PI*0.08;
      const a1 = Math.PI + (i+1)*Math.PI*0.08;
      const x0=cx-eyeSep/2+Math.cos(a0)*eyeW/2, y0=eyeY+Math.sin(a0)*eyeH/2;
      const x1=cx-eyeSep/2+Math.cos(a1)*eyeW/2, y1=eyeY+Math.sin(a1)*eyeH/2;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1-Math.PI*2); ctx.stroke();
    }
  }

  // ---- 鼻子（形状变化）----
  const noseY = cy + H*0.04;
  const noseBridge = 1.0 + playerHash(hash, 83) * 0.8; // 鼻梁高低
  const noseW   = W * (0.05 + playerHash(hash, 84) * 0.05); // 鼻翼宽窄
  const noseType = hInt(hash, 89, 0, 2); // 0=直鼻 1=鹰钩 2=翘鼻
  ctx.strokeStyle = skin[2]; ctx.lineWidth = 1.5;
  if (noseType === 0) {
    // 直鼻：鼻梁线
    ctx.beginPath(); ctx.moveTo(cx, cy + H*0.01); ctx.lineTo(cx, noseY); ctx.stroke();
  } else if (noseType === 1) {
    // 鹰钩：弧线
    ctx.beginPath(); ctx.moveTo(cx, cy + H*0.01); ctx.quadraticCurveTo(cx+noseW*0.5, cy+H*0.06, cx+noseW*0.3, noseY+noseW*0.3); ctx.stroke();
  } else {
    // 翘鼻：短鼻梁+翘鼻尖
    ctx.beginPath(); ctx.moveTo(cx, cy + H*0.01); ctx.lineTo(cx+noseW*0.2, noseY+noseW*0.2); ctx.stroke();
  }
  // 鼻翼
  ctx.beginPath(); ctx.arc(cx - noseW/2, noseY, noseW/2.5, 0, Math.PI*2); ctx.fillStyle = skin[1]; ctx.fill();
  ctx.beginPath(); ctx.arc(cx + noseW/2, noseY, noseW/2.5, 0, Math.PI*2); ctx.fill();
  // 鼻孔（用深色小圆）
  ctx.fillStyle = 'rgba(80,40,20,0.5)';
  ctx.beginPath(); ctx.ellipse(cx - noseW*0.6, noseY + noseW*0.15, noseW*0.12, noseW*0.18, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + noseW*0.6, noseY + noseW*0.15, noseW*0.12, noseW*0.18, 0, 0, Math.PI*2); ctx.fill();

  // ---- 嘴巴（形状+弧度 千人千面）----
  const mouthY  = cy + H*0.22;
  const mouthW  = W * (0.13 + playerHash(hash, 85) * 0.09);
  const smile   = (playerHash(hash, 86) - 0.5) * 0.20; // -0.1~+0.1，微笑/严肃
  const lipFull = playerHash(hash, 87) * 0.5; // 嘴唇厚薄
  // 上唇线
  ctx.strokeStyle = `rgba(${Math.round(hairColor.r*0.75)},${Math.round(hairColor.g*0.40)},${Math.round(hairColor.b*0.25)},0.85)`;
  ctx.lineWidth = 3 + lipFull * 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, mouthY + smile*H*0.3, mouthW/2, 0.1, Math.PI - 0.1); ctx.stroke();
  // 下唇（饱满感）
  const lipGrad = ctx.createRadialGradient(cx, mouthY + H*0.025, 0, cx, mouthY + H*0.025, mouthW*0.35);
  lipGrad.addColorStop(0, `rgba(${Math.round(hairColor.r*0.5+100)},${Math.round(hairColor.g*0.3+60)},${Math.round(hairColor.b*0.2+40)},0.35)`);
  lipGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lipGrad;
  ctx.beginPath(); ctx.ellipse(cx, mouthY + H*0.025, mouthW*0.45, H*0.025+lipFull*H*0.008, 0, 0, Math.PI*2); ctx.fill();
  // 嘴角下垂（严肃表情）
  if (playerHash(hash, 88) > 0.7) {
    ctx.strokeStyle = skin[2]; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - mouthW/2, mouthY); ctx.lineTo(cx - mouthW/2 - W*0.015, mouthY + H*0.015); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + mouthW/2, mouthY); ctx.lineTo(cx + mouthW/2 + W*0.015, mouthY + H*0.015); ctx.stroke();
  }

  // ---- 美人穴（可选）----
  if (playerHash(hash, 95) > 0.8) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(cx + W*0.04, cy + H*0.06, W*0.012, H*0.018, 0, 0, Math.PI*2); ctx.fill();
  }

  // ---- 胡茬阴影（男性球员可选，增加成熟感）----
  if (playerHash(hash, 96) > 0.5) {
    const beardGrad = ctx.createRadialGradient(cx, cy + H*0.28, 0, cx, cy + H*0.28, W*0.3);
    beardGrad.addColorStop(0, `rgba(${hairColor.r*0.3|0},${hairColor.g*0.3|0},${hairColor.b*0.3|0},0.08)`);
    beardGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = beardGrad;
    ctx.beginPath(); ctx.ellipse(cx, cy + H*0.28, W*0.3, H*0.15, 0, 0, Math.PI*2); ctx.fill();
  }

  return new THREE.CanvasTexture(cvs);
}

// 在 ctx 上画头发
function _drawHair(ctx, W, H, hairIdx, hairColor, skin, faceWFactor, hash) {
  const cx = W/2, cy = H/2;
  const hair = `rgb(${hairColor.r},${hairColor.g},${hairColor.b})`;
  const hairDark = `rgb(${Math.round(hairColor.r*0.6)},${Math.round(hairColor.g*0.6)},${Math.round(hairColor.b*0.6)})`;

  switch(hairIdx % 8) {
    case 0: // 短发
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.ellipse(cx, H*0.22, W*0.48*faceWFactor, H*0.18, 0, Math.PI, Math.PI*2);
      ctx.fill();
      // 纹理线条
      ctx.strokeStyle = hairDark; ctx.lineWidth = 1;
      for(let i=-3;i<=3;i++){
        ctx.beginPath();
        ctx.moveTo(cx+i*W*0.06, H*0.1);
        ctx.lineTo(cx+i*W*0.05, H*0.22);
        ctx.stroke();
      }
      break;
    case 1: // 刘海
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.ellipse(cx, H*0.22, W*0.5*faceWFactor, H*0.2, 0, Math.PI, Math.PI*2);
      ctx.fill();
      // 刘海下垂
      ctx.beginPath();
      ctx.moveTo(cx-W*0.3, H*0.18);
      ctx.quadraticCurveTo(cx-W*0.15, H*0.28, cx-W*0.05, H*0.35);
      ctx.lineTo(cx+W*0.05, H*0.35);
      ctx.quadraticCurveTo(cx+W*0.15, H*0.28, cx+W*0.3, H*0.18);
      ctx.fill();
      break;
    case 2: // 卷发/爆炸头
      ctx.fillStyle = hair;
      for(let i=0;i<24;i++){
        const angle = (i/24)*Math.PI*2;
        const r = W*(0.35 + playerHash(hash, i+100)*0.18);
        const px = cx + Math.cos(angle)*r*0.7;
        const py = H*0.18 + Math.sin(angle)*r*0.5;
        ctx.beginPath();
        ctx.arc(px, py, W*(0.12+playerHash(hash,i+130)*0.08), 0, Math.PI*2);
        ctx.fill();
      }
      break;
    case 3: // 莫西干
      ctx.fillStyle = hair;
      for(let i=0;i<8;i++){
        const px = cx + (i-3.5)*W*0.07;
        const ph = H*(0.35+i*0.04);
        ctx.beginPath();
        ctx.moveTo(px-W*0.04, H*0.3);
        ctx.lineTo(px, H*0.3-ph);
        ctx.lineTo(px+W*0.04, H*0.3);
        ctx.fill();
      }
      break;
    case 4: // 光头
      // 无头发，加亮头顶模拟光泽
      const shine = ctx.createRadialGradient(cx-W*0.1, H*0.2, 0, cx, H*0.25, W*0.3);
      shine.addColorStop(0, 'rgba(255,255,255,0.15)');
      shine.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = shine;
      ctx.beginPath(); ctx.ellipse(cx, cy, W/2*faceWFactor, H/2, 0, 0, Math.PI*2); ctx.fill();
      break;
    case 5: // 侧分
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.ellipse(cx, H*0.22, W*0.5*faceWFactor, H*0.2, 0, Math.PI, Math.PI*2);
      ctx.fill();
      // 分缝线
      ctx.strokeStyle = hairDark; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx+W*0.02, H*0.05);
      ctx.lineTo(cx-W*0.05, H*0.3);
      ctx.stroke();
      break;
    case 6: // 平头（很短）
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.ellipse(cx, H*0.24, W*0.47*faceWFactor, H*0.15, 0, Math.PI, Math.PI*2);
      ctx.fill();
      break;
    case 7: // 长发
      ctx.fillStyle = hair;
      ctx.beginPath();
      ctx.ellipse(cx, H*0.2, W*0.5*faceWFactor, H*0.18, 0, Math.PI, Math.PI*2);
      ctx.fill();
      // 两侧下垂
      ctx.beginPath();
      ctx.moveTo(cx-W*0.42, H*0.2);
      ctx.lineTo(cx-W*0.45, H*0.65);
      ctx.lineTo(cx-W*0.3, H*0.65);
      ctx.lineTo(cx-W*0.3, H*0.22);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx+W*0.42, H*0.2);
      ctx.lineTo(cx+W*0.45, H*0.65);
      ctx.lineTo(cx+W*0.3, H*0.65);
      ctx.lineTo(cx+W*0.3, H*0.22);
      ctx.fill();
      break;
  }
}

var voxelScenes = window.voxelScenes || {};

// 模型缓存（避免重复加载）
var modelCache = {};

function initVoxelPlayer(player, containerId) {
  var container = document.getElementById(containerId);
  if(!container) return;
  container.innerHTML = '';

  // ---- 球员属性 ----
  var ovr = player.ovr || 70, isMy = !!player.isMy;
  var pNum = player.num || 10;
  var nm = player.name || 'Player';

  // ---- 随机种子 ----
  var seed = 0;
  for(var si=0; si<nm.length; si++) seed = (seed * 31 + nm.charCodeAt(si)) >>> 0;
  function rng() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 0xFFFFFFFF; }
  function ri(min, max) { return Math.floor(rng() * (max - min + 1)) + min; }

  // ---- 球衣颜色 ----
  var kitColor = isMy ? 0xDC2233 : 0x1133BB;
  var kitColorLight = isMy ? 0xFF4455 : 0x3366EE;

  // ---- Three.js 场景 ----
  var W = 200, H = 320;
  var scene = new THREE.Scene();

  // ---- 相机 ----
  var camera = new THREE.PerspectiveCamera(45, W/H, 0.01, 100);
  camera.position.set(0, 0.3, 1.8);
  camera.lookAt(0, 0.15, 0);

  // ---- 渲染器 ----
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // ---- 灯光 ----
  var mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
  mainLight.position.set(3, 4, 2);
  mainLight.castShadow = true;
  scene.add(mainLight);

  var fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
  fillLight.position.set(-2, 2, 1);
  scene.add(fillLight);

  var rimLight = new THREE.DirectionalLight(0x88ccff, 0.4);
  rimLight.position.set(0, 1, -2);
  scene.add(rimLight);

  var ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  // ---- 球员组 ----
  var playerGroup = new THREE.Group();
  scene.add(playerGroup);

  // ---- 地面阴影 ----
  var groundGeo = new THREE.PlaneGeometry(2, 2);
  var groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---- 加载 FBX 模型 ----
  var fbxLoader = new THREE.FBXLoader();
  var MODEL_URL = 'models/player.fbx';

  // 检查缓存
  if(modelCache[MODEL_URL]) {
    var clonedModel = modelCache[MODEL_URL].clone();
    applyPlayerStyle(clonedModel, kitColor, kitColorLight);
    playerGroup.add(clonedModel);
    startAnimation(clonedModel);
  } else {
    fbxLoader.load(MODEL_URL, function(object) {
      // 缓存模型
      modelCache[MODEL_URL] = object.clone();
      
      // 应用样式
      applyPlayerStyle(object, kitColor, kitColorLight);
      playerGroup.add(object);
      
      // 开始动画
      startAnimation(object);
    }, undefined, function(error) {
      console.error('FBX Load Error:', error);
      // 回退到几何体
      createFallbackPlayer(playerGroup, kitColor);
    });
  }

  // ---- 应用球员样式 ----
  function applyPlayerStyle(model, kitColor, kitColorLight) {
    // 缩放（Mixamo 模型以 cm 为单位，缩小到 ~175cm 实际身高）
    model.scale.setScalar(0.025);
    
    // 遍历所有网格应用材质
    model.traverse(function(child) {
      if(child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        
        // 根据原始材质颜色区分不同部位
        var color = child.material && child.material.color ? child.material.color.getHex() : null;
        
        if(color !== null) {
          // 皮肤色（约 #CCA881 或类似）
          if(color > 0x8B6914 && color < 0xFFDFBF) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xD4A574, roughness: 0.8, metalness: 0
            });
          }
          // 衣服/短裤（深色）
          else if(color < 0x444444) {
            child.material = new THREE.MeshStandardMaterial({
              color: kitColor, roughness: 0.6, metalness: 0
            });
          }
          // 鞋子
          else if(color < 0x222222) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0x1a1a1a, roughness: 0.5, metalness: 0.1
            });
          }
        }
      }
    });

    // 居中模型
    var box = new THREE.Box3().setFromObject(model);
    var center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    model.position.y += 0.3; // 稍微抬高
  }

  // ---- 回退：几何体球员 ----
  function createFallbackPlayer(group, kitColor) {
    var mat = new THREE.MeshStandardMaterial({ color: kitColor });
    // 使用兼容所有版本的胶囊体（2个半球 + 1个圆柱）
    var bodyMat = new THREE.MeshStandardMaterial({ color: kitColor });
    var legMat  = new THREE.MeshStandardMaterial({ color: 0x222222 });
    // 躯干（椭球形）
    var torso = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), bodyMat);
    torso.scale.y = 1.5;
    torso.position.y = 0.75;
    torso.castShadow = true;
    group.add(torso);
    // 左腿
    var legL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 8), legMat);
    legL.position.set(-0.1, 0.3, 0);
    legL.castShadow = true;
    group.add(legL);
    // 右腿
    var legR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 8), legMat);
    legR.position.set(0.1, 0.3, 0);
    legR.castShadow = true;
    group.add(legR);
    // 左脚
    var footL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), legMat);
    footL.scale.set(1.2, 0.5, 1.5);
    footL.position.set(-0.1, 0.02, 0.05);
    group.add(footL);
    // 右脚
    var footR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), legMat);
    footR.scale.set(1.2, 0.5, 1.5);
    footR.position.set(0.1, 0.02, 0.05);
    group.add(footR);
  }

  // ---- 动画循环 ----
  var animAngle = 0;
  function startAnimation(model) {
    function animate() {
      requestAnimationFrame(animate);
      
      // 轻微旋转
      animAngle += 0.003;
      playerGroup.rotation.y = Math.sin(animAngle) * 0.2;
      
      renderer.render(scene, camera);
    }
    animate();
  }

  // ---- 信息面板 ----
  var infoCanvas = document.createElement('canvas');
  infoCanvas.width = W;
  infoCanvas.height = H;
  infoCanvas.style.position = 'absolute';
  infoCanvas.style.top = '0';
  infoCanvas.style.left = '0';
  infoCanvas.style.pointerEvents = 'none';
  container.appendChild(infoCanvas);

  var ctx = infoCanvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(nm, W/2, H - 22);

  ctx.fillStyle = ovr > 80 ? '#ffd700' : ovr > 60 ? '#fff' : '#aaa';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'right';
  ctx.fillText(ovr, W - 12, H - 22);

  voxelScenes[containerId] = { scene: scene, camera: camera, renderer: renderer, group: playerGroup };
}


function createPlayer(region, position, quality=60, ageRange=[14,20]) {
  const age = rand(ageRange[0], ageRange[1]);
  const names = NAMES[region] || NAMES.England;
  const name = names[rand(0,names.length-1)];
  const pb = {GK:{pac:-20,sho:-25,def:20},CB:{pac:-5,sho:-15,def:25,phy:20},LB:{pac:15,def:10,pas:10},RB:{pac:15,def:10,pas:10},CDM:{def:15,pas:15},CM:{sho:10,def:5,pas:18},CAM:{pac:10,sho:18,def:-5,pas:15},LW:{pac:22,sho:18,def:-10},RW:{pac:22,sho:18,def:-10},ST:{pac:12,sho:25,def:-15,phy:15}};
  const b = pb[position]||{};
  const ovr = Math.max(30,Math.min(99,quality+rand(-8,8)));
  const pot = Math.min(99,quality+rand(5,22));
  const hBase = {GK:192,CB:188,LB:181,RB:181,CDM:184,CM:181,CAM:178,LW:176,RW:176,ST:185}[position]||180;
  const height = Math.round(hBase + rand(-4,4) - (age<20?(20-age)*0.08:0));
  const weight = Math.round(height*0.65+rand(-5,5));
  const val = Math.floor(ovr*8000*(age<22?1.6:age<26?1.2:age<30?0.8:0.35)*rand(80,120)/100);
  return {
    id:uid(), name, region, position, age, ovr, potential:pot,
    pace:Math.max(30,Math.min(99,rand(50,85)+(b.pac||0))),
    shooting:Math.max(30,Math.min(99,rand(40,80)+(b.sho||0))),
    passing:Math.max(30,Math.min(99,rand(45,85)+(b.pas||0))),
    defending:Math.max(30,Math.min(99,rand(40,80)+(b.def||0))),
    physical:Math.max(30,Math.min(99,rand(50,85)+(b.phy||0))),
    fitness:rand(75,100), morale:rand(60,100),
    value:val, wage:Math.floor(ovr*80*rand(80,120)/100),
    goals:0, assists:0, matches:0, height, weight
  };
}

// ---- Match Engine v3.0 ----
function startMatch() {
  if(rafId){cancelAnimationFrame(rafId);rafId=null}
  MS = null; tab = 'match'; render();

  setTimeout(()=>{
    const fp = FP[G.formation]||FP['4-4-2'];
    const myTeam = G.team.slice(0,11).map((p,i)=>{
      const pos = fp[i]||[.25,.5];
      return {...p, hx:pos[0], hy:pos[1], role:i===0?'GK':i<3?'DEF':i<7?'MID':'ATT', isMy:true};
    });
    const oppIdx = rand(1,G.league.length-1);
    const oppStr = G.league[oppIdx].strength;
    const oppPos = ['GK','CB','CB','LB','RB','CDM','CM','CM','LW','RW','ST'];
    const oppTeam = oppPos.map((pos,i)=>{
      const p = createPlayer(['England','Spain','Brazil','Germany','France'][rand(0,4)],pos,oppStr);
      return {...p, role:pos, isMy:false};
    });

    // v4: 预计算引擎 — 赛前一次性生成，播放零计算
    MS = new MatchEngine(myTeam, oppTeam, getLN(oppIdx), Tactics.TIKITAKA, Tactics.COUNTER);
    MS.oppName = getLN(oppIdx);
    // 兼容别名
    Object.defineProperty(MS, 'myScore', { get() { return this.score.my; } });
    Object.defineProperty(MS, 'oppScore', { get() { return this.score.opp; } });
    Object.defineProperty(MS, 'finished', { get() { return !this.playing; } });
    MS.start();

    render();
    setTimeout(()=>{rafId=requestAnimationFrame(matchLoopV3)},100);
  },100);
}

function matchLoopV3() {
  if(!MS||!MS.playing){rafId=null;return}
  drawMatchV3();
  const evts=(MS.events||[]).length;
  if(evts!==_lastEvtLen){
    const evtEl=document.getElementById('evts');
    if(evtEl)evtEl.innerHTML=evtHTML();
    _lastEvtLen=evts;
  }
  // 更新 HUD 分数/分钟
  const f=MS.getCurrentFrame();
  if(f){
    const sEl=document.getElementById('scr-my');
    const oEl=document.getElementById('scr-opp');
    const mEl=document.getElementById('scr-min');
    if(sEl)sEl.textContent=f.score.my;
    if(oEl)oEl.textContent=f.score.opp;
    if(mEl)mEl.textContent=f.min+"'";
  }
  if(MS.isFinished()){
    endMatchV3();
    rafId=null;
    return;
  }
  rafId=requestAnimationFrame(matchLoopV3);
}

function evtHTML(){
  if(!MS)return'';
  const colors={goal:'#22c55e',shot:'#f59e0b',foul:'#ef4444',pass:'#3b82f6',info:'#94a3b8',defense:'#a855f7',red:'#dc2626',miss:'#6b7280',save:'#f59e0b',end:'#10b981'};
  return MS.events.slice(0,15).map(e=>`<div style="padding:6px 8px;border-radius:6px;font-size:11px;border-left:3px solid ${colors[e.type]||'#94a3b8'};background:${colors[e.type]||'#94a3b8'}18;margin-bottom:4px"><span style="color:#94a3b8;margin-right:6px">${e.min}</span>${e.txt}</div>`).join('');
}

function endMatchV3(){
  if(!MS||MS.finished===false)return;
  if(rafId){cancelAnimationFrame(rafId);rafId=null}
  
  const myL=G.league.find(l=>l.name==='FC United');
  const oppL=G.league.find(l=>l.name===MS.oppName);
  
  myL.played++;oppL.played++;
  myL.gf+=MS.score.my;myL.ga+=MS.score.opp;
  oppL.gf+=MS.score.opp;oppL.ga+=MS.score.my;
  
  if(MS.score.my>MS.score.opp){myL.won++;myL.pts+=3;oppL.lost++}
  else if(MS.score.my===MS.score.opp){myL.drawn++;myL.pts++;oppL.drawn++;oppL.pts++}
  else{myL.lost++;oppL.won++;oppL.pts+=3}
  
  G.budget+=120000*G.facilities.stadium;
  G.team.slice(0,11).forEach(p=>{
    p.matches++;
    p.fitness=Math.max(45,p.fitness-rand(10,20));
    p.morale=Math.min(100,p.morale+(MS.score.my>MS.score.opp?6:-4));
  });
  
  G.week++;
  const res=MS.score.my>MS.score.opp?t('win'):MS.score.my===MS.score.opp?t('draw'):t('lose');
  addNews(`${res} FC联 ${MS.score.my}-${MS.score.opp} vs ${MS.oppName}`);
  
  if(G.week>38){
    G.season++;G.week=1;
    G.league.sort((a,b)=>b.pts-a.pts);
    const pos=G.league.findIndex(l=>l.name==='FC United')+1;
    addNews(`🏆 第${G.season-1}赛季结束! 排名#${pos}`);
    G.league.forEach(l=>{
      if(l.name!=='FC United')l.strength=Math.max(35,Math.min(95,l.strength+rand(-6,6)));
      l.played=l.won=l.drawn=l.lost=l.gf=l.ga=l.pts=0
    });
    G.budget+=2500000;
  }
  
  save();
  render();
}

let _mcCtx=null;

function drawMatchV3(){
  const cvs=document.getElementById('mc');
  if(!cvs||!MS)return;
  const W=480,H=270;
  if(cvs.width!==W||cvs.height!==H){cvs.width=W;cvs.height=H;_mcCtx=null;}
  if(!_mcCtx||_mcCtx.canvas!==cvs){_mcCtx=cvs.getContext('2d');}
  const c=_mcCtx;

  const data=MS.getRenderData();
  if(!data)return;

  // Grass
  c.fillStyle='#2d8a2d';c.fillRect(0,0,W,H);

  // Simple stripes (fewer iterations)
  for(let i=0;i<10;i+=2){c.fillStyle='rgba(0,0,0,0.03)';c.fillRect(i*(W/10),0,W/10,H);}

  // Lines (simplified)
  c.strokeStyle='rgba(255,255,255,0.5)';c.lineWidth=1;
  c.strokeRect(12,12,W-24,H-24);
  c.strokeRect(12,H/2-45,35,90);
  c.strokeRect(W-47,H/2-45,35,90);
  c.beginPath();c.moveTo(W/2,12);c.lineTo(W/2,H-12);c.stroke();
  c.beginPath();c.arc(W/2,H/2,30,0,Math.PI*2);c.stroke();

  // Players (simplified - no shadows, fewer state colors)
  c.font='7px Arial';c.textAlign='center';
  data.players.forEach(p=>{
    const bx=p.x*W, by=p.y*H;
    const col=p.isMy?'#0ea5e9':'#ef4444';
    c.fillStyle=col;c.beginPath();c.arc(bx,by,7,0,Math.PI*2);c.fill();
    c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
    c.fillStyle='#fff';c.fillText((p.name||'').split(' ').pop().substr(0,6),bx,by-10);
  });

  // Ball
  const bx=data.ball.x*W, by=data.ball.y*H;
  c.fillStyle='#fff';c.beginPath();c.arc(bx,by,4,0,Math.PI*2);c.fill();

  // Score HUD (HTML overlay is faster, but keep simple)
  c.fillStyle='rgba(0,0,0,0.7)';c.fillRect(W/2-50,4,100,20);
  c.fillStyle='#0ea5e9';c.font='bold 14px Arial';c.textAlign='right';c.fillText(data.score.my,W/2-6,18);
  c.fillStyle='#fff';c.font='12px Arial';c.textAlign='center';c.fillText('-',W/2,18);
  c.fillStyle='#ef4444';c.font='bold 14px Arial';c.textAlign='left';c.fillText(data.score.opp,W/2+6,18);
  c.fillStyle='#94a3b8';c.font='bold 9px Arial';c.textAlign='right';c.fillText(data.min+"'",W/2+44,18);
}

function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

            <button onclick="LANG='zh';render()" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.3);background:${LANG==='zh'?'#00d4ff':'rgba(255,255,255,.1)'};color:${LANG==='zh'?'#000':'#fff'};cursor:pointer">中文</button>
            <button onclick="LANG='en';render()" style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.3);background:${LANG==='en'?'#00d4ff':'rgba(255,255,255,.1)'};color:${LANG==='en'?'#000':'#fff'};cursor:pointer">EN</button>

        </div>

    <main style="max-width:480px;margin:0 auto;padding:12px 12px 100px">${main}</main>
    <nav style="position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,#0f172a,rgba(15,23,42,.95));border-top:1px solid rgba(0,212,255,.3);padding:8px;z-index:30">
      <div style="max-width:480px;margin:0 auto;display:flex;justify-content:space-around">
        ${tab!=='playerDetail'?['home','match','team','tactics','facility'].map(tb=>`
          <button onclick="tab='${tb}';selPlayer=null;render()" class="nav-btn ${tab===tb?'on':''}">
            <span style="font-size:18px">${tb==='home'?'🏠':tb==='match'?'⚽':tb==='team'?'👥':tb==='tactics'?'⚙️':'🏟️'}</span>
            <span style="font-size:9px;margin-top:2px">${t(tb)}</span>
          </button>`).join(''):''}
      </div>
    </nav>
    ${toast?`<div class="toast">${toast}</div>`:''}
  `;
  if(toast)setTimeout(()=>{toast=null;render()},2000);
  
  // Init 3D voxel player after DOM update
  requestAnimationFrame(()=>{
    if(!window.THREE)return;
    document.querySelectorAll('[data-player]').forEach(el=>{
      if(el.dataset.voxelInited)return;
      el.dataset.voxelInited='1';
      try{
        const raw=el.dataset.player.replace(/&apos;/g,"'");
        const p=JSON.parse(raw);
        console.log('[LPC] Init player:', p.name, 'container:', el.id);
        // 优先使用 LPC 渲染器，失败时回退到 Three.js
        if(typeof LPCPlayerGenerator !== 'undefined') {
          initLPCPlayer(p, el.id);
        } else {
          initVoxelPlayer(p, el.id);
        }
      }catch(e){ console.error('[LPC] Error:', e); }
    });
  });
}

        <div style="text-align:center"><div style="font-size:11px;color:#94a3b8">FC联</div><div class="gt" style="font-size:40px;font-weight:700;color:#00d4ff" id="scr-my">${MS.myScore}</div></div>
        <div style="text-align:center"><div class="pulse" style="font-size:11px;color:#ef4444;font-weight:700">${t('live')}</div><div class="gt" style="font-size:22px;font-weight:700" id="scr-min">0'</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:#94a3b8">${MS.oppName}</div><div class="gt" style="font-size:40px;font-weight:700;color:#ef4444" id="scr-opp">${MS.oppScore}</div></div>
      </div>
    </div>
    <div style="margin-bottom:10px">
      <canvas id="mc" width="480" height="270" style="width:100%;height:auto;display:block"></canvas>
    </div>
    <div class="card" style="padding:12px;max-height:180px;overflow-y:auto">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">📋 事件</div>
      <div id="evts">${evtHTML()}</div>
    </div>
    ${MS.finished?`<div style="text-align:center;margin-top:16px"><div style="font-size:24px;font-weight:700;margin-bottom:12px;color:${MS.myScore>MS.oppScore?'#22c55e':MS.myScore===MS.oppScore?'#fbbf24':'#ef4444'}">${MS.myScore>MS.oppScore?'🎉 '+t('win'):MS.myScore===MS.oppScore?'🤝 '+t('draw'):'😢 '+t('lose')}</div><button onclick="tab='home';MS=null;render()" class="btn btn-g">${t('back')}</button></div>`:''}
  `;
}

// ---- Actions ----
function upgFac(k){
  const costs=[50000,100000,200000,400000,800000,1600000,3200000,6400000,12800000];
  const cost=costs[Math.min(G.facilities[k]-1,8)];
  if(G.budget>=cost&&G.facilities[k]<10){G.budget-=cost;G.facilities[k]++;addNews(`🔧 ${k}升级到Lv.${G.facilities[k]}!`);showToast(t('upgraded'));save()}
  else showToast(t('noMoney'));
}
function signP(id){
  const p=G.prospects.find(x=>x.id===id);
  if(p&&G.budget>=p.value*.3){G.budget-=Math.floor(p.value*.3);G.team.push(p);G.prospects=G.prospects.filter(x=>x.id!==id);addNews(`✅ 签约${p.name}!`);showToast(t('signed'));save()}
  else showToast(t('noMoney'));
}
function rejectP(id){G.prospects=G.prospects.filter(x=>x.id!==id);render()}

// ---- Boot ----
initGame();
refreshMarket();
scoutAcademy();
render();
</script>
