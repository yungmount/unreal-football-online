<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UFO - 梦幻足球</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 100%); color: #fff; overflow-x: hidden; }
        .game-title { font-family: 'Orbitron', sans-serif; }
        .card { background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95)); border: 1px solid rgba(0,212,255,0.2); border-radius: 16px; }
        .btn-game { background: linear-gradient(135deg, #00d4ff, #0099cc); border: none; border-radius: 12px; padding: 12px 20px; font-weight: 700; color: #000; cursor: pointer; transition: all 0.2s; }
        .btn-game:active { transform: scale(0.95); }
        .btn-game.gold { background: linear-gradient(135deg, #ffd700, #b8860b); }
        .btn-game.green { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-game.red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-game.purple { background: linear-gradient(135deg, #9333ea, #7c3aed); color: #fff; }
        .lang-btn { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
        .lang-btn.active { background: #00d4ff; color: #000; border-color: #00d4ff; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; color: rgba(255,255,255,0.5); cursor: pointer; }
        .nav-btn.active { color: #00d4ff; }
        .nav-btn .icon { font-size: 18px; }
        .nav-btn .text { font-size: 9px; margin-top: 2px; }
        .stat-bar { height: 6px; border-radius: 3px; background: rgba(0,0,0,0.5); overflow: hidden; }
        .stat-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .player-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.2s; }
        .player-card:hover { border-color: #00d4ff; transform: translateY(-2px); }
        .standings-row { display: grid; grid-template-columns: 30px 1fr 40px 50px; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; align-items: center; font-size: 13px; }
        .standings-row.me { background: rgba(0,212,255,0.2); border: 1px solid rgba(0,212,255,0.5); }
        @keyframes spin3d { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .player-3d { perspective: 600px; width: 140px; height: 220px; margin: 0 auto; }
        .player-3d-inner { width: 100%; height: 100%; transform-style: preserve-3d; animation: spin3d 6s linear infinite; }
        canvas { display: block; width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
    // ==================== Config ====================
    let LANG = 'zh';
    const GAME_NAME = 'UFO';
    
    const I18N = {
        en: {
            appName: "UFO", home: "Home", team: "Squad", tactics: "Tactics", facility: "Facility", match: "Match",
            budget: "Budget", round: "Round {0}", season: "Season {0}", rank: "Rank", record: "Record", gd: "GD",
            win: "W", draw: "D", lose: "L", pts: "PTS", play: "Play", train: "Train", refresh: "Refresh",

        },
        zh: {
            appName: "UFO", home: "首页", team: "阵容", tactics: "战术", facility: "设施", match: "比赛",
            budget: "资金", round: "第{0}轮", season: "赛季{0}", rank: "排名", record: "战绩", gd: "净胜",
            win: "胜", draw: "平", lose: "负", pts: "分", play: "开始", train: "训练", refresh: "刷新",
            academy: "青训", market: "转会", standings: "积分榜", sign: "签约", reject: "放弃",
            goals: "球", assists: "助", matches: "场", fitness: "体", morale: "气", pace: "速", shooting: "射",
            passing: "传", defending: "防", physical: "体", formation: "阵型", style: "战术", upgrade: "升级",
            attack: "进攻", balance: "平衡", defend: "防守", level: "等级", potential: "潜力",
            age: "年龄", overall: "总评", height: "身高", weight: "体重", value: "身价", wage: "周薪", position: "位置",
            signed: "签约成功!", noMoney: "资金不足!", trained: "训练完成!", upgraded: "升级成功!", back: "返回",
            all: "全部", goalkeeper: "门将", defenders: "后卫", midfielders: "中场", attackers: "前锋", live: "直播",
            details: "详情", vs: "VS", currentTeam: "当前阵容"

    function t(key, ...args) { 
        let text = I18N[LANG][key] || key; 
        args.forEach((v, i) => text = text.replace(`{${i}}`, v)); 
        return text; 
    }
    
    const PLAYER_NAMES = {
        England: ['Harry Kane','Jude Bellingham','Bukayo Saka','Declan Rice','Phil Foden','Mason Mount','Trent Alexander-Arnold','John Stones','Kyle Walker','Jordan Pickford'],
        Spain: ['Pedri','Gavi','Ferran Torres','Sergio Busquets','Unai Simon','Cesar Azpilicueta','Aymeric Laporte','Jordi Alba','Dani Olmo','Mikel Oyarzabal'],
        Germany: ['Jamal Musiala','Florian Wirtz','Kai Havertz','Joshua Kimmich','Manuel Neuer','Antonio Rudiger','Ilkay Gundogan','Thomas Muller','Leroy Sane','Jonathan Tah'],
        France: ['Kylian Mbappe','Aurelien Tchouameni','Eduardo Camavinga','Theo Hernandez','Adrien Rabiot','N Golo Kante','Ousmane Dembele','Kingsley Coman','Ferland Mendy','Raphael Varane'],
        Brazil: ['Vinicius Jr','Rodrygo','Casemiro','Marquinhos','Alisson','Thiago Silva','Lucas Paqueta','Fabinho','Richarlison','Gabriel Jesus'],
        Argentina: ['Lionel Messi','Lautaro Martinez','Julian Alvarez','Angel Di Maria','Gonzalo Montiel','Lisandro Martinez','Enzo Fernandez','Alexis Mac Allister','Cristian Romero','Emiliano Martinez'],
        Italy: ['Gianluigi Donnarumma','Alessandro Bastoni','Nicolo Barella','Leonardo Bonucci','Federico Chiesa','Ciro Immobile','Rafael Leao','Sandro Tonali','Davide Calabria','Alessio Romagnoli'],
        Nigeria: ['Victor Osimhen','Wilfred Ndidi','Kelechi Iheanacho','Samuel Chukwueze','Ola Aina','Zaidu Sanusi','Chidera Ejuke','Taiwo Awoniyi','Nathaniel Tiole','Ademola Lookman'],
        Japan: ['Takefusa Kubo','Daichi Kamada','Wataru Endo','Takehiro Tomiyasu','Kaoru Mitoma','Junya Ito','Hiroki Sakai','Daizen Maeda','Ayase Ueda','Ritsu Doan'],
        Korea: ['Son Heung-min','Lee Kang-in','Kim Min-jae','Hwang Hee-chan','Cho Gue-sung','Kim Young-gwon','Seol Ki-hyeon','Lee Jae-sung','Hwang In-beom','Park Ji-soo'],
        China: ['Wu Lei','Zhang Yuning','Wang Dalei','Yan Junling','Kou Zhun','Gao Lin','Zheng Zhi','Feng Xiaoting','Wei Shihao','Liu Yang'],
        USA: ['Christian Pulisic','Weston McKennie','Sergiño Dest','Antonee Robinson','Tyler Adams','Yunus Musah','Gio Reyna','Joe Scally','Tim Weah','Brenden Aaronson']
    };
    
    // ==================== Avatar - Dicebear Realistic Faces ====================
    function getPlayerAvatar(player) {
        // 使用 Dicebear API 生成更真实的头像
        // avataaars 风格 - 卡通但更真实的人脸
        const seed = player.id || player.name;
        // 使用 fun-emoji 风格，更加真实
        return `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}&backgroundColor=0ea5e9,7c3aed,f59e0b,10b981,ef4444`;
    }
    
    // ==================== 3D Player Model ====================
    function generate3DPlayer(player) {
        // 根据位置调整体型
        const positionBodyTypes = {
            'GK': { shoulder: 1.15, chest: 1.2, leg: 0.9, heightBonus: 8 },  // 门将：宽肩、壮实
            'CB': { shoulder: 1.1, chest: 1.15, leg: 1.0, heightBonus: 3 },   // 中卫：强壮
            'LB': { shoulder: 0.95, chest: 1.0, leg: 1.05, heightBonus: 0 },  // 左边卫：匀称
            'RB': { shoulder: 0.95, chest: 1.0, leg: 1.05, heightBonus: 0 },  // 右边卫：匀称
            'CDM': { shoulder: 1.05, chest: 1.1, leg: 1.0, heightBonus: 1 },  // 防守中场：偏壮
            'CM': { shoulder: 1.0, chest: 1.0, leg: 1.0, heightBonus: 0 },    // 中场：标准
            'CAM': { shoulder: 0.95, chest: 0.95, leg: 1.0, heightBonus: -2 },// 前腰：精瘦
            'LW': { shoulder: 0.9, chest: 0.9, leg: 1.1, heightBonus: -2 },   // 左边锋：精瘦快速
            'RW': { shoulder: 0.9, chest: 0.9, leg: 1.1, heightBonus: -2 },   // 右边锋：精瘦快速
            'ST': { shoulder: 1.0, chest: 1.05, leg: 1.05, heightBonus: 2 }   // 前锋：力量型
        };
        
        const bodyType = positionBodyTypes[player.position] || { shoulder: 1.0, chest: 1.0, leg: 1.0, heightBonus: 0 };
        
        const heightNorm = (player.height - 170) / 30;
        const weightNorm = (player.weight - 70) / 25;
        const baseHeight = 160 + heightNorm * 20 + bodyType.heightBonus;
        const shoulderWidth = 24 * bodyType.shoulder * (1 + weightNorm * 0.1);
        const chestWidth = 40 * bodyType.chest * (1 + weightNorm * 0.15);
        const legLength = 50 * bodyType.leg * (1 + heightNorm * 0.1);
        
        const jerseyNum = Math.floor(Math.random() * 99) + 1;
        const jerseyColors = ['#00d4ff', '#ff4444', '#44ff44', '#ffff44', '#ff44ff'];
        const jerseyColor = jerseyColors[Math.floor(Math.random() * jerseyColors.length)];
        
        // 根据位置选择肤色（更真实）
        const skinTones = ['#FFD7A8', '#F5C89A', '#E8A87C', '#D4A574', '#C68642'];
        const skinTone = skinTones[Math.floor(Math.random() * skinTones.length)];
        const skinToneDark = shadeColor(skinTone, -15);
        
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 ${baseHeight}" width="140" height="${baseHeight * 1.4}">
            <defs>
                <linearGradient id="body${player.id}" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:${skinTone}"/>
                    <stop offset="100%" style="stop-color:${skinToneDark}"/>
                </linearGradient>
                <linearGradient id="jersey${player.id}" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:${jerseyColor}"/>
                    <stop offset="100%" style="stop-color:${shadeColor(jerseyColor, -20)}"/>
                </linearGradient>
            </defs>
            
            <!-- 头 -->
            <ellipse cx="50" cy="20" rx="${12 + weightNorm * 2}" ry="14" fill="url(#body${player.id})"/>
            
            <!-- 头发 -->
            <ellipse cx="50" cy="11" rx="${14 + weightNorm * 2}" ry="9" fill="#2C1810"/>
            <ellipse cx="50" cy="8" rx="10" ry="5" fill="#1a0f08"/>
            
            <!-- 眉毛 -->
            <path d="M 42 15 Q 45 13 48 15" stroke="#1a0f08" stroke-width="1.5" fill="none"/>
            <path d="M 52 15 Q 55 13 58 15" stroke="#1a0f08" stroke-width="1.5" fill="none"/>
            
            <!-- 眼睛 -->
            <ellipse cx="45" cy="19" rx="2.5" ry="2" fill="#fff"/>
            <ellipse cx="55" cy="19" rx="2.5" ry="2" fill="#fff"/>
            <circle cx="45" cy="19" r="1.5" fill="#3a2a1a"/>
            <circle cx="55" cy="19" r="1.5" fill="#3a2a1a"/>
            <circle cx="45.5" cy="18.5" r="0.6" fill="#fff"/>
            <circle cx="55.5" cy="18.5" r="0.6" fill="#fff"/>
            
            <!-- 鼻子 -->
            <path d="M 50 20 L 48 25 L 52 25 Z" fill="${skinToneDark}"/>
            
            <!-- 嘴 -->
            <path d="M 46 28 Q 50 30 54 28" stroke="#a05050" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            
            <!-- 脖子 -->
            <rect x="45" y="33" width="10" height="8" fill="url(#body${player.id})"/>
            
            <!-- 球衣主体 - 根据体型调整 -->
            <path d="M ${50 - shoulderWidth/2} 41 
                     L ${50 - shoulderWidth/2 - 5} 45 
                     L ${50 - chestWidth/2 - 3} ${88 + heightNorm * 10} 
                     L ${50 - chestWidth/2 + 5} ${92 + heightNorm * 10} 
                     L ${50 + chestWidth/2 - 5} ${92 + heightNorm * 10} 
                     L ${50 + chestWidth/2 + 3} ${88 + heightNorm * 10} 
                     L ${50 + shoulderWidth/2 + 5} 45 
                     L ${50 + shoulderWidth/2} 41 Z" 
                  fill="url(#jersey${player.id})" stroke="#fff" stroke-width="1"/>
            
            <!-- 球衣号码 -->
            <text x="50" y="${68 + heightNorm * 5}" font-family="Arial Black" font-size="14" font-weight="bold" fill="white" text-anchor="middle">${jerseyNum}</text>
            
            <!-- 球衣细节线条 -->
            <line x1="50" y1="50" x2="50" y2="${70 + heightNorm * 5}" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
            
            <!-- 手臂 - 根据体型调整粗细 -->
            <ellipse cx="${50 - shoulderWidth/2 - 5}" cy="55" rx="${6 * bodyType.shoulder}" ry="${22 * (1 + heightNorm * 0.1)}" fill="url(#body${player.id})"/>
            <ellipse cx="${50 + shoulderWidth/2 + 5}" cy="55" rx="${6 * bodyType.shoulder}" ry="${22 * (1 + heightNorm * 0.1)}" fill="url(#body${player.id})"/>
            
            <!-- 短裤 -->
            <path d="M ${50 - chestWidth/2 + 5} ${92 + heightNorm * 10} 
                     L ${50 - 12} ${100 + heightNorm * 10 + legLength * 0.3} 
                     L ${50 - 8} ${100 + heightNorm * 10 + legLength * 0.3} 
                     L ${50 - 3} ${92 + heightNorm * 10} 
                     L ${50 + 3} ${92 + heightNorm * 10} 
                     L ${50 + 8} ${100 + heightNorm * 10 + legLength * 0.3} 
                     L ${50 + 12} ${100 + heightNorm * 10 + legLength * 0.3} 
                     L ${50 + chestWidth/2 - 5} ${92 + heightNorm * 10} Z" 
                  fill="#1a1a2e"/>
            
            <!-- 腿 - 根据体型调整 -->
            <rect x="${50 - 10}" y="${100 + heightNorm * 10 + legLength * 0.3}" width="8" height="${legLength * 0.6}" rx="3" fill="url(#body${player.id})"/>
            <rect x="${50 + 2}" y="${100 + heightNorm * 10 + legLength * 0.3}" width="8" height="${legLength * 0.6}" rx="3" fill="url(#body${player.id})"/>
            
            <!-- 球袜 -->
            <rect x="${50 - 11}" y="${100 + heightNorm * 10 + legLength * 0.8}" width="10" height="14" rx="2" fill="${jerseyColor}" opacity="0.85"/>
            <rect x="${50 + 1}" y="${100 + heightNorm * 10 + legLength * 0.8}" width="10" height="14" rx="2" fill="${jerseyColor}" opacity="0.85"/>
            
            <!-- 球鞋 -->
            <ellipse cx="${50 - 6}" cy="${118 + heightNorm * 10 + legLength * 0.75}" rx="8" ry="5" fill="#1a1a1a"/>
            <ellipse cx="${50 + 6}" cy="${118 + heightNorm * 10 + legLength * 0.75}" rx="8" ry="5" fill="#1a1a1a"/>
            <!-- 鞋钉 -->
            <rect x="${50 - 10}" y="${120 + heightNorm * 10 + legLength * 0.75}" width="2" height="3" fill="#333"/>
            <rect x="${50 - 6}" y="${121 + heightNorm * 10 + legLength * 0.75}" width="2" height="3" fill="#333"/>
            <rect x="${50 + 4}" y="${121 + heightNorm * 10 + legLength * 0.75}" width="2" height="3" fill="#333"/>
            <rect x="${50 + 8}" y="${120 + heightNorm * 10 + legLength * 0.75}" width="2" height="3" fill="#333"/>
        </svg>`;
        
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    
    // 颜色调节辅助函数
    function shadeColor(color, percent) {
        const num = parseInt(color.replace('#', ''), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.max(0, Math.min(255, (num >> 16) + amt));
        const G = Math.max(0, Math.min(255, (num >> 8 & 0x00FF) + amt));
        const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
        return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
    }
    
    // ==================== Game State ====================
    let game = null;
    let currentTab = 'home';
    let selectedPlayer = null;
    let matchState = null;
    let canvas = null;
    let ctx = null;
    let animationId = null;
    
    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const uid = () => 'p' + Date.now() + Math.random().toString(36).substr(2, 6);
    const fmt = (n) => n >= 1000000 ? '€' + (n / 1000000).toFixed(1) + 'M' : n >= 1000 ? '€' + (n / 1000).toFixed(0) + 'K' : '€' + n;
    
    // ==================== Player Creation ====================
    function createPlayer(region, position, quality = 60) {
        const age = rand(17, 35);
        const names = PLAYER_NAMES[region] || PLAYER_NAMES['England'];
        const name = names[rand(0, names.length - 1)];
        
        const heightBase = { GK: rand(188, 196), CB: rand(184, 193), LB: rand(177, 185), RB: rand(177, 185), CDM: rand(180, 188), CM: rand(177, 185), CAM: rand(175, 182), LW: rand(172, 180), RW: rand(172, 180), ST: rand(179, 191) };
        const height = Math.round((heightBase[position] || 180) - (age < 20 ? (20 - age) * 0.08 : 0));
        const weight = Math.round(height * 0.65 + rand(-5, 5));
        
        const posBonus = {
            GK: { pace: -20, shooting: -25, defending: 20, passing: 5 },
            CB: { pace: -5, shooting: -15, defending: 25, physical: 20 },
            LB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            RB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            CDM: { pace: 0, shooting: -5, defending: 15, passing: 15 },
            CM: { pace: 5, shooting: 10, defending: 5, passing: 18 },
            CAM: { pace: 10, shooting: 18, defending: -5, passing: 15 },
            LW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            RW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            ST: { pace: 12, shooting: 25, defending: -15, physical: 15 }
        };
        
        const b = posBonus[position] || {};
        const potential = Math.min(99, quality + rand(5, 22));
        const ovr = Math.max(30, Math.min(99, quality + rand(-8, 8)));
        const value = Math.floor(ovr * 8000 * (age < 22 ? 1.6 : age < 26 ? 1.2 : age < 30 ? 0.8 : 0.35));
        
        return {
            id: uid(), name, region, position, age, ovr, potential,
            pace: Math.max(30, Math.min(99, rand(50, 85) + (b.pace || 0))),
            shooting: Math.max(30, Math.min(99, rand(40, 80) + (b.shooting || 0))),
            passing: Math.max(30, Math.min(99, rand(45, 85) + (b.passing || 0))),
            defending: Math.max(30, Math.min(99, rand(40, 80) + (b.defending || 0))),
            physical: Math.max(30, Math.min(99, rand(50, 85) + (b.physical || 0))),
            fitness: rand(75, 100), morale: rand(60, 100),
            value: Math.floor(value * rand(80, 120) / 100),
            wage: Math.floor(ovr * 80 * rand(80, 120) / 100),
            goals: 0, assists: 0, matches: 0,
            height, weight
        };
    }
    
    // ==================== Game Init ====================
    function initGame() {
        const saved = localStorage.getItem('football_v12_save');
        if (saved) {
            try {
                game = JSON.parse(saved);
                return;
            } catch(e) {}
        }
        
        game = { budget: 5000000, team: [], league: [], facilities: { training: 1, academy: 1, stadium: 1 },
            season: 1, week: 1, day: 0, formation: '4-4-2', tactic: 'balance', market: [], prospects: [], news: [] };
        
        const positions = ['GK','CB','CB','CB','LB','RB','CDM','CM','CM','CAM','LW','RW','ST','ST','CM','CDM','CB','LB','RB','GK','CM','ST'];
        const regions = ['England','Spain','Brazil','Germany','France','Italy','Argentina','Nigeria','Japan','Korea','China','USA','England','Spain','Brazil','Germany','France','Italy','Argentina','Nigeria','Japan','Korea'];
        
        for (let i = 0; i < 22; i++) {
            game.team.push(createPlayer(regions[i], positions[i], rand(58, 72)));
        }
        
        const teamNames = ['FC联','竞技','龙之队','雄狮','红星','蓝月','绿茵','凤凰','银鹰','金蛇','紫百合','黑豹'];
        game.league = teamNames.map((name, i) => ({ name, index: i, strength: rand(40, 88), played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, pts: 0 }));
    }
    
    function save() { localStorage.setItem('football_v12_save', JSON.stringify(game)); }
    
    // ==================== Match System ====================
    const FORMATION_POSITIONS = {
        '4-4-2': [{x:0.08,y:0.5},{x:0.22,y:0.15},{x:0.22,y:0.4},{x:0.22,y:0.6},{x:0.22,y:0.85},{x:0.38,y:0.2},{x:0.38,y:0.5},{x:0.38,y:0.8},{x:0.52,y:0.3},{x:0.52,y:0.7}],
        '4-3-3': [{x:0.08,y:0.5},{x:0.22,y:0.15},{x:0.22,y:0.4},{x:0.22,y:0.6},{x:0.22,y:0.85},{x:0.38,y:0.3},{x:0.38,y:0.5},{x:0.38,y:0.7},{x:0.55,y:0.2},{x:0.55,y:0.5},{x:0.55,y:0.8}],

    function startMatch() {
        currentTab = 'match';
        matchState = null;
        render();
        
        setTimeout(() => {
            const formationPos = FORMATION_POSITIONS[game.formation] || FORMATION_POSITIONS['4-4-2'];
            
            const myTeam = [];
            for (let i = 0; i < 11; i++) {
                const p = game.team[i] || createPlayer('England', 'CM', 65);
                const pos = formationPos[i] || {x:0.3, y:0.5};
                myTeam.push({...p, x: pos.x, y: pos.y, vx: 0, vy: 0, homeX: pos.x, homeY: pos.y});
            }
            
            const oppIdx = rand(1, game.league.length - 1);
            const oppTeam = [];
            const oppPos = formationPos.map(p => ({x: 1-p.x, y: p.y}));
            const oppPositions = ['GK','CB','CB','CB','LB','RB','CDM','CM','CM','LW','ST'];
            
            for (let i = 0; i < 11; i++) {
                const p = createPlayer('Brazil', oppPositions[i], game.league[oppIdx].strength);
                const o = oppPos[i] || {x:0.7, y:0.5};
                oppTeam.push({...p, x: o.x, y: o.y, vx: 0, vy: 0, homeX: o.x, homeY: o.y});
            }
            
            matchState = {
                myTeam, oppTeam,
                oppName: game.league[oppIdx].name,
                myScore: 0, oppScore: 0,
                minute: 0, second: 0,
                events: [],
                ball: {x:0.5, y:0.5, vx:0, vy:0},
                possession: 'my',
                started: true, finished: false
            };
            
            // 关键：重新渲染界面以显示比赛
            render();
            
            startMatchLoop();
        }, 100);
    }
    
    function startMatchLoop() {
        canvas = document.getElementById('matchCanvas');
        if (!canvas) {
            console.error('Canvas not found, retrying...');
            setTimeout(startMatchLoop, 100);
            return;
        }
        
        ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        
        console.log('Match started:', matchState.myTeam.length, 'vs', matchState.oppTeam.length);
        
        let lastTime = performance.now();
        let lastEventTime = 0;
        
        function loop(time) {
            if (!matchState || !matchState.started || matchState.finished) return;
            
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            
            // 更新比赛时间
            matchState.second += dt * 60; // 加速时间流逝 (1秒 = 1分钟比赛时间)
            if (matchState.second >= 60) {
                matchState.second = 0;
                matchState.minute++;
                
                // 每分钟检查进球事件
                simulateMatchEvents();
                
                if (matchState.minute >= 90) {
                    matchState.finished = true;
                    endMatch();
                    render();
                    return;
                }
            }
            
            // 移动球员和球
            updatePlayerPositions(dt);
            
            // 渲染
            renderMatchCanvas();
            animationId = requestAnimationFrame(loop);
        }
        
        animationId = requestAnimationFrame(loop);
    }
    
    function simulateMatchEvents() {
        if (!matchState) return;
        
        // 计算球队实力
        const myStrength = matchState.myTeam.reduce((sum, p) => sum + p.ovr, 0) / 11;
        const oppStrength = matchState.oppTeam.reduce((sum, p) => sum + p.ovr, 0) / 11;
        
        // 进球概率基于实力差
        const myGoalChance = 0.02 + (myStrength - oppStrength) * 0.001;
        const oppGoalChance = 0.02 + (oppStrength - myStrength) * 0.001;
        
        if (Math.random() < myGoalChance) {
            matchState.myScore++;
            const scorer = matchState.myTeam[rand(8, 10)] || matchState.myTeam[rand(0, 10)];
            matchState.events.push({ minute: matchState.minute, type: 'goal', team: 'my', player: scorer.name });
        }
        
        if (Math.random() < oppGoalChance) {
            matchState.oppScore++;
            const scorer = matchState.oppTeam[rand(8, 10)] || matchState.oppTeam[rand(0, 10)];
            matchState.events.push({ minute: matchState.minute, type: 'goal', team: 'opp', player: scorer.name });
        }
    }
    
    function updatePlayerPositions(dt) {
        if (!matchState) return;
        
        // 更新球位置
        matchState.ball.x += matchState.ball.vx * dt;
        matchState.ball.y += matchState.ball.vy * dt;
        
        // 球场边界
        if (matchState.ball.x < 0 || matchState.ball.x > 1) matchState.ball.vx *= -0.8;
        if (matchState.ball.y < 0 || matchState.ball.y > 1) matchState.ball.vy *= -0.8;
        matchState.ball.x = Math.max(0, Math.min(1, matchState.ball.x));
        matchState.ball.y = Math.max(0, Math.min(1, matchState.ball.y));
        
        // 随机球移动
        if (Math.random() < 0.05) {
            matchState.ball.vx = (Math.random() - 0.5) * 0.5;
            matchState.ball.vy = (Math.random() - 0.5) * 0.5;
        }
        
        // 球员追球
        const allPlayers = [...matchState.myTeam, ...matchState.oppTeam];
        allPlayers.forEach(p => {
            const dx = matchState.ball.x - p.x;
            const dy = matchState.ball.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // 如果球近，追球
            if (dist < 0.3 && Math.random() < 0.1) {
                p.vx += dx * 0.02;
                p.vy += dy * 0.02;
            } else {
                // 回归原位
                p.vx += (p.homeX - p.x) * 0.01;
                p.vy += (p.homeY - p.y) * 0.01;
            }
            
            // 更新位置
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.95;
            p.vy *= 0.95;
            
            // 边界
            p.x = Math.max(0.02, Math.min(0.98, p.x));
            p.y = Math.max(0.02, Math.min(0.98, p.y));
        });
    }
    
    function endMatch() {
        // 更新联赛积分
        const myLeague = game.league[0];
        myLeague.played++;
        myLeague.gf += matchState.myScore;
        myLeague.ga += matchState.oppScore;
        
        if (matchState.myScore > matchState.oppScore) {
            myLeague.won++;
            myLeague.pts += 3;
        } else if (matchState.myScore < matchState.oppScore) {
            myLeague.lost++;
        } else {
            myLeague.drawn++;
            myLeague.pts += 1;
        }
        
        game.week++;
        save();
    }
    
    function renderMatchCanvas() {
        if (!canvas || !ctx || !matchState) return;
        
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        
        // 草地
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(0, 0, w, h);
        
        // 球场线
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, w-30, h-30);
        ctx.beginPath(); ctx.moveTo(w/2, 15); ctx.lineTo(w/2, h-15); ctx.stroke();
        
        // 球员
        matchState.myTeam.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x * w, p.y * h, 10, 0, Math.PI*2);
            ctx.fillStyle = '#00d4ff';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
        
        matchState.oppTeam.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x * w, p.y * h, 10, 0, Math.PI*2);
            ctx.fillStyle = '#ff6b6b';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
        
        // 球
        ctx.beginPath();
        ctx.arc(matchState.ball.x * w, matchState.ball.y * h, 6, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        
        // 比分
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(w/2-50, 5, 100, 30);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.myScore} - ${matchState.oppScore}`, w/2, 28);
        
        // 时间
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(w-45, 5, 40, 22);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(`${matchState.minute}'`, w-25, 24);
    }
    
    function renderMatch() {
        if (!canvas || !ctx || !matchState) return;
        
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        
        ctx.fillStyle = '#2d8a2d';
        ctx.fillRect(0, 0, w, h);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, w-30, h-30);
        ctx.beginPath(); ctx.moveTo(w/2, 15); ctx.lineTo(w/2, h-15); ctx.stroke();
        ctx.beginPath(); ctx.arc(w/2, h/2, 30, 0, Math.PI*2); ctx.stroke();
        
        // 球员
        matchState.myTeam.forEach(p => {
            const x = p.x * w, y = p.y * h;
            ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2);
            ctx.fillStyle = '#00d4ff'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        });
        
        matchState.oppTeam.forEach(p => {
            const x = p.x * w, y = p.y * h;
            ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2);
            ctx.fillStyle = '#ff6b6b'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        });
        
        // 球
        const bx = matchState.ball.x * w, by = matchState.ball.y * h;
        ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI*2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
        
        // 比分
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(w/2-50, 5, 100, 25);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px Orbitron';
        ctx.textAlign = 'center';
        ctx.fillText(`${matchState.myScore} - ${matchState.oppScore}`, w/2, 22);
        
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(w-40, 5, 35, 20);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 12px Orbitron';
        ctx.fillText(`${matchState.minute}'`, w-22, 18);
    }

                </div>
            </div>
            <button onclick="startMatch()" class="btn-game gold w-full text-lg py-4">⚽ ${t('play')}</button>
        `;
    }
    
    function showPlayerDetail(player) {
        selectedPlayer = player;
        currentTab = 'playerDetail';
        render();
    }
    
    function trainTeam() {
        game.team.forEach(p => {
            if (p.age < 29 && p.ovr < p.potential) {
                p.ovr = Math.min(p.potential, p.ovr + rand(0, 2));
            }
            p.fitness = Math.min(100, p.fitness + rand(8, 18));
        });
        save();
    }
    
    // ==================== Boot ====================
    initGame();
    render();
    </script>
</body>
</html>
