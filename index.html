<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梦幻足球Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root {
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --cyan: #00d4ff;
            --purple: #9333ea;
            --green: #22c55e;
            --red: #ef4444;
            --dark: #0a0a1a;
        }
        body { 
            margin: 0; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0f172a 100%);
            color: #fff;
            overflow-x: hidden;
        }
        .game-title { font-family: 'Orbitron', sans-serif; }
        
        /* 卡片 */
        .card {
            background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.95));
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        /* 按钮 */
        .btn-game {
            background: linear-gradient(135deg, var(--cyan), #0099cc);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,212,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-game:active { transform: scale(0.95); }
        .btn-game.gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
        }
        .btn-game.purple {
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            color: #fff;
        }
        .btn-game.green {
            background: linear-gradient(135deg, var(--green), #16a34a);
        }
        .btn-game.red {
            background: linear-gradient(135deg, var(--red), #dc2626);
        }
        
        /* 进度条 */
        .stat-bar {
            height: 8px;
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        /* 能力值条 */
        .attr-bar {
            width: 60px;
            height: 6px;
            background: rgba(0,0,0,0.4);
            border-radius: 3px;
            overflow: hidden;
        }
        .attr-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        /* 球员卡片 */
        .player-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px;
            padding: 12px;
            position: relative;
            overflow: hidden;
        }
        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--cyan), var(--gold));
        }
        .player-card.selected {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        
        /* 位置徽章 */
        .pos-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        /* 语言切换 */
        .lang-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
        }
        .lang-btn.active {
            background: var(--cyan);
            color: #000;
            border-color: var(--cyan);
        }
        
        /* 导航 */
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active {
            color: var(--cyan);
        }
        .nav-btn .icon { font-size: 20px; }
        .nav-btn .text { font-size: 10px; margin-top: 2px; }
        
        /* 比赛动画 */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scoreFlash {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .animate-pulse { animation: pulse 1s infinite; }
        .animate-slideUp { animation: slideUp 0.3s ease-out; }
        .score-flash { animation: scoreFlash 0.5s ease; }
        
        /* 消息通知 */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(34,197,94,0.95), rgba(22,163,74,0.95));
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(34,197,94,0.4);
        }
        
        /* 积分榜 */
        .standings-row {
            display: grid;
            grid-template-columns: 30px 1fr 40px 40px 40px 50px;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            align-items: center;
            font-size: 13px;
        }
        .standings-row:nth-child(1) { background: linear-gradient(90deg, rgba(255,215,0,0.2), transparent); }
        .standings-row:nth-child(2) { background: linear-gradient(90deg, rgba(192,192,192,0.15), transparent); }
        .standings-row:nth-child(3) { background: linear-gradient(90deg, rgba(205,127,50,0.15), transparent); }
        .standings-row.me { background: linear-gradient(90deg, rgba(0,212,255,0.3), transparent) !important; border: 1px solid rgba(0,212,255,0.5); }
    </style>
</head>

    // ==================== 球员名字库 ====================
    const NAMES = {

    // ==================== 全局变量 ====================
    let LANG = 'zh';
    let game = null;
    let currentTab = 'home';
    let filterPos = 'all';
    let showToast = null;

    function t(key, ...args) {
        let text = I18N[LANG][key] || key;
        if (args.length) {
            args.forEach((v, i) => text = text.replace(`{${i}}`, v));
        }
        return text;
    }

    function $fmt(n) {
        if (n >= 1000000000) return '€' + (n / 1000000000).toFixed(1) + 'B';
        if (n >= 1000000) return '€' + (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return '€' + (n / 1000).toFixed(0) + 'K';
        return '€' + n;
    }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function uid() { return 'p' + Date.now() + Math.random().toString(36).substr(2, 6); }

    // ==================== 球员生成 ====================
    function genName(region) {
        const names = NAMES[region] || NAMES['China'];
        const first = names.first[rand(0, names.first.length - 1)];
        const last = names.last[rand(0, names.last.length - 1)];
        if (LANG === 'zh') {
            return last + first;
        }
        return (first + (last ? ' ' + last : '')).trim();
    }

    function createPlayer(region, position, quality = 60) {
        const age = rand(16, 35);
        const posBonus = {
            GK: { pace: -20, shooting: -25, defending: 20, passing: 5 },
            CB: { pace: -5, shooting: -15, defending: 25, physical: 20 },
            LB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            RB: { pace: 15, shooting: 0, defending: 10, passing: 10 },
            CDM: { pace: 0, shooting: -5, defending: 15, passing: 15 },
            CM: { pace: 5, shooting: 10, defending: 5, passing: 18 },
            CAM: { pace: 10, shooting: 18, defending: -5, passing: 15 },
            LW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            RW: { pace: 22, shooting: 18, defending: -10, passing: 10 },
            ST: { pace: 12, shooting: 25, defending: -15, physical: 15 }
        };
        const b = posBonus[position] || {};
        const potential = Math.min(99, quality + rand(5, 22));
        const baseOvr = Math.max(30, Math.min(99, quality + rand(-8, 8)));
        const baseValue = Math.floor(baseOvr * 8000 * (age < 22 ? 1.6 : age < 26 ? 1.2 : age < 30 ? 0.8 : 0.35));
        return {
            id: uid(),
            name: genName(region),
            region,
            position,
            age,
            ovr: baseOvr,
            pace: Math.max(30, Math.min(99, rand(50, 85) + (b.pace || 0))),
            shooting: Math.max(30, Math.min(99, rand(40, 80) + (b.shooting || 0))),
            passing: Math.max(30, Math.min(99, rand(45, 85) + (b.passing || 0))),
            defending: Math.max(30, Math.min(99, rand(40, 80) + (b.defending || 0))),
            physical: Math.max(30, Math.min(99, rand(50, 85) + (b.physical || 0))),
            potential,
            fitness: rand(75, 100),
            morale: rand(60, 100),
            value: Math.floor(baseValue * rand(80, 120) / 100),
            wage: Math.floor(baseOvr * 80 * rand(80, 120) / 100),
            goals: 0, assists: 0, matches: 0
        };
    }

    // ==================== 游戏初始化 ====================
    function initGame() {
        const saved = localStorage.getItem('football_v3_save');
        if (saved) {
            try {
                game = JSON.parse(saved);
                return;
            } catch(e) {}
        }
        game = {
            budget: 5000000,
            team: [],
            league: [],
            facilities: { training: 1, academy: 1, stadium: 1 },
            season: 1, week: 1, day: 0,
            formation: '4-4-2', tactic: 'balance',
            market: [], prospects: [], news: []
        };
        // 生成22人阵容
        const positions = ['GK','CB','CB','CB','LB','RB','CDM','CM','CM','CAM','LW','RW','ST','ST','CM','CDM','CB','LB','RB','GK','CM','ST'];
        for (let i = 0; i < 22; i++) {
            game.team.push(createPlayer('China', positions[i], rand(58, 72)));
        }
        // 生成联赛
        const teamNames = {
            zh: ['FC联', '竞技俱乐部', '龙之队', '雄狮FC', '红星队', '蓝月亮', '绿茵FC', '凤凰FC', '银鹰SC', '金蛇队', '紫百合', '黑豹FC'],
            en: ['FC United', 'Athletic Club', 'Dragon FC', 'Lion SC', 'Red Stars', 'Blue Moon', 'Green FC', 'Phoenix FC', 'Silver Eagles', 'Golden Snakes', 'Violets', 'Panthers']
        };
        const names = teamNames[LANG];
        game.league = names.map((name, i) => ({
            name, index: i, strength: rand(38, 88),
            played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, pts: 0
        }));
    }

    function save() {
        localStorage.setItem('football_v3_save', JSON.stringify(game));
    }

    // ==================== 游戏逻辑 ====================
    function refreshMarket() {
        const q = 55 + game.facilities.academy * 3;
        game.market = [];
        const regions = Object.keys(NAMES);
        for (let i = 0; i < 6; i++) {
            const p = createPlayer(regions[rand(0, regions.length - 1)], ['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST'][rand(0, 9)], rand(q - 10, q + 15));
            p.askPrice = Math.floor(p.value * rand(75, 125) / 100);
            game.market.push(p);
        }
        save();
    }

    function scoutAcademy() {
        const count = 2 + Math.floor(game.facilities.academy / 2);
        const q = 42 + game.facilities.academy * 4;
        game.prospects = [];
        for (let i = 0; i < Math.min(count, 4); i++) {
            game.prospects.push(createPlayer('China', ['GK','CB','CM','ST'][rand(0, 3)], rand(q - 12, q + 12)));
        }
        addNews(LANG === 'zh' ? `🌟 青训营发现了 ${game.prospects.length} 名新星！` : `🌟 Academy found ${game.prospects.length} talents!`);
    }

    function trainTeam() {
        const bonus = 1 + game.facilities.training * 0.18;
        game.team.forEach(p => {
            if (p.age < 29 && p.ovr < p.potential) {
                const gain = Math.floor(rand(0, 2) * bonus);
                if (gain > 0) {
                    p.ovr = Math.min(p.potential, p.ovr + gain);
                    if (rand(1, 100) <= 25) {
                        const stats = ['pace', 'shooting', 'passing', 'defending', 'physical'];
                        p[stats[rand(0, 4)]] = Math.min(99, p[stats[rand(0, 4)]] + 1);
                    }
                }
            }
            p.fitness = Math.min(100, p.fitness + rand(8, 18));
        });
        addNews(t('trained'));
        save();
    }

    function simulateMatch() {
        const myLeague = game.league.find(l => l.name === (LANG === 'zh' ? 'FC联' : 'FC United'));
        const opp = game.league[rand(1, game.league.length - 1)];
        const tacticMod = { attack: { att: 20, def: -10 }, balance: { att: 0, def: 0 }, defend: { att: -10, def: 20 } };
        const mod = tacticMod[game.tactic] || { att: 0, def: 0 };
        
        let myStr = game.team.slice(0, 11).reduce((s, p) => s + p.ovr * (p.fitness / 100) * (p.morale / 100), 0) / 11;
        myStr *= (1 + mod.att / 100);
        const oppStr = opp.strength * rand(85, 115) / 100 * (1 - mod.def / 100);
        
        const myChance = myStr / (myStr + oppStr);
        let myGoals = 0, oppGoals = 0;
        for (let i = 0; i < rand(8, 15); i++) {
            if (Math.random() < myChance * 0.38) myGoals++;
            else if (Math.random() < (1 - myChance) * 0.32) oppGoals++;
        }
        
        // 更新积分
        myLeague.played++; opp.played++;
        myLeague.gf += myGoals; myLeague.ga += oppGoals;
        opp.gf += oppGoals; opp.ga += myGoals;
        if (myGoals > oppGoals) { myLeague.won++; myLeague.pts += 3; opp.lost++; }
        else if (myGoals === oppGoals) { myLeague.drawn++; myLeague.pts += 1; opp.drawn++; opp.pts += 1; }
        else { myLeague.lost++; opp.won++; opp.pts += 3; }
        
        const income = 120000 * game.facilities.stadium;
        game.budget += income;
        
        game.team.slice(0, 11).forEach(p => {
            p.matches++;
            p.fitness = Math.max(45, p.fitness - rand(10, 20));
            p.morale = Math.min(100, p.morale + (myGoals > oppGoals ? 6 : -4));
            if (Math.random() < 0.12) p.assists++;
        });
        
        game.week++;
        const result = { myScore: myGoals, oppScore: oppGoals, oppName: opp.name, income };
        
        const resultText = myGoals > oppGoals ? '🎉' : myGoals === oppGoals ? '🤝' : '😢';
        addNews(`${resultText} ${t('round', game.week - 1)}: FC United ${myGoals}-${oppGoals} ${opp.name} | ${t('income')}: ${$fmt(income)}`);
        
        if (game.week > 38) {
            game.season++;
            game.week = 1;
            game.league.sort((a, b) => b.pts - a.pts);
            const pos = game.league.findIndex(l => l.name === (LANG === 'zh' ? 'FC联' : 'FC United')) + 1;
            addNews(`🏆 ${t('season', game.season - 1)} ${LANG === 'zh' ? '结束！排名第' : 'Ended! Ranked #'}${'秩'.repeat(Math.max(0, 5 - Math.floor(pos / 2)))}${pos}`);
            game.league.forEach(l => {
                if (l.name !== (LANG === 'zh' ? 'FC联' : 'FC United')) l.strength = Math.max(35, Math.min(95, l.strength + rand(-6, 6)));
                l.played = l.won = l.drawn = l.lost = l.gf = l.ga = l.pts = 0;
            });
            game.budget += 2500000;
        }
        
        save();
        return result;
    }

    function addNews(text) {
        game.news.unshift({ text, time: Date.now() });
        if (game.news.length > 20) game.news = game.news.slice(0, 20);
    }

                                    <div>
                                        <div class="font-bold">${f.name[LANG]}</div>
                                        <div class="text-xs text-slate-400">${f.desc[LANG]}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-bold game-title text-cyan-300">Lv.${level}</div>
                                    <div class="text-xs text-slate-400">MAX 10</div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="upgradeFacility('${key}')" class="btn-game flex-1 text-xs ${canAfford&&level<10?'gold':'secondary'}" ${!canAfford||level>=10?'disabled':''}>
                                    ${level >= 10 ? (LANG==='zh'?'已满级':'MAX') : `⬆️ ${t('upgrade')} (${$fmt(cost)})`}
                                </button>
                            </div>
                            <div class="flex gap-1 mt-2">
                                ${Array.from({length: 10}).map((_, i) => `<div class="h-2 flex-1 rounded ${i < level ? 'bg-cyan-400' : 'bg-slate-700'}"></div>`).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    }

    function renderMatch() {
        const myLeague = game.league.find(l => l.name === (LANG === 'zh' ? 'FC联' : 'FC United'));
        const opp = game.league[rand(1, game.league.length - 1)];
        const opp2 = game.league[rand(1, game.league.length - 1)];
        
        return `
            <div class="card p-4 mb-3 text-center">
                <h3 class="font-bold text-lg mb-4">⚽ ${LANG==='zh'?'下一场比赛':'Next Match'}</h3>
                <div class="flex items-center justify-center gap-4">
                    <div class="text-center">
                        <div class="text-2xl mb-1">🔵</div>
                        <div class="font-bold">${LANG==='zh'?'FC联':'FC United'}</div>
                        <div class="text-xs text-slate-400">#${game.league.sort((a,b)=>b.pts-a.pts).findIndex(l=>l.name===(LANG==='zh'?'FC联':'FC United'))+1}</div>
                    </div>
                    <div class="text-3xl font-bold game-title text-slate-500">VS</div>
                    <div class="text-center">
                        <div class="text-2xl mb-1">🔴</div>
                        <div class="font-bold">${opp.name}</div>
                        <div class="text-xs text-slate-400">${LANG==='zh'?'实力':'STR'}: ${opp.strength}</div>
                    </div>
                </div>
            </div>
            
            <div class="card p-4 mb-3">
                <h4 class="font-bold text-sm mb-2">${LANG==='zh'?'比赛信息':'Match Info'}</h4>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <div class="bg-slate-800/50 p-2 rounded"><span class="text-slate-400">${LANG==='zh'?'阵型':'Formation'}:</span> <span class="text-cyan-300">${game.formation}</span></div>
                    <div class="bg-slate-800/50 p-2 rounded"><span class="text-slate-400">${LANG==='zh'?'战术':'Tactic'}:</span> <span class="text-cyan-300">${game.tactic === 'attack' ? (LANG==='zh'?'进攻':'Attack') : game.tactic === 'balance' ? (LANG==='zh'?'平衡':'Balance') : (LANG==='zh'?'防守':'Defend')}</span></div>
                    <div class="bg-slate-800/50 p-2 rounded"><span class="text-slate-400">${LANG==='zh'?'赛季':'Season'}:</span> ${game.season}</div>
                    <div class="bg-slate-800/50 p-2 rounded"><span class="text-slate-400">${LANG==='zh'?'当前积分':'Points'}:</span> <span class="text-amber-400">${myLeague.pts}</span></div>
                </div>
            </div>
            
            <button onclick="doMatch()" class="btn-game gold w-full text-lg py-4">⚽ ${t('play')}</button>
        `;
    }

    // ==================== 操作函数 ====================
    function doMatch() {
        const result = simulateMatch();
        const winText = result.myScore > result.oppScore ? '🎉 ' + (LANG === 'zh' ? '胜利！' : 'Victory!') : result.myScore === result.oppScore ? '🤝 ' + (LANG === 'zh' ? '平局！' : 'Draw!') : '😢 ' + (LANG === 'zh' ? '失利...' : 'Defeat...');
        alert(`${winText}\n\n${LANG === 'zh' ? 'FC联' : 'FC United'} ${result.myScore} - ${result.oppScore} ${result.oppName}\n\n💰 ${t('income')}: ${$fmt(result.income)}`);
        currentTab = 'home';
        render();
    }

    function upgradeFacility(key) {
        const costs = [50000, 100000, 200000, 400000, 800000, 1600000, 3200000, 6400000, 12800000];
        const cost = costs[Math.min(game.facilities[key] - 1, 8)];
        if (game.budget >= cost && game.facilities[key] < 10) {
            game.budget -= cost;
            game.facilities[key]++;
            addNews(LANG === 'zh' ? `🔧 ${key === 'training' ? '训练场' : key === 'academy' ? '青训营' : '体育场'} 升级到 Lv.${game.facilities[key]}！` : `🔧 ${key} upgraded to Lv.${game.facilities[key]}!`);
            showToast = t('upgraded');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    function signProspect(id) {
        const p = game.prospects.find(x => x.id === id);
        if (p && game.budget >= p.value * 0.3) {
            game.budget -= Math.floor(p.value * 0.3);
            game.team.push(p);
            game.prospects = game.prospects.filter(x => x.id !== id);
            addNews(LANG === 'zh' ? `✅ 签约新星 ${p.name}！` : `✅ Signed ${p.name}!`);
            showToast = t('signed');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    function rejectProspect(id) {
        game.prospects = game.prospects.filter(x => x.id !== id);
        render();
    }

    function buyPlayer(id) {
        const p = game.market.find(x => x.id === id);
        if (p && game.budget >= p.askPrice) {
            game.budget -= p.askPrice;
            game.team.push(p);
            game.market = game.market.filter(x => x.id !== id);
            addNews(LANG === 'zh' ? `💰 签下 ${p.name}！` : `💰 Signed ${p.name}!`);
            showToast = t('signed');
            save();
            render();
        } else {
            showToast = t('noMoney');
            render();
        }
    }

    // ==================== 启动 ====================
    initGame();
    render();
    </script>
</body>
</html>
