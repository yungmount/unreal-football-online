<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LPC Sprite Test</title>
<style>
  body { background: #1a1a2e; padding: 20px; }
  canvas { image-rendering: pixelated; }
  #results { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .item { text-align: center; }
  .item span { display: block; color: #fff; font: 12px monospace; margin-top: 4px; }
  .item.bad span { color: #f55; }
  .item.good span { color: #5f5; }
</style>
</head>
<body>
<h2 style="color:#fff">LPC Sprite Debug</h2>
<div id="results"></div>
<script>
const BASE = 'https://unreal-football-online-git-main-yungmounts-projects.vercel.app/lpc-assets/';
const results = document.getElementById('results');

function log(msg) {
  console.log(msg);
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'color:#0f0;font:12px monospace;';
  document.body.appendChild(d);
}

async function loadImg(path) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => {
      log(`❌ 404: ${path}`);
      resolve(null);
    };
    img.src = BASE + path;
  });
}

function extractFrame(img, frame, row) {
  const FW = 64, FH = 64;
  const c = document.createElement('canvas');
  c.width = FW; c.height = FH;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, frame * FW, row * FH, FW, FH, 0, 0, FW, FH);
  return ctx.getImageData(0, 0, FW, FH);
}

function showCanvas(title, img, frame, row, scale = 3, good = true) {
  const id = extractFrame(img, frame, row);
  const c = document.createElement('canvas');
  c.width = 64 * scale; c.height = 64 * scale;
  c.style.cssText = `image-rendering:pixelated;border:2px solid ${good ? '#0f0' : '#f55'}`;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.putImageData(id, 0, 0);
  ctx.drawImage(c, 0, 0, 64 * scale, 64 * scale);
  
  // 统计不透明像素
  let opaque = 0;
  for (let i = 0; i < id.data.length; i += 4) if (id.data[i+3] > 10) opaque++;
  
  const div = document.createElement('div');
  div.className = `item ${opaque > 50 ? 'good' : 'bad'}`;
  div.appendChild(c);
  const s = document.createElement('span');
  s.textContent = `${title}\n${opaque}px`;
  div.appendChild(s);
  results.appendChild(div);
  return opaque;
}

// 调色板
const skinLight = ['#271920','#99423c','#cc8665','#E4A47C','#F9D5BA','#FAECE7'];

function hexToRgb(hex) {
  hex = hex.replace('#','');
  return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
}

function applyPalette(id, src, dst) {
  const d = id.data;
  const map = {};
  src.forEach((s,i) => { map[s] = dst[i]; });
  const rgbMap = {};
  for (const [k,v] of Object.entries(map)) {
    const sk = hexToRgb(k), sv = hexToRgb(v);
    if (sk && sv) rgbMap[sk.join(',')] = sv;
  }
  for (let i = 0; i < d.length; i += 4) {
    if (d[i+3] > 10) {
      const k = `${d[i]},${d[i+1]},${d[i+2]}`;
      if (rgbMap[k]) { d[i]=rgbMap[k][0]; d[i+1]=rgbMap[k][1]; d[i+2]=rgbMap[k][2]; }
    }
  }
  return id;
}

async function test() {
  const sprites = [
    'body__bodies__male__idle.png',
    'head__heads__human__male__idle.png',
    'hair__plain__adult__idle.png',
    'torso__clothes__shortsleeve__shortsleeve__male__idle.png',
    'legs__shorts__shorts__male__idle.png',
    'feet__boots__basic__male__idle.png',
  ];
  
  for (const spr of sprites) {
    const img = await loadImg(spr);
    if (!img) continue;
    showCanvas(spr.split('__').slice(0,2).join('/'), img, 0, 0);
  }
  
  // 测试方向
  log('\n--- 方向测试 (body) ---');
  const bodyImg = await loadImg('body__bodies__male__idle.png');
  if (bodyImg) {
    for (let dir = 0; dir < 4; dir++) {
      showCanvas(`body dir=${dir}`, bodyImg, 0, dir);
    }
  }
  
  // 测试颜色重映射 (light → brown)
  log('\n--- 颜色重映射测试 ---');
  const brown = ['#120E10','#412B29','#5F4539','#76513A','#9C663E','#B8773F'];
  const body2 = await loadImg('body__bodies__male__idle.png');
  if (body2) {
    const id = extractFrame(body2, 0, 0);
    const remapped = applyPalette(id, skinLight, brown);
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    c.getContext('2d').putImageData(remapped, 0, 0);
    c.style.cssText = 'image-rendering:pixelated;border:2px solid #f80';
    const div = document.createElement('div');
    div.className = 'item';
    div.appendChild(c);
    const s = document.createElement('span');
    s.textContent = 'body light→brown';
    s.style.color = '#fff';
    div.appendChild(s);
    results.appendChild(div);
  }
}

test().then(() => log('Done!')).catch(e => log('Error: '+e));
</script>
</body>
</html>
